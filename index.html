/* A small compass rose and bar scale. Both are drawn at a size in feet that works
   out to a fixed size on screen, so they don't inflate as you zoom in. */
function compass(cx, cy, R){
  const ink = "#3A3A3C", paper = "#FDF9F7";
  /* one point of the rose: a lit half and a shadowed half, meeting on its axis */
  const pt = (a, len, w) => {
    const r = a*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
    const T = (x,y) => `${(cx+x*c-y*s).toFixed(2)} ${(cy+x*s+y*c).toFixed(2)}`;
    return `<path d="M ${T(0,-len)} L ${T(-w,0)} L ${T(0,0)} Z" fill="${ink}"/>` +
           `<path d="M ${T(0,-len)} L ${T(w,0)} L ${T(0,0)} Z" fill="${paper}" stroke="${ink}" stroke-width="${R*0.016}"/>`;
  };
  const ring = (rad, sw) => `<circle cx="${cx}" cy="${cy}" r="${R*rad}" fill="none" stroke="${ink}" stroke-width="${R*sw}"/>`;
  const ticks = Array.from({length:48}, (_,i) => {
    const r = i*7.5*Math.PI/180, r1 = R*0.615, r2 = R*0.685;
    return `<line x1="${(cx+r1*Math.sin(r)).toFixed(2)}" y1="${(cy-r1*Math.cos(r)).toFixed(2)}" x2="${(cx+r2*Math.sin(r)).toFixed(2)}" y2="${(cy-r2*Math.cos(r)).toFixed(2)}" stroke="${ink}" stroke-width="${R*0.022}" stroke-linecap="round"/>`;
  }).join("");
  const lbl = (a,t) => { const r = a*Math.PI/180;
    return `<text x="${(cx+R*0.90*Math.sin(r)).toFixed(2)}" y="${(cy-R*0.90*Math.cos(r)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="Lato,sans-serif" font-size="${R*0.235}" font-weight="700" fill="${ink}">${t}</text>`; };
  return `<g>
    ${ring(0.76,0.028)}${ring(0.575,0.020)}${ticks}
    ${[45,135,225,315].map(a=>pt(a, R*0.44, R*0.085)).join("")}
    ${[0,90,180,270].map(a=>pt(a, R*0.72, R*0.105)).join("")}
    ${lbl(0,"N")}${lbl(90,"E")}${lbl(180,"S")}${lbl(270,"W")}
  </g>`;
}
/* Standalone version for the fixed overlay, so it never scales with the map. */
function compassSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${compass(size/2, size/2, size/2)}</svg>`;
}
const NICE_FT = [1,2,3,5,10,15,20,25,50,75,100,150,200,300,500];
/* Round the bar to a sensible number of feet, then give back the pixel length that
   number actually occupies — so the label is always exact, not approximated. */
function scaleParts(ftPerPx, targetPx){
  const raw = ftPerPx * targetPx;
  const len = NICE_FT.reduce((a,b) => Math.abs(b-raw) < Math.abs(a-raw) ? b : a);
  return { len, px: Math.max(28, Math.round(len / ftPerPx)) };
}

/* ---------- zoom / pan, in feet ---------- */
let view = null, plotAR = null, fitW = null, plotW = null;
/* A peony held on the map is asking whether to give up its square. Held here rather
   than on the plant sheet, because the whole point is not having to open one. */
let mapAsk = null, mapAskAt = 0;
function closeMapAsk(){ mapAsk = null; }
/* Whether the view is still where the app put it, or somewhere you moved it to.
   A fresh view gets re-framed when the pane is measured; a moved one is left alone. */
let userMoved = false;
const mapAR = () => DB.property.widthFt / DB.property.depthFt;
/* The view takes the CONTAINER's aspect, not the map's — that's what makes a
   landscape map fill a portrait box instead of stretching inside it. */
function viewH(){ return view.w / (plotAR || mapAR()); }
/* There is no island floating over the map here, so the whole pane is the map's. */
function computeFitW(){
  const P = DB.property, ar = plotAR || mapAR();
  fitW = Math.max(P.widthFt, P.depthFt * ar);
  return fitW;
}
const restingX = w => (DB.property.widthFt - w) / 2;

function fitView(){
  const P = DB.property, w = computeFitW();
  view = { x: restingX(w), y: 0, w };
  view.y = (P.depthFt - viewH())/2;
}
/* The map rests on the whole property. It used to open on the rectangle the peonies
   occupy, which is more pixels a square but drops you somewhere on five hundred feet
   of ground with nothing around it to say where — and pinching in from the whole is
   one gesture, where finding your way out of a close view is several. */
function homeView(){ fitView(); }
/* Zoom about a fixed point, so whatever is under the fingers stays under them. */
function zoomAt(f, cx, cy){
  const w0 = view.w, lim = fitW || computeFitW();
  view.w = Math.max(15, Math.min(lim, w0 * f));
  userMoved = true;
  /* All the way out lands on the resting view, wherever the zoom started from. */
  if(view.w >= lim - 1e-6) return fitView();
  const k = view.w / w0;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  clampView();
}
/* Once the whole map fits across the pane there is nothing left to pan to, so it is
   parked in its resting place rather than left wherever a zoom happened to end. */
function clampView(){
  const P = DB.property, h = viewH();
  view.x = view.w >= P.widthFt ? restingX(view.w)
         : Math.max(0, Math.min(view.x, P.widthFt - view.w));
  view.y = h >= P.depthFt ? (P.depthFt - h)/2
         : Math.max(0, Math.min(view.y, P.depthFt - h));
}
/* Center the map on one plant, close enough that its square is workable. */
let focusId = null;
/* The ring is a pointer, not a state — it goes on the next thing you do. It's pulled
   straight out of the DOM rather than re-rendered, so clearing it can't disturb the
   tap that cleared it. */
function clearFocus(){
  if(focusId === null) return false;
  focusId = null;
  document.querySelectorAll("[data-focus]").forEach(n => n.remove());
  return true;
}
function focusOn(id){
  const p = DB.plants.find(x => x.id === id);
  if(!p || p.x === null) return;
  if(!plotAR) plotAR = mapAR();
  const w = Math.min(computeFitW(), 42);
  view = { x: p.x - w/2, y: 0, w };
  view.y = p.y - viewH()/2;
  clampView();
  focusId = id; userMoved = true;
  for(const ev of ["pointerdown","wheel","keydown"])
    document.addEventListener(ev, clearFocus, {once:true, capture:true});
}

/* Last line of defense: if the pane ever measures flat, give it an explicit height
   from the viewport. A zero-height pane hides the map, the tray and the compass all
   at once, so it must never be possible. */
function ensurePaneHeight(){
  const wrap = document.querySelector(".mapwrap"); if(!wrap) return;
  const r = wrap.getBoundingClientRect();
  if(r.height < 60) wrap.style.height = Math.max(300, window.innerHeight - r.top - 8) + "px";
}
/* The container's real shape isn't known until it's in the DOM. */
function syncPlotAR(){
  ensurePaneHeight();
  const plot = $("#plot"); if(!plot) return false;
  const r = plot.getBoundingClientRect();
  if(!r.width || !r.height) return false;
  plotW = r.width;
  const ar = r.width / r.height;
  if(plotAR === null || Math.abs(ar - plotAR)/ar > 0.01){ plotAR = ar; return true; }
  return false;
}

/* ---------- placing and moving, by thumb ---------- */
/* One rule for both: put a finger on a peony and drag it where it goes, whether it is
   already on the map or still in the tray. Nothing is armed and nothing is behind a
   button. What keeps three years of growth from moving under a careless thumb is the
   distance the finger has to travel before a tap becomes a drag, and the fact that
   what is carried rides above the fingertip so you can see the square you are aiming
   at rather than covering it with your own hand. */

/* Held rather than tapped, a peony on the map offers to give up its square without
   anything being opened first. Deliberately small: a whole sheet for one question is
   the very step this is here to save. */
function unplaceAsk(id){
  const p = findPlant(id);
  if(!p || p.x === null || !movable(p)) return "";
  const v = cultivar(p.cultivarId);
  return `<div class="psback" id="maBack"><div class="askcard">
    <p class="small"><strong>${esc(v.name || "Plant " + p.id)}</strong> — take it off the map?
      Its square at <span class="num">${p.x}, ${p.y}</span> ft comes free and it goes back to the
      tray to be placed again. Nothing else about it changes, and it is still here.</p>
    <div class="acts">
      <button class="btn" id="maCancel">Cancel</button>
      <button class="btn danger" id="maGo">Take Off the Map</button>
    </div></div></div>`;
}

function renderMap(app){
  const P = DB.property;
  if(!view) homeView();
  const h = viewH(), cl = clashes(), un = unmapped();
  const planned = mapped().filter(p => p.status === PLANNED);
  /* A marker is a feature of its square, not of the screen: it is always 0.38 of a
     cell across and can never spill into a neighbour. Zoomed out that leaves a plain
     dot; the number and the name appear once the cell is big enough to carry them. */
  const pxPerFt = (plotW || 390) / view.w;
  const cellPx  = CELL() * pxPerFt;
  const px      = n => n / pxPerFt;            // n screen pixels, expressed in feet
  /* Never smaller than a dot the eye can find: at the whole property 0.38 of a cell
     comes out under a pixel across, and a scatter of those is an empty map. Held to a
     floor they run together where the peonies are dense, which is the truth of it. */
  const R       = Math.max(CELL() * 0.38, px(3.4));
  const hitR    = Math.max(R, 15 / pxPerFt);   // a fingertip is about 15px across, not one
  const showNames = cellPx >= 30;              // a bare dot until the square can carry a label
  const hint = "tap to open · drag to move · pinch to zoom";

  const tray = un.length
    ? `<div class="tray" id="tray">
        <div class="tlabel"><span>To place — tap to open, drag onto the map</span><span class="num">${un.length}</span></div>
        <div class="chips">${un.map(p => `<button class="chip" data-place="${p.id}">${
          esc(cultivar(p.cultivarId).name || "Plant " + p.id)}</button>`).join("")}</div>
      </div>`
    : "";

  app.innerHTML = `
  <div class="mapwrap">
    <div class="plot" id="plot">
      <svg id="svg" viewBox="${view.x} ${view.y} ${view.w} ${h}" preserveAspectRatio="xMidYMid meet">
        ${baseMapFor(view.w, h)}
        ${/* The square takes the colour of the peony standing in it, so a plan reads as a
              plan whole — outline and wash together — rather than a charcoal dot sitting
              inside a rose square saying two different things at once. */
          cellPx >= 7 ? mapped().map(p=>`<rect data-cell="${p.id}" x="${cellX(p)*CELL()}" y="${cellY(p)*CELL()}"
           width="${CELL()}" height="${CELL()}" fill="${pinFill(p)}" fill-opacity=".10"
           stroke="${pinFill(p)}" stroke-width="${px(0.8)}" opacity=".55"/>`).join("") : ""}
        <rect id="ghostCell" x="0" y="0" width="0" height="0" fill="#C25A6D" fill-opacity=".2"
              stroke="#C25A6D" stroke-width="${px(2.2)}" opacity="0" pointer-events="none"/>
        ${/* Zoomed out to the whole property the markers run together, and which one
              covers which was down to the order the plants happen to sit in the file —
              so a row of them overlapped every which way. Drawn west to east instead:
              SVG paints in the order it reads, so the eastmost sits in front and the
              whole row leans the same way. */
          mapped().slice().sort((a,b) => a.x - b.x || a.y - b.y).map(p => { const v = cultivar(p.cultivarId);
          return `<g class="pin" data-pin="${p.id}"><title>${esc(v.name)}</title>
            <circle data-hit="1" cx="${p.x}" cy="${p.y}" r="${hitR}" fill="transparent"/>
            ${focusId===p.id?`<circle data-focus="1" cx="${p.x}" cy="${p.y}" r="${R*2.1}" fill="none"
                    stroke="#C25A6D" stroke-width="${px(2)}" opacity=".55"/>`:""}
            ${cl.ids.has(p.id)?`<circle data-crowd="1" cx="${p.x}" cy="${p.y}" r="${R*1.5}" fill="none"
                    stroke="#8A3D4C" stroke-width="${Math.min(R*0.3, px(2))}"/>`:""}
            <circle data-dot="1" cx="${p.x}" cy="${p.y}" r="${R}" fill="${pinFill(p)}"
                    stroke="#fff" stroke-width="${Math.min(R*0.22, px(1.4))}"/>
            ${showNames?`<text data-py="${p.y}" x="${p.x}" y="${p.y+R+px(13)}" text-anchor="middle" font-family="Lato,sans-serif"
                  font-size="${px(12)}" fill="#3A3A3C" stroke="#FDF9F7" stroke-width="${px(2.4)}"
                  paint-order="stroke">${esc(v.name)}</text>`:""}
          </g>`; }).join("")}
      </svg>

      <div class="maptop">
        <h2>${esc(P.name)}</h2>
        <span class="small muted">${mapped().length} placed${
          planned.length?` · ${planned.length} planned`:""}${
          un.length?` · ${un.length} to place`:""}${
          cl.pairs.length?` · <span class="warn">${cl.pairs.length} crowded</span>`:""} · ${hint}</span>
      </div>
      <div class="compass">${compassSvg(48)}</div>
      <div class="scalebar"><span id="sbText"></span><div class="sbbar" id="sbBar"></div></div>

      ${tray}
    </div>
  </div>`;

  /* The container's shape decides the view, so measure it and settle once. */
  if(syncPlotAR()){
    computeFitW();
    if(userMoved) clampView(); else homeView();
    return renderMap(app);
  }

  const sheetFor = openPlant !== null ? findPlant(openPlant) : null;
  if(sheetFor){ app.insertAdjacentHTML("beforeend", plantSheet(sheetFor)); wirePlantSheet(app, sheetFor); }
  if(mapAsk !== null && !sheetFor) app.insertAdjacentHTML("beforeend", unplaceAsk(mapAsk));

  wireMap();
}

let resizeT = null;
const remap = () => {
  if(!DB || !location.hash.startsWith("#/map")) return;
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { plotAR = null; render(); }, 150);
};
window.addEventListener("resize", remap);
window.addEventListener("orientationchange", remap);

/* Cheap enough to run on every pinch tick, which keeps the reading honest while
   the full re-render is still deferred. */
function paintScale(){
  const bar = $("#sbBar"), txt = $("#sbText");
  if(!bar || !txt) return;
  const s = scaleParts(view.w / (plotW || 390), 92);
  bar.style.width = s.px + "px";
  txt.textContent = s.len + " ft";
}
const setDragging = on => document.body.classList.toggle("dragging", on);

function wireMap(){
  const plot = $("#plot"), svg = $("#svg"); if(!plot || !svg) return;
  paintScale();
  /* Everything that floats over the foot of the map is measured once and the rest is
     told how tall it came out, so the scale bar and the buttons clear it exactly. */
  const trayEl = $("#tray");
  plot.style.setProperty("--trayh", (trayEl ? trayEl.offsetHeight : 0) + "px");

  /* Screen pixels to map feet, straight off the SVG's own matrix — exact whatever the
     container does, including the letterboxing from xMidYMid meet. */
  const pt = svg.createSVGPoint();
  const toFt = ev => { pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const clampP = (v,max) => Math.max(0, Math.min(max, Math.round(v*10)/10));
  const byId = new Map(DB.plants.map(p => [p.id, p]));
  /* A peony is drawn at a size chosen for the screen rather than for the ground: the
     dot has a floor under it so it cannot vanish when the whole property is in view,
     its white edge is a fixed thickness, the rings around it are others, and its name
     is twelve pixels. All of that is written in map units worked out from the zoom at
     the moment of drawing — so a pinch, which moves the viewBox without redrawing,
     left every one of them meaning what it meant before the gesture, and they only
     came right when the fingers came off. Re-sized on every tick instead. */
  function paintMarks(){
    const per = (plotW || 390) / view.w;          // screen pixels to the foot, right now
    const ft = n => n / per;
    const R = Math.max(CELL() * 0.38, ft(3.4));
    const cellPx = CELL() * per;
    const set = (sel, fn) => svg.querySelectorAll(sel).forEach(fn);

    set("[data-hit]",   c => c.setAttribute("r", Math.max(R, ft(15))));
    set("[data-dot]",   c => { c.setAttribute("r", R);
                               c.setAttribute("stroke-width", Math.min(R * 0.22, ft(1.4))); });
    set("[data-focus]", c => { c.setAttribute("r", R * 2.1);
                               c.setAttribute("stroke-width", ft(2)); });
    set("[data-crowd]", c => { c.setAttribute("r", R * 1.5);
                               c.setAttribute("stroke-width", Math.min(R * 0.3, ft(2))); });
    /* The squares and the names each have a width of square below which a redraw would
       not draw them at all, so the gesture drops them at the same place. */
    set("[data-cell]",  r => { r.style.display = cellPx >= 7 ? "" : "none";
                               r.setAttribute("stroke-width", ft(0.8)); });
    const gc = svg.querySelector("#ghostCell");
    if(gc) gc.setAttribute("stroke-width", ft(2.2));
    set(".pin text", t => {
      const show = cellPx >= 30;
      t.style.display = show ? "" : "none";
      if(!show) return;
      t.setAttribute("font-size", ft(12));
      t.setAttribute("stroke-width", ft(2.4));
      t.setAttribute("y", Number(t.dataset.py) + R + ft(13));
    });
  }
  const applyView = () => {
    svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${viewH()}`);
    paintMarks();
  };

  /* One gesture at a time, whatever number of fingers arrives. `mode` is what this
     touch turned out to be; it is decided on the first finger down and never changes
     under you mid-gesture. */
  const pts = new Map();
  let mode = null, pan = null, pinch = null, drag = null;
  let downPin = null, down = null, moved = false, lastTap = 0;
  /* How far a finger has to travel before it is moving a peony rather than tapping
     one. Below this a graze across the map leaves everything where it was. */
  const DRAG_MIN = 7;
  /* Long enough that resting a thumb on the way to a drag does not ask, short enough
     that the question feels like an answer to the hold. The same as the plant sheet's. */
  const HOLD_MS = 500;
  let holdT = null;
  const dropHold = () => clearTimeout(holdT);
  let settleT = null;
  /* Markers are drawn at a size that depends on the zoom, so once the fingers are off
     the map is redrawn properly. During the gesture only the viewBox moves. */
  const settle = () => { clearTimeout(settleT); settleT = setTimeout(() => render(), 130); };

  function startDrag(pin, e){
    const p = byId.get(Number(pin.dataset.pin));
    if(!p) return false;
    const s = toFt(e);
    /* Every child moves, and each keeps the offset it started with — reading the offset
       afresh on each move would compound it and the label would drift away. */
    const parts = [...pin.querySelectorAll("circle"), ...pin.querySelectorAll("text")].map(n => ({
      n,
      ax: n.tagName === "circle" ? "cx" : "x",
      ay: n.tagName === "circle" ? "cy" : "y",
      dx: +n.getAttribute(n.tagName === "circle" ? "cx" : "x") - p.x,
      dy: +n.getAttribute(n.tagName === "circle" ? "cy" : "y") - p.y,
    }));
    drag = { p, s, x0:p.x, y0:p.y, parts, id:e.pointerId,
             cell: svg.querySelector(`[data-cell="${p.id}"]`) };
    setDragging(true);
    return true;
  }
  function moveDrag(ev){
    const c = toFt(ev), d = drag, p = d.p;
    p.x = clampP(d.x0 + (c.x - d.s.x), DB.property.widthFt);
    p.y = clampP(d.y0 + (c.y - d.s.y), DB.property.depthFt);
    d.parts.forEach(q => { q.n.setAttribute(q.ax, p.x + q.dx); q.n.setAttribute(q.ay, p.y + q.dy); });
    if(d.cell){                                   // preview the square it will land in
      const t = snapFree(p.x, p.y, p.id);
      if(t){ d.cell.setAttribute("x", t.x - CELL()/2); d.cell.setAttribute("y", t.y - CELL()/2); }
    }
  }
  function endDrag(){
    const d = drag; drag = null; setDragging(false);
    if(!d) return;
    const p = d.p, q = snapFree(p.x, p.y, p.id);
    if(q){ p.x = q.x; p.y = q.y; }
    else { p.x = d.x0; p.y = d.y0; toast("No free square nearby"); }
    markDirty(); render();
  }

  plot.addEventListener("pointerdown", e => {
    /* The tray sits inside the plot, so it gets first refusal. */
    if(e.target.closest(".tray")) return;
    e.preventDefault();
    plot.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(mode === "drag") return;            // more fingers during a move are ignored

    if(pts.size === 1){
      moved = false;
      downPin = e.target.closest("[data-pin]");
      down = { x:e.clientX, y:e.clientY, clientX:e.clientX, clientY:e.clientY, pointerId:e.pointerId };
      /* A finger on a peony is held open: a tap once it lifts, a move once it travels,
         and a question if it stays put long enough to mean it. Which it turns out to be
         is not decided here. */
      if(downPin){
        mode = "pin";
        const id = Number(downPin.dataset.pin);
        clearTimeout(holdT);
        holdT = setTimeout(() => {
          if(mode !== "pin") return;                 // it became a drag; leave it alone
          mode = null; pts.clear();
          const p = byId.get(id);
          /* Holding a crown that is in the ground would otherwise do nothing at all,
             which is indistinguishable from the hold not having registered. */
          if(p && !movable(p)) return toast("In the ground — divide it to take it off the map");
          mapAsk = id; mapAskAt = Date.now();
          render();
        }, HOLD_MS);
        return;
      }
      mode = "pan";
      pan = { x0:view.x, y0:view.y, sx:e.clientX, sy:e.clientY,
              ftPerPx: view.w / plot.getBoundingClientRect().width };
    }else if(pts.size === 2){
      dropHold();                                  // two fingers is a pinch, not a hold
      const [a,b] = [...pts.values()];
      const cx = (a.x + b.x)/2, cy = (a.y + b.y)/2;
      mode = "pinch"; moved = true;
      pinch = { d0: Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)), w0: view.w,
                ft: toFt({ clientX:cx, clientY:cy }) };
    }
  });

  plot.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(down && Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 8) moved = true;
    /* Travelling at all means this is not a hold any more, whatever else it becomes. */
    if(down && Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 3) dropHold();

    if(mode === "drag"){ if(e.pointerId === drag.id) moveDrag(e); return; }

    /* Far enough to mean it: the peony comes with the finger. The drag is measured from
       where the finger first landed, not from here, so the marker does not jump out
       from under it as it starts. */
    if(mode === "pin"){
      if(e.pointerId !== down.pointerId) return;
      if(Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) <= DRAG_MIN) return;
      /* A finger that travels off a crown in the ground takes the map with it instead
         of the peony — measured from where it first landed, so the map does not jump.
         A tap on it still opens the plant; only the travelling is different. */
      const held = byId.get(Number(downPin.dataset.pin));
      if(held && !movable(held)){
        mode = "pan"; moved = true;
        pan = { x0:view.x, y0:view.y, sx:down.x, sy:down.y,
                ftPerPx: view.w / plot.getBoundingClientRect().width };
        return;
      }
      if(startDrag(downPin, down)){ mode = "drag"; moved = true; moveDrag(e); }
      else mode = null;
      return;
    }

    if(mode === "pinch" && pts.size >= 2){
      const [a,b] = [...pts.values()];
      const d = Math.max(1, Math.hypot(a.x-b.x, a.y-b.y));
      const lim = fitW || computeFitW();
      view.w = Math.max(15, Math.min(lim, pinch.w0 * (pinch.d0 / d)));
      userMoved = true;
      /* The point that was between the fingers stays between them. */
      const r = plot.getBoundingClientRect();
      const cx = (a.x + b.x)/2 - r.left, cy = (a.y + b.y)/2 - r.top;
      view.x = pinch.ft.x - (cx / r.width) * view.w;
      view.y = pinch.ft.y - (cy / r.height) * viewH();
      clampView(); applyView(); paintScale();
      return;
    }

    if(mode === "pan"){
      if(!moved) return;
      userMoved = true;
      view.x = pan.x0 - (e.clientX - pan.sx) * pan.ftPerPx;
      view.y = pan.y0 - (e.clientY - pan.sy) * pan.ftPerPx;
      clampView(); applyView();
    }
  });

  const lift = e => {
    dropHold();
    if(!pts.has(e.pointerId) && mode !== "drag") return;
    pts.delete(e.pointerId);

    if(mode === "drag"){
      if(e.pointerId === drag.id){ endDrag(); mode = null; pts.clear(); }
      return;
    }
    if(mode === "pinch"){
      if(pts.size >= 2) return;
      if(pts.size === 1){
        /* One finger left: carry on as a pan from wherever it is now. */
        const [only] = [...pts.values()];
        mode = "pan"; moved = true;
        pan = { x0:view.x, y0:view.y, sx:only.x, sy:only.y,
                ftPerPx: view.w / plot.getBoundingClientRect().width };
        return;
      }
      mode = null; settle(); return;
    }
    /* Down on a peony and never travelled: a tap, and a tap opens it. */
    if(mode === "pin" && pts.size === 0){
      mode = null;
      if(downPin){ openPlant = Number(downPin.dataset.pin); return render(); }
      return;
    }
    if(mode === "pan" && pts.size === 0){
      mode = null;
      if(moved){ settle(); return; }
      /* A tap on bare ground. Twice over is the way in now that the buttons are gone;
         spreading two fingers is the way back out. */
      const now = Date.now();
      if(now - lastTap < 320){ lastTap = 0; const c = toFt(e); zoomAt(0.55, c.x, c.y); return render(); }
      lastTap = now;
    }
  };
  plot.addEventListener("pointerup", lift);
  plot.addEventListener("pointercancel", e => {
    dropHold();
    pts.delete(e.pointerId);
    if(mode === "drag" && drag){ endDrag(); }
    if(!pts.size) mode = null;
  });

  /* A trackpad or a mouse, for whoever opens the pocket edition on a laptop. */
  plot.addEventListener("wheel", e => {
    e.preventDefault();
    const c = toFt(e);
    if(e.ctrlKey || e.metaKey) zoomAt(e.deltaY > 0 ? 1/0.86 : 0.86, c.x, c.y);
    else{
      const r = plot.getBoundingClientRect(), k = view.w / r.width;
      view.x += e.deltaX * k; view.y += e.deltaY * k;
      userMoved = true; clampView();
    }
    applyView(); paintScale(); settle();
  }, {passive:false});

  /* ---- the question a held peony asks ---- */
  /* The finger that started the hold is still down when the question appears, and its
     lift lands on whatever is now under it. So the backdrop ignores anything that
     arrives in the moment right after — otherwise letting go dismissed the question
     that letting go had just raised. */
  const maBack = $("#maBack");
  if(maBack) maBack.onclick = e => {
    if(e.target !== maBack) return;
    if(Date.now() - mapAskAt < 450) return;
    closeMapAsk(); render();
  };
  const maCancel = $("#maCancel");
  if(maCancel) maCancel.onclick = () => { closeMapAsk(); render(); };
  const maGo = $("#maGo");
  if(maGo) maGo.onclick = () => {
    const p = findPlant(mapAsk);
    if(!p) { closeMapAsk(); return render(); }
    const was = `${p.x}, ${p.y}`;
    unplacePlant(p);
    closeMapAsk();
    render();
    saveNow(`Plant ${p.id} taken off the map — ${was} ft is free`);
  };

  /* ---- planting one out of the tray ---- */
  /* The rail scrolls sideways and a peony lifts out of it upwards, so the two gestures
     never argue over the same finger. Nothing is written until the finger lifts. */
  const CARRY_UP = 34;                 // how far above the fingertip the peony rides, in px
  const ghostCell = svg.querySelector("#ghostCell");
  let carry = null;

  /* The square it would land in, shown on the map itself rather than under the hand,
     and in the colour the peony will be once it is in it. */
  function paintCell(t, fill){
    if(!ghostCell) return;
    if(!t){ ghostCell.setAttribute("opacity", "0"); return; }
    if(fill){ ghostCell.setAttribute("fill", fill); ghostCell.setAttribute("stroke", fill); }
    ghostCell.setAttribute("x", t.x - CELL()/2);
    ghostCell.setAttribute("y", t.y - CELL()/2);
    ghostCell.setAttribute("width", CELL());
    ghostCell.setAttribute("height", CELL());
    ghostCell.setAttribute("opacity", "1");
  }
  function carryTo(e){
    const r = plot.getBoundingClientRect();
    const at = { clientX: e.clientX, clientY: e.clientY - CARRY_UP };
    carry.ghost.style.left = (at.clientX - r.left) + "px";
    carry.ghost.style.top  = (at.clientY - r.top - 12) + "px";
    const c = toFt(at);
    carry.at = snapFree(c.x, c.y, carry.p.id);
    carry.ghost.classList.toggle("nowhere", !carry.at);
    paintCell(carry.at, dropFill(carry.p));
  }
  function startCarry(chip, e){
    const p = byId.get(Number(chip.dataset.place));
    if(!p) return;
    const ghost = document.createElement("div");
    ghost.className = "ghost" + (NOT_YET_IN.includes(p.status) ? " planned" : "");
    ghost.textContent = cultivar(p.cultivarId).name || "Plant " + p.id;
    plot.appendChild(ghost);
    chip.classList.add("carrying");
    chip.setPointerCapture(e.pointerId);
    carry = { p, chip, ghost, id:e.pointerId, at:null };
    setDragging(true);
    carryTo(e);
  }
  function endCarry(drop){
    const c = carry; carry = null; setDragging(false);
    if(!c) return;
    c.ghost.remove(); c.chip.classList.remove("carrying"); paintCell(null);
    if(!drop) return;
    if(!c.at) return toast("No free square there");
    c.p.x = c.at.x; c.p.y = c.at.y;
    const planned = planOnPlace(c.p);
    markDirty(); render();
    toast(`${cultivar(c.p.cultivarId).name || "Plant " + c.p.id} ${
      planned ? "planned for" : "placed at"} ${c.at.x}, ${c.at.y} ft`);
  }

  /* One finger on the rail is one of three things, and the rail decides which rather
     than leaving it to the browser: lifted out of the tray, scrolling the rail along,
     or a tap that did neither.

     Up is the whole of the test. The rail cannot scroll upwards, so any upward travel
     is unambiguous whatever it is doing sideways at the same time — which is what makes
     a diagonal drag straight out onto the map work as readily as a vertical one. */
  const rail = $("#tray") && $("#tray").querySelector(".chips");
  if(rail){
    const LIFT_UP = 8, RAIL_SIDE = 10;
    let from = null;
    rail.addEventListener("pointerdown", e => {
      const chip = e.target.closest("[data-place]");
      from = { x:e.clientX, y:e.clientY, id:e.pointerId, chip,
               scroll:rail.scrollLeft, how:null };
      rail.setPointerCapture(e.pointerId);
    });
    rail.addEventListener("pointermove", e => {
      if(carry){ if(e.pointerId === carry.id){ e.preventDefault(); carryTo(e); } return; }
      if(!from || e.pointerId !== from.id) return;
      const dx = e.clientX - from.x, dy = e.clientY - from.y;
      if(!from.how){
        if(from.chip && dy <= -LIFT_UP) from.how = "lift";
        else if(Math.abs(dx) >= RAIL_SIDE) from.how = "rail";
      }
      if(from.how === "lift"){ e.preventDefault(); startCarry(from.chip, e); }
      else if(from.how === "rail") rail.scrollLeft = from.scroll - dx;
    });
    rail.addEventListener("pointerup", e => {
      if(carry && e.pointerId === carry.id){ endCarry(true); from = null; return; }
      /* A tap that became neither a lift nor a scroll is a question, not a fumble — the
         same question a peony on the map answers when it is tapped. */
      if(from && e.pointerId === from.id && !from.how && from.chip){
        const id = Number(from.chip.dataset.place);
        from = null;
        openPlant = id;
        return render();
      }
      from = null;
    });
    rail.addEventListener("pointercancel", e => {
      if(carry && e.pointerId === carry.id) endCarry(false);
      from = null;
    });
  }
}

/* ---------- boot ---------- */
/* Safety net: a stuck drag class would leave the whole page unselectable. */
window.addEventListener("pointerup", () => setDragging(false));
window.addEventListener("pointercancel", () => setDragging(false));
window.addEventListener("blur", () => setDragging(false));

$("#stateBtn").onclick = () => { if(!DB) return; dataOpen = true; render(); };

/* A phone is put down mid-sentence far more often than a laptop is, and iOS can freeze
   or discard the page while it is in the background. Whatever is outstanding goes into
   storage the moment the screen turns away. */
document.addEventListener("visibilitychange", () => {
  if(document.hidden && dirty && Store.ready) saveNow(null, true);
});
window.addEventListener("pagehide", () => { if(dirty && Store.ready) saveNow(null, true); });

/* Hardware keyboards exist on iPads and on the desk this file also opens on. */
document.addEventListener("keydown", e => {
  if((e.metaKey||e.ctrlKey) && e.key === "s"){ e.preventDefault(); if(dirty) saveNow(); return; }
  if(e.key !== "Escape") return;
  if(dataOpen){ dataOpen = false; return render(); }
  if(draftCultivar){ discardCultivarDraft(); return render(); }
  if(draftBloom){ discardBloomDraft(); return render(); }
  if(draftTxn){ discardTxnDraft(); return render(); }
  if(openTxn !== null){
    if(armDelete || armPlant){ armDelete = armPlant = false; return render(); }
    return closeTxnView();
  }
  if(photoFor !== null){ photoFor = null; draftCrop = null; return render(); }
  if(draftDivide){ discardDivide(); return render(); }
  if(armPlantOne){ armPlantOne = false; return render(); }
  if(armDividePlant){ armDividePlant = false; return render(); }
  if(openPlant !== null){
    const p = findPlant(openPlant), cid = p && p.cultivarId;
    const onMap = location.hash.startsWith("#/map");
    if(p && isDraft(p)) discardDraft(); else { editing = null; openPlant = null; }
    if(onMap) return render();
    location.hash = cid ? "#/collection/" + encodeURIComponent(cid) : "#/collection";
    render();
  }
});

/* Nothing left can lose an afternoon to a closed tab. The repository writes this
   browser's own copy before it ever reaches for the wire, and the read-through ways in
   write nothing else at all — so every edit is already on this phone by the time the
   tab goes, and a prompt asking whether you really meant it would only ever be wrong.
   Kept as a guard for the one case that is genuinely unsaved: nothing open yet. */
window.addEventListener("beforeunload", e => {
  if(dirty && !Store.ready){ e.preventDefault(); e.returnValue = ""; }
});

/* ---------- keeping up with the other device ---------- */
/* Picking the phone up is the moment to ask whether the desktop wrote anything while
   it was in your pocket, and to send anything this phone is still holding. Never when
   there is an edit in progress here — that is never overwritten. */
let checking = false;
async function catchUp(){
  if(checking || !DB || !Store.isRepo) return;
  checking = true;
  try{
    if(Store.unsent){ await Store.flush(); paintFileState(); }
    else if(await Store.remoteChanged() && !dirty){
      DB = await Store.reload();
      render(); paintFileState();
      toast("Updated \u2014 these records were saved elsewhere");
    }
  }catch(e){ if(e.kind === "conflict") await resolveConflict(); }
  finally{ checking = false; }
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) catchUp(); });
window.addEventListener("focus", catchUp);
window.addEventListener("online", catchUp);

if("serviceWorker" in navigator)
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

(async function boot(){
  try{
    if(await Store.restore()){ DB = await Store.load(); }
  }catch(e){ /* fall through to the way-in screen */ }

  if(!DB){
    try{ cachedSave = await Store.cached(); }catch(e){ cachedSave = null; }
    /* Edits that never made it home outrank the file sitting next door, so they are
       offered rather than quietly passed over. */
    if(!(cachedSave && cachedSave.unsent) && Store.servedCapable){
      try{
        DB = await Store.openServed();
        await Photos.loadAll(DB);
        cachedSave = null;
      }catch(e){ /* not served after all, or no file beside us */ }
    }
  }

  render();
  if(DB) settleOnLoad();
})();
</script>
</body>
