<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the graphite bar run under the status bar and the tab bar
     under the home indicator; every edge then pays its own safe-area inset back. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peonies">
<meta name="theme-color" content="#3A3A3C">
<meta name="format-detection" content="telephone=no">
<title>Plattner Peonies &amp; Farmstead</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Plattner Peonies & Farmstead — pocket edition
   The same farm, the same brand, the same farm-data.json. Everything here is
   sized for a thumb on a portrait phone: one column, 44px targets, sheets that
   rise from the bottom, and a tab bar where iOS expects one.
   ========================================================================== */
:root{
  --rose:#C25A6D; --rose-dark:#8A3D4C; --rose-tint:#F7E7EA;
  --graphite:#3A3A3C; --graphite-60:#8A8A8C; --graphite-30:#C9C9CB;
  --cream:#FDF9F7; --card:#FFFFFF; --line:#E8E2DF;
  --radius:10px;
  --pad:14px;
  --tabh:58px;
  /* Safari reports a taller bottom inset while its toolbar is expanded, and the toolbar
     stays expanded on a screen too short to scroll. Unclamped, that padded the tab bar
     out to nearly twice its height on whichever screen happened to be empty — the tabs
     riding up with a bare strip left underneath them. The home indicator is 34px at its
     tallest on any iPhone, so that is as far as this ever needs to reach. */
  --safe-b:min(env(safe-area-inset-bottom,0px),34px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream); color:var(--graphite);
  font-family:'Lato',-apple-system,system-ui,sans-serif; font-weight:400;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* A tap should never leave a grey box behind; the app draws its own press states. */
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  /* Every screen stands at least as tall as the window. Bloom, before the season's
     first day is recorded, is the one screen with too little on it to reach the
     bottom edge on its own, and a document that stops short is where iOS stops
     agreeing with itself about where the fixed tab bar and its safe-area padding
     belong — the bar came out near double height with a bare strip beneath it.
     Filling the window costs the other four nothing: they already overflow it. */
  display:flex; flex-direction:column; min-height:100vh;
}
@supports (height:100dvh){ body{min-height:100dvh} }
h1,h2,.display{
  font-family:'Baskervville',Georgia,serif; text-transform:uppercase;
  letter-spacing:.08em; font-weight:400; margin:0;
}
h2{font-size:23px;line-height:1.15}
h3{font-family:'Lato',sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;
   text-transform:uppercase;color:var(--graphite-60);margin:0 0 10px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--rose-dark);text-decoration:none}
button{font-family:'Lato',sans-serif;font-size:15px;cursor:pointer}
.small{font-size:13.5px}
.muted{color:var(--graphite-60)}
.warn{color:var(--rose-dark);font-weight:700}
.section{margin:18px 0 0}
.grow{flex:1;min-width:0}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--graphite);padding-top:var(--safe-t)}
header{
  background:var(--graphite);color:var(--cream);
  padding:10px var(--pad) 11px;display:flex;align-items:center;gap:10px;
}
header .mark{width:26px;height:26px;flex:none}
header h1{
  color:var(--cream);flex:1;min-width:0;line-height:1.1;
  /* Baskervville set small and wide. The floor is what an original SE can carry: the
     name is the brand, so it is the thing given the room rather than the thing cut. */
  font-size:clamp(10.5px,3.35vw,14px);letter-spacing:.085em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* On the narrowest phones the state pill gives up its word and keeps its dot, which
   is the half that was carrying the meaning anyway. */
@media (max-width:369px){
  .statebtn{padding:0;width:32px;justify-content:center}
  .statebtn #fileState{display:none}
  /* And the tracking comes in a little, which buys the last few pixels. */
  header{gap:8px}
  header h1{letter-spacing:.05em}
}
main{flex:1 1 auto;padding:16px var(--pad) calc(var(--tabh) + var(--safe-b) + 26px)}

/* The state pill is the one way into the data sheet: what file this is, whether it
   is written yet, and how to send it back where it came from. */
.statebtn{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  background:rgba(253,249,247,.12);border:1px solid rgba(253,249,247,.22);
  color:var(--cream);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;min-height:32px;
}
.statebtn:active{background:rgba(253,249,247,.24)}
/* The sandbox says so on the bar, in every screen, because the one thing that must
   never happen is typing into it believing it is the farm — or the other way about. */
.sandtag{
  flex:none;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:var(--rose);color:#fff;border-radius:5px;padding:3px 6px;line-height:1;
}
body.sandbox .topbar,body.sandbox header{background:#4A3A3E}
.statebtn.hide{display:none}
/* Nothing waiting: the dot alone, and the wordmark gets the room back. */
.statebtn.quiet{padding:0;width:32px;justify-content:center}
.statebtn.quiet #fileState{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--graphite-60);flex:none}
.dot.ok{background:#7FA663} .dot.dirty{background:var(--rose)}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(253,249,247,.94);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;
  height:var(--tabh);color:var(--graphite-60);
}
/* No word under the icon, so the icon takes the room the word had. */
.tab svg{width:26px;height:26px;display:block}
/* The mark is a solid silhouette where the rest are 1.6px line drawings, so it is set
   a little smaller to carry the same weight. */
.tab .markicon{width:24px;height:24px}
.tab.on{color:var(--rose)}
.tab:active{background:var(--rose-tint)}
.tabbar.hide{display:none}
/* Nothing open yet: no tabs to show, so the page keeps its own foot. */
body.nofile main{padding-bottom:44px}

/* ---------- controls ---------- */
.btn{
  background:transparent;border:1px solid var(--graphite-30);color:var(--graphite);
  padding:0 16px;min-height:44px;border-radius:var(--radius);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:14.5px;letter-spacing:.02em;
}
.btn:active{background:#fff;border-color:var(--graphite-60)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:active{background:var(--rose-dark);border-color:var(--rose-dark)}
.btn.danger{border-color:#E0BDBD;color:#A32D2D}
.btn.danger:active{background:#FCEBEB;border-color:#A32D2D}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 16px is the size below which iOS zooms the page in on focus, so no field is smaller. */
input,select,textarea{
  font-family:'Lato',sans-serif;font-size:16px;color:var(--graphite);
  background:#fff;border:1px solid var(--graphite-30);border-radius:var(--radius);
  padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none;
  /* A date field carries an intrinsic minimum width of its own. Left alone it pushes
     its grid track wider than the column it was given and the pair walks off the
     screen edge, so it is told plainly that it may be as narrow as its share. */
  min-width:0;
}
select{
  padding-right:34px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%238A8A8C' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint)}
input[type="date"]{min-height:44px;line-height:22px}
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-month-field,
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-day-field,
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-year-field{color:transparent}
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-text{color:var(--graphite-30)}
textarea{resize:none;min-height:84px}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--graphite-60);margin:0 0 5px}
.ro{font-size:15.5px;padding:9px 0;min-height:42px;color:var(--graphite)}
.ro.muted{color:var(--graphite-60)}

/* One column, always. The twelve-column spans the shared markup asks for all collapse
   to the full width here — a phone has room for exactly one field. */
.fieldrow{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
.fieldrow:last-child{margin-bottom:0}
.fieldrow > div{grid-column:1/-1 !important;min-width:0}
/* Two short fields do fit side by side, and dates read better paired. */
.fieldrow.pair{grid-template-columns:1fr 1fr}
.fieldrow.pair > div{grid-column:auto !important}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.card.editing{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint)}

/* The list row is the workhorse of this edition: a lead line, a quieter line under it,
   something aligned right, and a chevron when the whole row is a way somewhere. */
.li{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line);
  background:none;border-left:none;border-right:none;border-top:none;color:inherit;
  font-family:'Lato',sans-serif;font-size:16px;
}
.li:last-child{border-bottom:none}
.li:active{background:var(--rose-tint)}
.li .body{flex:1;min-width:0;overflow:hidden}
/* display:block is load-bearing. These are spans, and overflow and text-overflow do
   nothing at all on an inline box — a long cultivar name would simply run out of its
   row and under the figure on the right instead of ending in an ellipsis. */
.li .lead{display:block;font-size:16px;line-height:1.3;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{display:block;font-size:13px;color:var(--graphite-60);line-height:1.35;margin-top:2px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .trail{flex:none;text-align:right;font-size:15px;display:flex;flex-direction:column;
           align-items:flex-end;gap:3px}
.li .trail .sub{font-size:12px;color:var(--graphite-60)}
.chev{flex:none;width:8px;height:14px;color:var(--graphite-30)}
.li.static:active{background:none}
.emptyrow,.empty{padding:26px 16px;text-align:center;color:var(--graphite-60);font-size:14px}

/* ---------- metrics ---------- */
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.metric .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite-60)}
.metric .v{font-size:25px;line-height:1.2;margin-top:3px;font-family:'Baskervville',Georgia,serif;
           letter-spacing:.01em}
.metric .v.sm{font-size:18px}
.metric .s{font-size:11.5px;color:var(--graphite-60);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- pills, tags, strips ---------- */
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.est{background:var(--rose-tint);color:var(--rose-dark)}
.pill.plant{background:#EDEFEA;color:#4A5A3C}
.pill.plan{background:#F7F8F5;color:#6E7C61;box-shadow:inset 0 0 0 1px #DBE0D3}
.pill.order{background:#F2EEE9;color:#6B5B4A}
.pill.other{background:#EFEFF0;color:var(--graphite-60)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border:1px solid var(--line);
     border-radius:20px;color:var(--graphite-60);white-space:nowrap}
.countpill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;
           background:var(--rose-tint);color:var(--rose-dark);white-space:nowrap}
.countpill.zero{background:#F0EFEE;color:var(--graphite-60)}
.strip{display:inline-flex;gap:2px;vertical-align:-2px;margin-right:7px}
.strip i{width:4px;height:12px;border-radius:1.5px;background:var(--line)}
.strip i.on{background:var(--rose)}
.strip i.near{background:var(--rose-tint)}
.loclink,.locink{color:var(--rose-dark);font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--rose)}
/* A position is a link on a tap and a question on a hold, so the hold must not also
   bring up iOS's own copy-and-share menu over the top of it. */
.seasontag{font-size:16px;font-weight:700;color:var(--graphite-60)}
.subline{font-size:13.5px;color:var(--graphite-60);margin-top:5px;line-height:1.45}
.cell{display:flex;align-items:center;min-width:0}
.cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc{font-variant-numeric:tabular-nums}

/* ---------- page head ---------- */
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:2px}
.crumb{
  display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--graphite-60);
  margin:-4px 0 12px;padding:6px 0;min-height:34px;
}
.crumb svg{width:8px;height:14px}

/* Outstanding work: a whole row is one target. */
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
      color:var(--graphite);min-height:46px}
.todo:last-child{border-bottom:none}
.todo .num{min-width:30px;text-align:right;font-weight:700;font-size:17px;flex:none}
.todo span:last-child{font-size:14px;line-height:1.35}

/* ---------- bloom bars ---------- */
.bloom{display:grid;grid-template-columns:74px 1fr 26px;gap:8px;align-items:center;
       font-size:13px;margin-bottom:6px}
.bar{height:15px;background:var(--rose);border-radius:3px;min-width:2px}
.bar.none{background:var(--line)}
.bar.unk{background:var(--graphite-30)}

/* ---------- filter chips ---------- */
/* A horizontal rail that bleeds to both screen edges, so it plainly scrolls. */
.chips{
  display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
  padding:2px var(--pad);
  /* Bleeds to both edges, but only sideways: a margin shorthand here would overrule the
     top margin of a .section and pin the rail to whatever sits above it. */
  margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;border:1px solid var(--graphite-30);background:#fff;color:var(--graphite);
  border-radius:20px;padding:0 14px;min-height:36px;display:inline-flex;align-items:center;
  font-size:13.5px;font-weight:700;white-space:nowrap;
}
.fchip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.fchip:active{border-color:var(--rose)}

/* ---------- avatars ---------- */
.avatarwrap{position:relative;flex:0 0 auto;line-height:0;display:inline-block}
.avatar{position:relative;display:block;padding:0;width:64px;height:64px;border-radius:50%;
        overflow:hidden;border:1px solid var(--line);background:var(--card);flex:none}
.avatar svg{width:100%;height:100%;display:block}
.avatar img{display:block}
.avatar.sm{width:44px;height:44px}
.avatar.big{width:84px;height:84px}
.avatar.tap:active{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint)}
/* The badge says the circle is a button — a phone has no hover to say it. */
.avatarwrap .camera{
  position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;
  background:var(--rose);border:2px solid var(--cream);display:flex;align-items:center;
  justify-content:center;pointer-events:none;
}
.avatarwrap .camera svg{width:13px;height:13px;color:#fff}
.cropview{position:relative;border-radius:50%;overflow:hidden;border:1px solid var(--line);
          background:var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.cropview img{pointer-events:none}

/* ---------- tables (only the small line tables inside sheets) ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
   color:var(--graphite-60);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.lines td{padding:5px 4px}
.lines input,.lines select{padding:9px 10px;min-height:42px;font-size:16px}
.lines select{background-position:right 8px center;padding-right:28px}
.rowx{border:none;background:none;color:var(--graphite-30);font-size:22px;line-height:1;
      padding:6px 4px;border-radius:6px;min-width:36px;min-height:36px}
.rowx:active{color:var(--rose-dark);background:var(--rose-tint)}

/* ---------- pickers ---------- */
.pick{position:relative;display:block}
.pick > input{padding-right:38px}
.pickback{
  position:absolute;right:1px;top:1px;bottom:1px;width:36px;padding:0;
  border:none;background:none;color:var(--graphite-60);font-size:13px;line-height:1;
  border-radius:0 var(--radius) var(--radius) 0;
}
.pickback:active{color:var(--rose);background:var(--rose-tint)}

/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px;width:100%}
.seg button{
  flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-size:13.5px;
  font-weight:700;letter-spacing:.02em;color:var(--graphite-60);min-height:40px;
}
.seg button.on{background:var(--card);color:var(--graphite);box-shadow:0 1px 3px rgba(58,58,60,.18)}

/* ---------- floating action button ---------- */
.fab{
  position:fixed;right:16px;bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:25;
  width:56px;height:56px;border-radius:50%;border:none;background:var(--rose);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(138,61,76,.34);
}
.fab:active{background:var(--rose-dark)}
.fab svg{width:24px;height:24px}

/* ---------- sheets ---------- */
/* Every panel in the desktop app is a card floating in the middle of the screen.
   Here they all rise from the bottom edge instead, which is where a thumb is. */
.psback{
  position:fixed;inset:0;background:rgba(58,58,60,.45);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  animation:fadein .18s ease-out;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(26px)}to{transform:translateY(0)}}
.pspanel{
  background:var(--card);border-radius:20px 20px 0 0;width:100%;
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(58,58,60,.3);
  animation:rise .22s cubic-bezier(.22,.68,.36,1);
}
@supports (height:100dvh){ .pspanel{max-height:92dvh} }
.pshandle{flex:none;padding:8px 0 2px;display:flex;justify-content:center}
.pshandle i{width:38px;height:4px;border-radius:3px;background:var(--graphite-30);display:block}
.pshead{flex:none;display:flex;align-items:flex-start;gap:10px;padding:6px 18px 0}
.pshead .grow{flex:1;min-width:0}
.pshead h2{font-size:20px}
.psbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 4px}
/* With no footer under it the body is what has to clear the home indicator. */
.pspanel.nofoot .psbody{padding-bottom:calc(18px + var(--safe-b))}
.psfoot{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 18px calc(12px + var(--safe-b));margin-top:6px;
  border-top:1px solid var(--line);background:var(--card);
}
/* A footer whose buttons will not sit beside its sentence stacks instead. */
.psfoot.stacked{display:block}
.psfoot.stacked .acts{justify-content:flex-end;margin-top:2px}
.psfoot .acts{flex:1;justify-content:flex-end}
.psfoot .acts .btn{flex:1 1 auto;min-width:0;white-space:nowrap}
.psx{
  border:none;background:var(--line);color:var(--graphite-60);font-size:19px;line-height:1;
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none;margin-top:2px;
}
.psx:active{background:var(--graphite-30);color:var(--graphite)}
.confirming p{margin:0 0 12px}
/* Held on the map, a peony asks about its square there and then. Small, because it is
   one question — a whole sheet for it would be the very step this saves. */
.askcard{
  background:var(--card);border-radius:18px;width:100%;max-width:420px;
  margin:0 auto calc(var(--tabh) + var(--safe-b) + 14px);
  padding:16px 18px;box-shadow:0 -8px 40px rgba(58,58,60,.3);
  animation:rise .2s cubic-bezier(.22,.68,.36,1);
}
.askcard p{margin:0 0 14px}
.askcard .acts{display:flex;justify-content:flex-end;gap:10px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(8px);
  background:var(--graphite);color:var(--cream);padding:11px 18px;border-radius:22px;
  font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;
  max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 20px rgba(58,58,60,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- connect ---------- */
.connect{margin:20px 0}
.connect h2{margin-bottom:12px}
.connect p{color:var(--graphite-60);margin:0 0 16px}
.connect .btn{margin-bottom:10px}
.hairline{height:1px;background:var(--line);margin:20px 0}

/* ---------- key / value read-outs ---------- */
.kvlist{display:flex;flex-direction:column}
.kvrow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
       border-bottom:1px solid var(--line);font-size:15px;align-items:baseline}
.kvrow:last-child{border-bottom:none}
.kvrow dt{color:var(--graphite-60);font-size:13px;flex:none;margin:0}
.kvrow dd{margin:0;text-align:right;min-width:0}

/* ---------- the map ---------- */
body.mapview{overflow:hidden;height:100vh;display:flex;flex-direction:column}
@supports (height:100dvh){ body.mapview{height:100dvh} }
body.mapview .topbar{flex:none}
/* The tab bar is fixed over the foot of the screen, so the map pane has to stop short
   of it — otherwise the tray of peonies still to place sits underneath the tabs. */
body.mapview main{
  margin:0;padding:0 0 calc(var(--tabh) + var(--safe-b));width:100%;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
}
.mapwrap{position:relative;flex:1 1 auto;min-height:260px;width:100%}
.plot{
  position:absolute;inset:0;background:var(--cream);
  touch-action:none;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
.plot > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin text{user-select:none;pointer-events:none}
.maptop{
  position:absolute;top:10px;left:12px;right:12px;z-index:4;pointer-events:none;
  display:flex;flex-direction:column;gap:1px;
  background:rgba(253,249,247,.9);border-radius:var(--radius);padding:6px 11px;
  box-shadow:0 1px 6px rgba(58,58,60,.1);
}
.maptop h2{font-size:16px}
.maptop .small{font-size:12px}
.compass{position:absolute;top:70px;right:14px;z-index:4;pointer-events:none;opacity:.8}
.compass svg{display:block;width:48px;height:48px}
.scalebar{
  position:absolute;left:12px;z-index:4;pointer-events:none;
  bottom:calc(var(--trayh,12px) + 12px);
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  font-size:11px;color:var(--graphite);text-shadow:0 0 3px var(--cream),0 0 3px var(--cream);
}
.sbbar{height:6px;border:1.5px solid var(--graphite);border-top:none;opacity:.75;transition:width .06s linear}
.maphud{display:none}

/* The tray of peonies still to place: a rail across the foot of the map. */
.tray{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  background:rgba(253,249,247,.97);border-top:1px solid var(--line);
  padding:9px 0;box-shadow:0 -3px 14px rgba(58,58,60,.1);
}
.tray .tlabel{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:0 var(--pad) 7px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--graphite-60);
}
/* The rail scrolls, so a chip is simply as wide as its name — clipping one would cost
   the very thing you are picking it by. */
.chip{
  flex:0 0 auto;border:1px solid var(--graphite-30);background:#fff;border-radius:20px;
  padding:0 14px;min-height:38px;display:inline-flex;align-items:center;font-size:14px;
  white-space:nowrap;color:var(--graphite);
}
.chip.carrying{opacity:.3}
/* The rail hands the browser nothing: every gesture on it is decided here. Left to
   pan-x, a drag with any sideways lean in it was liable to be claimed as a scroll
   halfway out of the tray, and the peony sprang back. */
.tray .chips{touch-action:none}
/* What is being planted is aimed a fingertip above the finger, and its name sits above
   that again — so neither your hand nor the label is over the square it is going into.
   Grey when there is no free square there to take it. */
.ghost{
  position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-100%);
  background:var(--rose);color:#fff;border-radius:20px;padding:7px 13px;
  font-size:13.5px;font-weight:700;white-space:nowrap;
  box-shadow:0 6px 18px rgba(138,61,76,.4);
}
/* Carrying a peony that is not in the ground yet: it will land as a plan, and a plan is
   charcoal, so the pill says so on the way rather than changing colour under you. */
.ghost.planned{background:var(--graphite);box-shadow:0 6px 18px rgba(58,58,60,.4)}
.ghost.nowhere{background:var(--graphite-60);box-shadow:0 6px 18px rgba(58,58,60,.34)}

/* ---------- order lines ---------- */
/* Five columns of a desktop table will not survive a phone; the same three facts,
   stacked in a little card of their own, will. */
.lineitem{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;background:#fff}
.lineitem .qp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.lineitem .qp > div{min-width:0}
.lineitem label{margin-bottom:4px}

/* ---------- misc ---------- */
.two{display:grid;grid-template-columns:1fr;gap:12px}
.grid.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.dragging,body.dragging *{user-select:none !important;-webkit-user-select:none !important}
/* Landscape on a phone is short: the sheets need every pixel of height they can get. */
@media (max-height:520px){
  .pspanel{max-height:96vh}
  .psbody{padding-top:10px}
  .compass{display:none}
}
</style>

<script>
"use strict";
/* ---------- constants ---------- */
const SEASONS = ["Very Early","Early","Early-Mid","Mid","Mid-Late","Late","Very Late"];
/* Four of these are one road, and the app walks it for you: a root you have is Acquired,
   a square on the map makes it Planned, the day it goes in makes it Planted, and the
   calendar makes it Established. Divided comes off the divide. Lost and Sold you say. */
const STATUSES = ["Acquired","Planned","Planted","Established","Divided","Lost","Sold"];
const ACQUIRED = "Acquired", PLANNED = "Planned", PLANTED = "Planted";
/* A crown that has been in two Junes. Named here because the map now draws it in a
   colour of its own. */
const ESTABLISHED = "Established";
/* A root you have and have not put in yet. Both stages answer to one click. */
const NOT_YET_IN = [ACQUIRED, PLANNED];
const BLOOM_TYPES = ["Single","Semi-Double","Double","Bomb","Japanese","Anemone"];
const PLANT_TYPES = ["Herbaceous","Intersectional (Itoh)","Tree"];
const STRENGTH = ["Self-supporting","Needs support","Flops"];
const FRAGRANCE = ["None","Light","Moderate","Strong"];
const CAT_OUT = ["Plants","Tools","Books","Amendments","Supports","Subscriptions","Packaging","Other"];
const CAT_IN  = ["Stems","Bouquets","Roots","Divisions","U-pick","Events","Other"];
/* Money in is money for a number of things, so income carries the count as well as the
   sum. The four that are plainly countable are named; the rest just say Quantity. */
const CAT_IN_UNITS = { Stems:"Stems", Bouquets:"Bouquets", Roots:"Roots", Divisions:"Divisions" };
const unitsLabel = cat => CAT_IN_UNITS[cat] || "Quantity";
const unitWord = (cat, n) => {
  const w = (CAT_IN_UNITS[cat] || "unit").toLowerCase();
  return n === 1 ? w.replace(/s$/, "") : (w === "unit" ? "units" : w);
};

const SPACING_FT = 3;   // herbaceous peonies, minimum comfortable center-to-center

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cents = n => Math.round((Number(n) || 0) * 100);
const money = n => (cents(n) / 100);
const fmt = n => "$" + money(n).toFixed(2);
/* A ledger reads in two directions, so both of them are signed. A true minus rather
   than a hyphen, which is the width of the plus and keeps a column of figures square. */
const signed = x => (x.direction === "income" ? "+" : "\u2212") + fmt(x.amount);
/* Asking for a locale date builds a formatter every time; one kept formatter does
   the same job for about a thirty-sixth of the work. Held on the function itself,
   so this is still the one self-contained line the tests pull out. */
const fmtDate = d => d ? (fmtDate.f || (fmtDate.f = new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric"}))).format(new Date(d + "T00:00:00")) : "—";
/* The same day without its year, for where the year is already being said alongside
   it — a date that repeats the subtitle under it is one fact printed twice. */
const fmtDay = d => d ? (fmtDay.f || (fmtDay.f = new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"}))).format(new Date(d + "T00:00:00")) : "\u2014";
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* Buttons are titles, so they take title case: everything capitalised except the
   little joining words, and those only when they are neither first nor last.
   Anything built from data has to come through here, because the label is only
   assembled at the moment it is drawn. */
const SMALL_WORDS = new Set(["a","an","and","as","at","but","by","for","in","nor",
  "of","off","on","or","per","so","the","to","up","via","vs"]);
function titleCase(s){
  const w = String(s ?? "").trim().split(/\s+/);
  return w.map((x,i) => i > 0 && i < w.length - 1 && SMALL_WORDS.has(x.toLowerCase())
    ? x.toLowerCase()
    : x.replace(/^[a-z]/, c => c.toUpperCase())).join(" ");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* Handing the finished file back. iOS puts the share sheet up, where Drive and Files
   are both offered and saving on top of the original is one more tap; everything else
   falls back to a download. Either way the copy that leaves here is the whole record.

   Everything below says dataFile() rather than DATA_FILE, and keeps what it kept through
   Store.keepLocal. DATA_FILE is the farm's own name whichever book is open, and "cache"
   is the farm's own shelf — so the sandbox used to leave here named farm-data.json and
   land on top of the farm's copy on the way out. The two books are separate files with
   separate shelves, and this is the one place that had forgotten it. */
async function sendBack(){
  if(!DB) return false;
  const name = dataFile();
  const text = JSON.stringify(DB, null, 2);
  const done = async () => {
    Store.unsent = false;
    await Store.keepLocal(text);
    paintFileState();
  };
  try{
    const file = new File([text], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: name });
      await done();
      toast("Sent — save it over the " + name + " you keep");
      return true;
    }
  }catch(e){
    /* Backing out of the share sheet is an answer, not a failure. */
    if(e && e.name === "AbortError") return false;
  }
  const url = URL.createObjectURL(new Blob([text], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  await done();
  toast("Downloaded " + name);
  return true;
}
/* ---------- state ---------- */
let DB = null, dirty = false;

/* Every change writes itself a moment later, so the button in the corner is a fallback
   rather than a chore. Actions that speak for themselves still save at once, with a word. */
let autoT = null;
/* Bumped by every edit. A save only clears the flag if nothing changed while it
   was in flight — otherwise the edit made mid-write would be marked saved and the
   pending autosave would then find nothing left to do. */
let editSeq = 0;
function markDirty(){ dirty = true; editSeq++; paintFileState(); saveSoon(); }
function saveSoon(){
  clearTimeout(autoT);
  autoT = setTimeout(() => { if(dirty && Store.ready) saveNow(null, true); }, 500);
}
/* The pill in the corner is the truth about where your afternoon's work currently is,
   and tapping it opens the sheet that explains. It keeps to its dot while everything is
   in hand — the brand name is what that space is for — and only takes words when there
   is something waiting for you to do. */
function paintFileState(){
  const dot = $("#dot"), st = $("#fileState"), btn = $("#stateBtn");
  if(!btn) return;
  /* Painted on every render, so it cannot lag behind a change of books. */
  const sand = !!DB && Store.isSandbox;
  const tag = $("#sandTag"); if(tag) tag.hidden = !sand;
  document.body.classList.toggle("sandbox", sand);
  if(!DB){ dot.className = "dot"; st.textContent = "No file"; btn.classList.add("hide"); return; }
  btn.classList.remove("hide");
  const waiting = !dirty && Store.unsent;
  btn.classList.toggle("quiet", !waiting);
  dot.className = "dot " + (dirty || waiting ? "dirty" : "ok");
  st.textContent = dirty ? "Saving"
    : waiting ? (Store.isRepo ? (navigator.onLine === false ? "No signal" : "Not sent") : "Send back")
    : Store.writesInPlace ? "Saved" : "On phone";
  btn.setAttribute("aria-label", "Your data — " + st.textContent);
}
const today = () => new Date().toISOString().slice(0,10);
/* An action that speaks for itself passes its own message, so a one-click change
   can say what it did instead of just "Saved". */
let saving = null;
async function saveNow(msg, quiet){
  clearTimeout(autoT);
  if(saving) await saving;                     // one writer at a time
  const at = editSeq;
  try{
    saving = Store.save(DB); await saving;
    /* Typed into while the file was being written: the flag stays up and the next
       autosave has something to do, rather than the write clearing it wrongly. */
    if(editSeq === at) dirty = false; else saveSoon();
    paintFileState();
    if(!quiet) toast(msg || (Store.writesInPlace ? "Saved" : "Kept on this phone"));
  }
  catch(e){
    paintFileState();
    if(e.kind === "conflict") await resolveConflict();
    else toast("Save failed: " + e.message);
  }
  finally{ saving = null; }
}

/* Every panel in this edition is the same shape: a handle that says it can be pulled
   away, a title, a body that scrolls, and a footer that stays put above the home
   indicator. The ids are the ones the shared wiring already reaches for. */
function sheet(id, o){
  const closeId = o.closeId || (id + "Close");
  return `<div class="psback" id="${id}Back"><div class="pspanel${o.foot ? "" : " nofoot"}">
    <div class="pshandle"><i></i></div>
    <div class="pshead">
      <div class="grow"><h2>${o.title}</h2>${o.sub ? `<div class="subline">${o.sub}</div>` : ""}</div>
      ${o.pill || ""}
      <button class="psx" id="${closeId}" aria-label="Close">&times;</button>
    </div>
    <div class="psbody">${o.body}</div>
    ${o.foot ? `<div class="psfoot${o.stacked ? " stacked" : ""}">${o.foot}</div>` : ""}
  </div></div>`;
}

/* Pulling a sheet down by its handle is how iOS closes one, so every sheet answers to
   it — wired here, once, over whatever is on screen, rather than in each panel's own
   wiring. Letting go short of the threshold springs it back. */
function wireSheetGestures(){
  document.querySelectorAll(".pspanel").forEach(panel => {
    if(panel.dataset.swipe) return;
    panel.dataset.swipe = "1";
    const shut = panel.querySelector(".psx");
    if(!shut) return;
    const grip = [panel.querySelector(".pshandle"), panel.querySelector(".pshead")].filter(Boolean);
    grip.forEach(g => g.addEventListener("pointerdown", e => {
      if(e.target.closest(".psx")) return;
      const y0 = e.clientY;
      let dy = 0;
      const move = ev => {
        dy = Math.max(0, ev.clientY - y0);
        panel.style.transition = "none";
        panel.style.transform = `translateY(${dy}px)`;
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        panel.style.transition = "transform .18s ease-out";
        panel.style.transform = "";
        if(dy > 90) shut.click();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    }));
  });
}

/* ---------- the data sheet ---------- */
/* Where the records are, how they got here, and the one button that sends them home.
   On the desktop this whole question is answered by the file being written as you go,
   so the sheet only really earns its place on a phone — which is where it lives. */
let dataOpen = false;

function dataSheet(){
  const mode = Store.mode;
  if(mode === "github") return repoSheet();
  const where = mode === "served"
    ? `<p class="small muted" style="margin:0">Read from <strong>${esc(Store.label || dataFile())}</strong>

/* Two sets of books in the one repository: the farm's, and one to experiment on. They
   are separate files with separate photographs, and what one owes is never sent to the
   other — so an afternoon of poking about cannot reach the records that matter. */
function bookPicker(){
  if(!Store.canSwitchBooks) return "";
  const B = Store.books;
  return `
    <div class="chips" style="margin-bottom:14px">${Object.keys(B).map(k =>
      `<button class="fchip ${Store.book === k ? "on" : ""}" data-book="${k}">${esc(B[k].label)}</button>`).join("")}</div>
    <p class="small muted" style="margin:0 0 4px">${Store.isSandbox
      ? "You are in the sandbox. Nothing here is the farm \u2014 change what you like."
      : "The farm's own records. The sandbox is a separate file to experiment on."}</p>`;
}

function wireDataSheet(){
  const shut = () => { dataOpen = false; render(); };
  $("#dsClose").onclick = shut;
  $("#dsBack").onclick = e => { if(e.target.id === "dsBack") shut(); };
  document.querySelectorAll("[data-book]").forEach(el => el.onclick = async () => {
    const to = el.dataset.book;
    if(to === Store.book) return;
    /* An edit that has not reached home yet belongs to the book it was made in. It is
       kept on that book's own shelf and is still owed, but leaving now means it will
       not go until you come back — so it is said out loud rather than assumed. */
    if(Store.unsent && !confirm(
      `There is work in ${Store.bookLabel()} that has not been sent yet. It stays on this ` +
      `phone and goes the next time you open ${Store.bookLabel()}. Change books anyway?`)) return;
    const was = Store.book;
    dataOpen = false;
    try{
      DB = await Store.openBook(to);
      await Photos.loadAll(DB);
      dirty = false; openPlant = null; editing = null; openTxn = null;
      view = null; plotAR = null; fitW = null; userMoved = false; focusId = null;
      bloomYear = null; ledRange = "all"; ledFrom = ledTo = "";
      colFilter.q = "";
      location.hash = "#/dashboard";
      render(); paintFileState();
      toast(Store.isSandbox ? "Sandbox \u2014 nothing here is the farm" : "Back in the farm's records");
    }catch(e){
      /* Could not be opened, so we are not in it: back to the book we were in, said
         plainly rather than left in a state that is neither. */
      await Store.setBook(was);
      dataOpen = true;
      render();
      toast("Could not open that: " + e.message);
    }
  });

  const send = $("#dsSend");
  if(send) send.onclick = async () => { await sendBack(); render(); };
  const sync = $("#dsSync");
  if(sync) sync.onclick = async () => {
    sync.disabled = true; sync.textContent = "Sending\u2026";
    try{
      const n = await Store.flush();
      toast(n ? "Sent" : "Nothing went \u2014 still no signal");
    }catch(e){
      if(e.kind === "conflict"){ dataOpen = false; return resolveConflict(); }
      toast("Could not send: " + e.message);
    }
    render();
  };
  $("#dsOther").onclick = async () => {
    if(Store.unsent && !confirm(Store.isRepo
      ? "There is work on this phone that has not been sent yet. Disconnect anyway?"
      : "Some edits have not been sent back yet. Open a different file anyway?")) return;
    if(Store.isRepo) await Store.disconnectRepo();
    await Store.forget();
    Photos.clear();
    DB = null; dirty = false; dataOpen = false;
    Store.mode = null; Store.label = null;
    location.hash = "#/dashboard";
    render();
  };
}

/* ---------- when two of you saved ---------- */
/* Only ever asked when it has actually happened: this phone is behind the records in
   the repository, and both have words in them. Neither answer loses anything, because
   the one written over is still in the history. */
function askWhoWins(){
  return new Promise(res => {
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;background:rgba(43,43,43,.5);display:flex;" +
      "align-items:flex-end;justify-content:center;z-index:9999";
    box.innerHTML = `<div style="background:var(--card);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px">
      <h3 style="margin:0 0 10px">Saved somewhere else too</h3>
      <p class="small" style="margin:0 0 18px">These records changed since this phone read them \u2014
        most likely from the desktop. Nothing is lost either way; whichever you don't keep
        stays in the history.</p>
      <button class="btn primary wide" id="wMine">Keep What Is on This Phone</button>
      <button class="btn wide" id="wTheirs" style="margin-top:8px">Take the Newer One</button>
    </div>`;
    document.body.appendChild(box);
    const done = v => { box.remove(); res(v); };
    box.querySelector("#wMine").onclick   = () => done("mine");
    box.querySelector("#wTheirs").onclick = () => done("theirs");
  });
}

async function resolveConflict(){
  const who = await askWhoWins();
  try{
    if(who === "mine"){
      await Store.forceSave(DB);
      dirty = false; paintFileState(); render();
      toast("Kept this phone's copy");
    }else{
      DB = await Store.reload();
      dirty = false; paintFileState(); render();
      toast("Took the newer copy");
    }
  }catch(e){ toast("Could not settle it: " + e.message); }
}

/* ---------- derived ---------- */
const cultivar = id => DB.cultivars.find(v => v.id === id) || {};

function plantCost(pid){
  let c = 0;
  for(const t of DB.transactions)
    for(const a of (t.allocations||[]))
      if(a.target==="plant" && a.targetId===pid) c += cents(a.amount) * (t.direction==="income" ? -1 : 1);
  return c/100;
}
/* The same walk answers every plant at once. Screens that need more than one cost
   ask for the lot rather than walking the ledger once per peony. Built fresh each
   time it is called, so there is no kept answer that can fall out of date. */
function plantCosts(){
  const m = new Map();
  for(const t of DB.transactions){
    const sign = t.direction === "income" ? -1 : 1;
    for(const a of (t.allocations || []))
      if(a.target === "plant") m.set(a.targetId, (m.get(a.targetId) || 0) + cents(a.amount) * sign);
  }
  return { of: id => (m.get(id) || 0) / 100 };
}
/* Over everything by default, or over whatever slice the ledger is showing. */
function totals(list){
  let out=0, inc=0, alloc=0;
  for(const t of (list || DB.transactions)){
    if(t.direction==="income") inc += cents(t.amount); else out += cents(t.amount);
    for(const a of (t.allocations||[])) if(t.direction!=="income") alloc += cents(a.amount);
  }
  return {out:out/100, inc:inc/100, alloc:alloc/100, overhead:(out-alloc)/100};
}
function txBalance(t){
  const a = (t.allocations||[]).reduce((s,x)=>s+cents(x.amount),0);
  return {allocated:a/100, diff:(cents(t.amount)-a)/100, balanced:a===cents(t.amount)};
}
function activePlants(){ return DB.plants.filter(p => !["Lost","Sold","Divided"].includes(p.status)); }

/* ---------- a root settles on its own ---------- */
/* A root is a new plant through the summer it goes in and the summer after. By the June
   of the second year after that one it is simply part of the garden, and the app says so
   without being asked: nothing else ever moves a plant on from Planted, so the calendar
   does. One pass down the plant list on open, which costs nothing worth measuring, and
   it only writes a commit on the day it actually finds something to move. */
const settledOn = d => `${Number(d.slice(0,4)) + 2}-06-01`;   // its second June after the year it went in
function ageIntoEstablished(){
  const on = today();
  const moved = DB.plants.filter(p =>
    p.status === PLANTED && p.plantedDate && settledOn(p.plantedDate) <= on);
  for(const p of moved) p.status = ESTABLISHED;
  return moved.length;
}
/* Ordered, Received, Ready to Plant and Wishlist were four names for one fact: a root
   you have, or will have, that is not in the ground. They are all Acquired now — except
   that one already standing on the map was always Planned, so it finally says so. */
const RETIRED = ["Ordered","Received","Ready to Plant","Wishlist"];
function retireOldStatuses(){
  const old = DB.plants.filter(p => RETIRED.includes(p.status));
  for(const p of old) p.status = p.x === null ? ACQUIRED : PLANNED;
  return old.length;
}
/* Everything that has to be put right the moment a file is opened, from either way in.
   A change you did not make says so, so it is never a surprise. */
function settleOnLoad(){
  const settled = ageIntoEstablished(), legacy = retireOldStatuses();
  if(settled) saveNow(`${settled} plant${settled === 1 ? " is" : "s are"} now established`);
  else if(legacy) saveNow(null, true);
  return settled;
}
/* ---------- a square on the map is the plan ---------- */
/* Dropping a root you have onto the map is the only thing that says where it is going,
   so it is the only thing that needs to say so: the square and the status are one fact,
   and moving a peony that is already in the ground moves nothing but the peony. */
function planOnPlace(p){
  if(p.status !== ACQUIRED) return false;
  p.status = PLANNED;
  return true;
}
function nextPlantId(){ return DB.plants.reduce((m,p)=>Math.max(m,p.id),0) + 1; }
function nextTxId(){ return DB.transactions.reduce((m,t)=>Math.max(m,t.id),0) + 1; }
function nextBloomId(){ return DB.blooms.reduce((m,b)=>Math.max(m,b.id),0) + 1; }

/* ---------- what bloomed, and when ---------- */
/* One row per cultivar per day. Everything worth knowing is derived from it rather
   than stored twice: the season's first and last bloom, the real bloom window that
   eventually replaces the catalog guess, stems cut, and cost per stem. */
const bloomsOn = d => DB.blooms.filter(b => b.date === d);
const bloomDays = () => [...new Set(DB.blooms.map(b => b.date))].sort().reverse();
const bloomYears = () => [...new Set(DB.blooms.map(b => b.date.slice(0,4)))].sort().reverse();
const inYear = (b, y) => !y || b.date.slice(0,4) === y;

/* Null when a cultivar simply did not bloom that year — an absence is not a zero. */
function cultivarSeason(cid, year){
  const rows = DB.blooms.filter(b => b.cultivarId === cid && inYear(b, year))
    .sort((a,b) => a.date.localeCompare(b.date));
  if(!rows.length) return null;
  return { year, first: rows[0].date, last: rows[rows.length-1].date, days: rows.length,
           stems: rows.reduce((s,r) => s + (r.stems || 0), 0) };
}
function seasonTotals(year){
  const rows = DB.blooms.filter(b => inYear(b, year));
  return { stems: rows.reduce((s,r) => s + (r.stems || 0), 0),
           cultivars: new Set(rows.map(r => r.cultivarId)).size,
           days: new Set(rows.map(r => r.date)).size,
           first: rows.length ? rows.map(r => r.date).sort()[0] : null };
}

function pillClass(s){
  if(s===ESTABLISHED) return "est";
  if(s===PLANTED) return "plant";
  /* Planned is drawn as the outline of Planted, because that is exactly what it is. */
  if(s===PLANNED) return "plan";
  if(s===ACQUIRED) return "order";
  return "other";
}


/* ---------- router ---------- */
/* Five screens, five tabs along the bottom edge — where a thumb already is and where
   iOS puts them. The same five the desktop app carries along its top. */
const ROUTES = [
  ["#/dashboard","Dashboard","farm"],
  ["#/collection","Plants","list"],
  ["#/map","Map","pin"],
  ["#/bloom","Bloom","mark"],
  ["#/ledger","Ledger","ledger"],
];
function paintNav(){
  const nav = $("#nav");
  if(!DB){ nav.innerHTML = ""; nav.classList.add("hide"); return; }
  nav.classList.remove("hide");
  const h = location.hash || "#/dashboard";
  /* A plant belongs to its cultivar, so the Plants tab stays lit while one is open. */
  const at = h.startsWith("#/plant/") ? "#/collection" : h;
  nav.innerHTML = ROUTES.map(([href,label,icon]) =>
    `<a class="tab ${at.startsWith(href) ? "on" : ""}" href="${href}" aria-label="${label}"${
      at.startsWith(href) ? ' aria-current="page"' : ""}>${tabIcon(icon)}</a>`).join("");
}
/* Bloom wears the farm's own mark instead of a drawn flower — the thing being recorded
   is a peony, and there is already one in the header. Borrowed from there rather than
   copied, so the two can never drift apart, and filled with currentColor so the tab bar
   tints it on and off like every other icon. */
function tabIcon(key){
  if(key !== "mark") return ICON[key];
  const src = document.querySelector("header .mark");
  if(!src) return ICON.bloom;                      // no header yet: the line drawing still stands
  return src.outerHTML
    .replace('class="mark"', 'class="markicon"')
    .replace('fill="#FDF9F7"', 'fill="currentColor"');
}

function render(){
  paintNav(); paintFileState();
  const app = $("#app");
  const hash = location.hash || "#/dashboard";
  document.body.classList.toggle("mapview", hash.startsWith("#/map") && !!DB);
  document.body.classList.toggle("nofile", !DB);
  /* An open panel is what keeps an edit alive; leaving the screen behind it ends the
     edit. The ledger only counts while one of its transactions is actually open, and
     the map only while a plant is — a plant opened from the map keeps the #/map hash,
     so without that second clause every render tore down the edit it had just begun. */
  const panelOpen = hash.startsWith("#/collection/") || hash.startsWith("#/plant/")
    || (hash.startsWith("#/map") && openPlant !== null)
    || (hash.startsWith("#/ledger") && openTxn !== null);
  if(editing && !panelOpen) editing = null;

  route(app, hash);

  /* The data sheet floats over whatever screen you were on, so it is appended last
     and never disturbs what is underneath it. */
  if(DB && dataOpen){ app.insertAdjacentHTML("beforeend", dataSheet()); wireDataSheet(); }
  wireSheetGestures();
}

function route(app, h){
  if(!DB) return renderConnect(app);
  if(h.startsWith("#/plant/")){
    const p = DB.plants.find(x => x.id === Number(h.split("/")[2]));
    if(!p){ app.innerHTML = `<p class="empty">Plant not found. <a href="#/collection">Back to the collection</a></p>`; return; }
    openPlant = p.id;
    return renderCultivar(app, p.cultivarId);
  }
  if(h.startsWith("#/order")){ if(!draftTxn) draftTxn = blankTxn("order"); location.hash = "#/ledger"; return renderLedger(app); }
  if(h.startsWith("#/collection/")) return renderCultivar(app, decodeURIComponent(h.slice(13)));
  if(h.startsWith("#/collection")) return renderCollection(app);
  if(h.startsWith("#/map")){
    const id = Number(h.split("/")[2]);
    /* #/map/<id> means "show me this one". Focus, then rewrite the hash back to
       #/map so later re-renders don't keep yanking the view back. */
    if(id){ focusOn(id); history.replaceState(null, "", "#/map"); }
    return renderMap(app);
  }
  if(h.startsWith("#/bloom")) return renderBloom(app);
  if(h.startsWith("#/ledger")) return renderLedger(app);
  return renderDashboard(app);
}

window.addEventListener("hashchange", () => {
  if(!/^#\/map\/\d+/.test(location.hash)) focusId = null;   // only a fresh #/map/<id> keeps it
  dataOpen = false;
  /* Moving to another screen closes an open plant sheet; opening one over the map
     does not change the hash, so it survives there. */
  if(!location.hash.startsWith("#/plant/") && !draftPlant){
    openPlant = null; editing = null; armDividePlant = false; armPlantOne = false; discardDivide(); }
  if(!location.hash.startsWith("#/collection/")){ photoFor = null; draftCrop = null; }
  if(!location.hash.startsWith("#/ledger")){ openTxn = null; armDelete = armPlant = false; }
  if(!location.hash.startsWith("#/bloom")) discardBloomDraft();
  if(!location.hash.startsWith("#/map")) closeMapAsk();
  /* A screen you have just arrived at should be at the top of itself. */
  window.scrollTo(0, 0);
  render();
});

/* ---------- the way in ---------- */
/* The header's mark, borrowed at whatever size and colour is wanted. The path carries
   a cream fill for the graphite bar, so the fill is swapped rather than re-drawn. */
function markSvg(fill, size){
  const src = document.querySelector("header .mark");
  if(!src) return "";
  return src.outerHTML
    .replace('class="mark"', `class="bigmark" style="width:${size}px;height:${size}px;display:block;margin:0 auto"`)
    .replace('fill="#FDF9F7"', `fill="${fill}"`);
}
function fmtWhen(ts){
  if(!ts) return "";
  const mins = Math.round((Date.now() - ts) / 60000);
  if(mins < 1) return "a moment ago";
  if(mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const d = Math.round(hrs / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

/* What was open when the phone was last put down. Filled in at boot. */
let cachedSave = null;

/* Which step of the way in we are on: the list of choices, or the one form. */
let connectStep = null;          /* null | "repo" */

function repoFormHtml(){
  return `
  <label for="rOwner">GitHub username</label>
  <input id="rOwner" placeholder="your-username" autocomplete="off" autocapitalize="none" spellcheck="false">

  <p class="small muted" style="margin:10px 0 0">A fine-grained token with <strong>Contents: read and write</strong>
    on that one repository. It stays on this phone.</p>`;
}

function renderConnect(app){
  const resume = cachedSave && cachedSave.text;

  if(connectStep === "repo"){
    app.innerHTML = `
    <div class="connect">
      <div style="text-align:center;margin:8px 0 22px">
        ${markSvg("#C25A6D", 54)}
        <h2 style="margin-top:12px;font-size:19px">Connect your records</h2>
        <p class="small muted" style="margin:8px 0 0">Once, on this phone.</p>
      </div>
      ${repoFormHtml()}
      <button class="btn primary wide" id="rGo" style="margin-top:20px">Connect</button>
      <button class="btn wide" id="rBack" style="margin-top:8px">Back</button>
      <p class="small warn" id="rErr" style="margin-top:14px;display:none"></p>
    </div>`;
    const err = m => { const e = $("#rErr"); e.textContent = m; e.style.display = "block"; };
    $("#rBack").onclick = () => { connectStep = null; render(); };
    $("#rGo").onclick = async () => {
      const cfg = { owner:$("#rOwner").value.trim(), repo:$("#rRepo").value.trim(),
                    token:$("#rToken").value.trim(), branch:"main" };
      if(!cfg.owner || !cfg.repo || !cfg.token) return err("All three are needed.");
      $("#rGo").disabled = true; $("#rGo").textContent = "Connecting\u2026";
      try{
        await Store.connectRepo(cfg);
        DB = await Store.load();
        dirty = false; cachedSave = null; connectStep = null;
        location.hash = "#/dashboard";
        render(); settleOnLoad();
      }catch(e){
        $("#rGo").disabled = false; $("#rGo").textContent = "Connect";
        err(e.message);
      }
    };
    return;
  }

  const choices = [];
  choices.push(`<button class="btn primary wide" id="cRepo">Connect Your Records</button>
    <p class="small muted" style="margin:0 0 16px">Your records in their own repository, read and
      written here in place. Photographs and all, with no sending back afterwards. This is
      the one to use.</p>`);

  if(resume) choices.push(`<button class="btn wide" id="cResume">Carry On Where You Left Off</button>
    <p class="small muted" style="margin:0 0 16px"><strong>${esc(cachedSave.label || dataFile())}</strong>,
      last edited ${fmtWhen(cachedSave.at)}${cachedSave.unsent

/* Things the farm is waiting on. Every line is a fact the app already knows and a
   link to the one screen where you can act on it — never a nag, and never a count
   you would have to go and work out for yourself. */
function outstanding(){
  const act = activePlants(), out = [];
  const add = (n, what, href) => { if(n) out.push({ n, what, href }); };

  add(act.filter(p => p.status === ACQUIRED).length, "in hand and not yet on the map", "#/map");
  add(act.filter(p => p.status === PLANNED).length,
      "with a square on the map and not yet in the ground", "#/map");
  /* Acquired says the same thing better a line above, so it is not said twice here. */
  add(act.filter(p => p.x === null && p.status !== ACQUIRED).length,
      "without a square on the map", "#/map");
  add(act.filter(p => p.status === PLANTED && !p.plantedDate).length,
      "planted with no date recorded", "#/collection");
  add(DB.cultivars.filter(c => !c.bloomSeason).length, "cultivars with no bloom season", "#/collection");

  /* Only worth saying once anything has bloomed at all — before the first season it
     is just a list of everything you own. */
  const y = String(new Date().getFullYear());
  if(DB.blooms.some(b => b.date.startsWith(y))){
    const seen = new Set(DB.blooms.filter(b => b.date.startsWith(y)).map(b => b.cultivarId));
    add(DB.cultivars.filter(c => !seen.has(c.id)).length, `cultivars not yet seen in bloom this year`, "#/bloom");
  }
  return out;
}

const F = {

/* ---------- pickers ---------- */
/* Fields like vendor and cultivar are a list you pick from nearly every time, and
   occasionally something new. So: a plain dropdown, with one extra option at the
   bottom that swaps it for a text box. Which boxes are currently swapped is held
   here rather than on the record, so a half-typed name can never reach the file. */
const NEW = "__new";
let newEntry = {};
const clearNew = pre => { for(const k of Object.keys(newEntry)) if(!pre || k.startsWith(pre)) delete newEntry[k]; };

/* A value that isn't in the list yet needs the text box whether or not you asked
   for it — otherwise the dropdown would quietly drop what you typed. */
function picker(key, attrs, value, known, addLabel){
  const v = value ?? "";
  if(newEntry[key] || (v && !known.includes(v)))
    return `<span class="pick"><input ${attrs} value="${esc(v)}" placeholder="${
      esc(addLabel.replace(/^\+ |…$/g, ""))}"><button class="pickback" data-pick="${key}"
      title="Back to the list" aria-label="Back to the list">&#9662;</button></span>`;
  return `<select ${attrs}><option value="">—</option>${
    known.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")
  }<option value="${NEW}">${esc(addLabel)}</option></select>`;
}
/* `set` takes the value as it changes; `done` runs when you leave the field.
   Three ways back to the list: the chevron, Escape, or emptying the box. */
function wirePicker(el, key, set, done){
  if(!el) return;
  if(el.tagName === "SELECT"){
    el.onchange = () => {
      if(el.value === NEW){ newEntry[key] = "focus"; render(); return; }
      set(el.value); if(done) done();
    };
    return;
  }
  const toList = () => { delete newEntry[key]; set(""); render(); };
  if(newEntry[key] === "focus"){ newEntry[key] = true; el.focus(); }
  el.oninput = () => set(el.value);
  el.onchange = () => {
    const v = el.value.trim();
    if(!v) return toList();
    set(v); if(done) done();
  };
  el.onkeydown = e => { if(e.key === "Escape"){ e.stopPropagation(); toList(); } };
  const back = el.parentElement && el.parentElement.querySelector(`[data-pick]`);
  /* mousedown, not click: a click would blur the box first, commit the half-typed
     name, and re-render the button out from under the pointer. */
  if(back) back.onmousedown = e => { e.preventDefault(); toList(); };
}
/* Who you have dealt with before, on this side of the ledger. */
const PARTIES = dir => [...new Set(DB.transactions
  .filter(t => t.direction === dir && t.counterparty)
  .map(t => t.counterparty.trim()))].filter(Boolean).sort((a,b) => a.localeCompare(b));

/* Panels are read-only until you say otherwise. `editing` holds the key of the one
   panel that is open; Save closes it and writes the file. */
let editing = null;
const isEditing = key => editing === key;
function beginEdit(key){ editing = key; clearNew(); render(); }
function commitEdit(){ editing = null; clearNew(); render(); saveNow(); }
const ro = v => `<div class="ro${(v === null || v === undefined || v === "") ? " muted" : ""}">${esc(v ?? "") || "—"}</div>`;
/* One field, editable or not depending on the panel it sits in. */
const rw = (on, label, control, value, cls) => field(label, on ? control : ro(value), cls);
const editBar = (on, name) => on
  ? `<button class="btn primary" id="save_${name}">Save</button>`
  : `<button class="btn" id="edit_${name}">Edit</button>`;

/* Colors are free text, so filtering matches families: picking Pink finds Blushy Pink,
   Pinky White and Pink/White too. Modifiers like deep and creamy are ignored so they
   never become families of their own. */
const COLOR_FAMILY = {
  white:"White", cream:"Cream", creamy:"Cream", ivory:"Cream",
  blush:"Blush", blushy:"Blush", pale:"Blush",
  pink:"Pink", pinky:"Pink", rose:"Pink",
  coral:"Coral", salmon:"Coral", peach:"Coral", apricot:"Coral",
  red:"Red", crimson:"Red", scarlet:"Red",
  magenta:"Magenta", fuchsia:"Magenta",
  purple:"Purple", lavender:"Lavender", yellow:"Yellow", lemon:"Yellow",
};
const FAMILY_ORDER = ["White","Cream","Blush","Pink","Magenta","Coral","Red","Purple","Lavender","Yellow"];
const families = c => [...new Set(String(c || "").toLowerCase().split(/[^a-z]+/).filter(Boolean)
  .map(w => COLOR_FAMILY[w]).filter(Boolean))];

/* ---------- the face of a cultivar ---------- */
/* Until there is a photograph of your own bloom, the circle draws one from what you have
   already recorded: the color family and the form. It is plainly a drawing, not a
   photograph, and it is replaced the moment you put a real one in its place. */
const PETAL = {
  White:   ["#FCF9F5","#C9BBB0","#FFFFFF"],
  Cream:   ["#F6EBD2","#CDB489","#FDF7E8"],
  Blush:   ["#F6D8DE","#D79FAC","#FCEDF0"],
  Pink:    ["#E79CB1","#BE6B84","#F3C6D2"],
  Magenta: ["#C4548A","#8E3A64","#DB8CB2"],
  Coral:   ["#F08E74","#C2634C","#F8BAA7"],
  Red:     ["#B93A45","#82232C","#D46E78"],
  Purple:  ["#9273B0","#664E80","#B9A2CE"],
  Lavender:["#C3B0D6","#9280AC","#DCD1E8"],
  Yellow:  ["#EBD581","#BCA652","#F5E8BB"],
};
const UNSET_PETAL = ["#E8E3DF","#BCB4AC","#F2EEEB"];      // color not recorded: it says so by being drab
const GOLD = "#E8C55B", GOLD_DEEP = "#B8912C";
/* A number off the name, so a cultivar always draws the same flower and two pink
   doubles are still told apart at a glance. */
const bloomSeed = v => Math.abs([...String(v.id || v.name || "?")].reduce((h,c) => (h*31+c.charCodeAt(0))|0, 7));
/* Petal count and how far the rings reach in. A bomb is a ring of guards under a
   pompom; a double is rings all the way in; a single shows its stamens. */
const FORMS = {
  "Single":      { rings:[[5,16,26,31]], heart:"stamens" },
  "Semi-Double": { rings:[[7,15,26,31],[6,10,17,37]], heart:"stamens" },
  "Double":      { rings:[[8,15,26,31],[7,11,19,36],[6,8,13,41]], heart:"packed" },
  "Bomb":        { rings:[[7,17,29,28]], heart:"pompom" },
  "Japanese":    { rings:[[7,16,26,31]], heart:"straps" },
  "Anemone":     { rings:[[7,16,26,31]], heart:"petaloids" },
};

function bloomSvg(v){
  const fam = families(v.color);
  const [fill, deep, light] = PETAL[fam[0]] || UNSET_PETAL;
  const in2 = fam[1] && PETAL[fam[1]] ? PETAL[fam[1]] : null;   // "Pink/White": pink guards, white heart
  const [, iDeep, iLight] = in2 || [fill, deep, light];
  const form = FORMS[v.bloomType] || FORMS["Double"];
  const seed = bloomSeed(v), spin = seed % 24, wobble = (seed % 5) - 2;
  const id = "b" + seed.toString(36), id2 = id + "i";
  const g1 = in2 ? id2 : id, e1 = in2 ? iDeep : deep;

  const petal = (cy, rx, ry, a, grad, edge) =>
    `<ellipse cx="50" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${grad})" stroke="${edge}"
      stroke-opacity=".42" stroke-width="1" transform="rotate(${a} 50 50)"/>`;
  const ring = ([n, rx, ry, cy], k) => {
    const count = k === 0 ? Math.max(5, n + (seed % 3) - 1) : n;
    const inner = k > 0 && !!in2;
    return Array.from({length:count}, (_,i) =>
      petal(cy + (k === 0 ? wobble * 0.4 : 0), rx, ry, spin + k * (180/count) + i * (360/count),
            inner ? id2 : id, inner ? iDeep : deep)).join("");
  };
  const spokes = (n, r1, r2, color, w) => Array.from({length:n}, (_,i) => {
    const a = (spin + i * (360/n)) * Math.PI/180;
    return `<line x1="${50+Math.cos(a)*r1}" y1="${50+Math.sin(a)*r1}" x2="${50+Math.cos(a)*r2}"
      y2="${50+Math.sin(a)*r2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join("");

  const hearts = {
    packed: Array.from({length:5}, (_,i) => petal(45, 4.5, 8, spin + 40 + i * 72, g1, e1)).join("") +
      `<circle cx="50" cy="50" r="2.4" fill="${e1}" opacity=".35"/>`,
    stamens: `<circle cx="50" cy="50" r="8" fill="${GOLD}" opacity=".92"/>` +
      spokes(13, 6.5, 12, GOLD_DEEP, 1.7) +
      `<circle cx="50" cy="50" r="3.4" fill="${GOLD_DEEP}" opacity=".6"/>`,
    pompom: `<circle cx="50" cy="50" r="18" fill="${iLight}" stroke="${iDeep}" stroke-opacity=".45"/>` +
      Array.from({length:9}, (_,i) => petal(41, 5, 10, spin + 20 + i * 40, g1, e1)).join("") +
      Array.from({length:5}, (_,i) => petal(45, 3.4, 6, spin + i * 72, g1, e1)).join("") +
      `<circle cx="50" cy="50" r="2.6" fill="${e1}" opacity=".4"/>`,
    straps: `<circle cx="50" cy="50" r="15" fill="${light}" fill-opacity=".6"/>` +
      Array.from({length:14}, (_,i) => `<ellipse cx="50" cy="41" rx="2.1" ry="10" fill="${GOLD}"
        stroke="${GOLD_DEEP}" stroke-opacity=".55" stroke-width=".6"
        transform="rotate(${spin + i*(360/14)} 50 50)"/>`).join("") +
      `<circle cx="50" cy="50" r="4" fill="${GOLD_DEEP}" opacity=".5"/>`,
    petaloids: Array.from({length:13}, (_,i) => `<ellipse cx="50" cy="40" rx="3" ry="11"
        fill="${iLight}" stroke="${iDeep}" stroke-opacity=".4" stroke-width=".7"
        transform="rotate(${spin + i*(360/13)} 50 50)"/>`).join("") +
      `<circle cx="50" cy="50" r="4.5" fill="${GOLD}" opacity=".8"/>`,
  };
  const grad = (gid, [f,, l]) => `<radialGradient id="${gid}" cx="50%" cy="80%" r="72%">
      <stop offset="0%" stop-color="${l}"/><stop offset="100%" stop-color="${f}"/></radialGradient>`;

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>${grad(id, [fill, deep, light])}${in2 ? grad(id2, in2) : ""}</defs>
    <circle cx="50" cy="50" r="50" fill="${deep}" fill-opacity=".13"/>
    ${form.rings.map(ring).join("")}
    ${hearts[form.heart]}
  </svg>`;
}
/* ---------- framing the photo ---------- */
/* The crop is three numbers rather than a second image: how far in, and how far off
   center either way, as fractions of the picture. So it can be changed as often as you
   like and never costs anything, and one photo serves the circle at any size. */
let photoFor = null, draftCrop = null;
const DEFAULT_CROP = { ar: 1, zoom: 1, x: 0, y: 0 };
const cropOf = v => ({ ...DEFAULT_CROP, ...(v.photoCrop || {}) });
const MAX_ZOOM = 4;

/* The picture is laid over the circle so its shorter side just covers, then scaled.
   Offsets are fractions of the drawn size, so they hold at 72px and at 260. */
function photoBox(crop, C){
  const ar = crop.ar || 1, zoom = crop.zoom || 1;
  const W = (ar >= 1 ? C * ar : C) * zoom;
  const H = (ar >= 1 ? C : C / ar) * zoom;
  return { W, H, maxX: (W - C) / (2 * W), maxY: (H - C) / (2 * H) };
}
function clampCrop(crop){
  crop.zoom = Math.max(1, Math.min(MAX_ZOOM, crop.zoom || 1));
  const b = photoBox(crop, 100);
  crop.x = Math.max(-b.maxX, Math.min(b.maxX, crop.x || 0));
  crop.y = Math.max(-b.maxY, Math.min(b.maxY, crop.y || 0));
  return crop;
}
function photoStyle(crop, C){
  const b = photoBox(crop, C);
  return `position:absolute;left:50%;top:50%;width:${b.W}px;height:${b.H}px;max-width:none;` +
    `transform:translate(-50%,-50%) translate(${(crop.x || 0) * b.W}px,${(crop.y || 0) * b.H}px)`;
}

/* ---------- the face of a cultivar, on a phone ---------- */
/* The circle itself: a photograph once there is one, a drawing until then. In a list
   it is only a face; on the cultivar's own page it is also the way to change it, and
   the little rose badge is what says so — a phone has no hover to say it instead. */
function bloomFace(v, px, cls){
  const src = Photos.url(v);
  return `<span class="avatar${cls ? " " + cls : ""}" style="width:${px}px;height:${px}px">${
    src ? `<img src="${esc(src)}" alt="" style="${photoStyle(cropOf(v), px)}">` : bloomSvg(v)}</span>`;
}
function bloomAvatar(v){
  const src = Photos.url(v);
  return `<span class="avatarwrap">
    <button class="avatar big tap" id="cvPhoto" aria-label="${
      src ? "Frame this photograph" : "Add a photograph"}">${
      src ? `<img src="${esc(src)}" alt="${esc(v.name || "")}" style="${photoStyle(cropOf(v), 84)}">`
          : bloomSvg(v)}</button>
    <span class="camera">${ICON.camera}</span>
    <input type="file" accept="image/*" id="cvPhotoFile" hidden>
  </span>`;
}

/* The whole frame is kept, only made small enough to keep — so the crop can be changed
   later without going back to the camera roll. A long edge of 800 is sharp at any zoom
   the circle can reach, and small enough to travel inside the records when there is no
   photos/ folder to put it in. */
const PHOTO_PX = 800;
function takePhoto(v, file, thenAdjust){
  if(!file || !/^image\//.test(file.type)) return toast("That is not an image");
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = async () => {
    const k = Math.min(1, PHOTO_PX / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res => c.toBlob(res, PHOTO_MIME, 0.72));
    if(!blob) return toast("Could not read that image");
    try{ await Photos.write(v, blob); }
    catch(e){ return toast("Could not save the photo: " + e.message); }
    v.photoCrop = { ar: c.width / c.height, zoom: 1, x: 0, y: 0 };
    markDirty();
    /* Straight into framing it, which is what you wanted to do next anyway. */
    if(thenAdjust !== false){ photoFor = v.id; draftCrop = { ...v.photoCrop }; }
    render();
    toast(`Photo set for ${v.name || "this cultivar"}`);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Could not read that image"); };
  img.src = url;
}

/* ---------- framing the photo ---------- */
/* As big a circle as the phone will give it, so a thumb has something to aim with. */
let CROP_PX = 260;
const cropSize = () => Math.max(196, Math.round(Math.min(window.innerWidth - 76, window.innerHeight * 0.40, 320)));

function photoPanel(v){
  CROP_PX = cropSize();
  const c = draftCrop || cropOf(v);      // opened without a draft: frame what is already set
  return sheet("cp", {
    title: "Frame the bloom",
    sub: esc(v.name || "Untitled cultivar"),
    body: `<div style="display:flex;flex-direction:column;align-items:center">
      <div class="cropview" id="cpView" style="width:${CROP_PX}px;height:${CROP_PX}px">
        <img id="cpImg" src="${esc(Photos.url(v) || "")}" alt="" draggable="false" style="${photoStyle(c, CROP_PX)}">
      </div>
      <div class="row" style="width:100%;max-width:${CROP_PX}px;margin-top:16px;gap:12px;flex-wrap:nowrap">
        <span class="small muted">Out</span>
        <input type="range" id="cpZoom" min="1" max="${MAX_ZOOM}" step="0.02" value="${c.zoom}"
               style="flex:1;min-height:34px;padding:0;-webkit-appearance:auto;appearance:auto;border:none;background:none">
        <span class="small muted">In</span>
      </div>
      <p class="small muted" style="margin:12px 0 4px;text-align:center">Drag the picture to move it,
        pinch or use the slider to zoom. This is exactly what the circle will show.</p>
    </div>`,
    foot: `<button class="btn danger" id="cpRemove">Remove</button>
      <div class="acts">
        <button class="btn" id="cpReplace">Replace</button>
        <button class="btn primary" id="cpDone">Done</button>
      </div>`
  });

function wirePhotoPanel(v){
  const view = $("#cpView"), img = $("#cpImg"), zoom = $("#cpZoom"), pick = $("#cvPhotoFile");
  if(!view || !img) return;
  if(!draftCrop) draftCrop = cropOf(v);
  /* Painted straight onto the element while dragging: a re-render mid-drag would
     replace the picture under the finger. */
  const paint = () => { img.setAttribute("style", photoStyle(draftCrop, CROP_PX)); };
  const shut = () => { photoFor = null; draftCrop = null; render(); };

  /* One finger moves the picture, two pinch it. The pointers are kept in a map so the
     handover between one and two — and back again — never jumps. */
  const pts = new Map();
  let base = null;
  const gap = () => {
    const [a,b] = [...pts.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  const rebase = () => {
    base = { x: draftCrop.x, y: draftCrop.y, zoom: draftCrop.zoom,
             box: photoBox(draftCrop, CROP_PX),
             pts: [...pts.values()].map(p => ({ ...p })),
             gap: pts.size >= 2 ? gap() : 0 };
  };
  view.addEventListener("pointerdown", e => {
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    rebase();
  });
  view.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId) || !base) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size >= 2 && base.gap > 0){
      draftCrop.zoom = base.zoom * (gap() / base.gap);
      clampCrop(draftCrop);
      if(zoom) zoom.value = draftCrop.zoom;
    }else{
      draftCrop.x = base.x + (e.clientX - base.pts[0].x) / base.box.W;
      draftCrop.y = base.y + (e.clientY - base.pts[0].y) / base.box.H;
      clampCrop(draftCrop);
    }
    paint();
  });
  const lift = e => { pts.delete(e.pointerId); if(pts.size) rebase(); else base = null; };
  view.addEventListener("pointerup", lift);
  view.addEventListener("pointercancel", lift);
  /* A trackpad or a mouse wheel, for whoever opens this edition on a laptop. */
  view.addEventListener("wheel", e => {
    e.preventDefault();
    draftCrop.zoom = (draftCrop.zoom || 1) * (e.deltaY < 0 ? 1.09 : 1/1.09);
    clampCrop(draftCrop); paint();
    if(zoom) zoom.value = draftCrop.zoom;
  }, {passive:false});
  if(zoom) zoom.oninput = e => { draftCrop.zoom = Number(e.target.value); clampCrop(draftCrop); paint(); };

  $("#cpClose").onclick = shut;
  $("#cpBack").onclick = e => { if(e.target.id === "cpBack") shut(); };
  /* The crop is the cheap part, so it is written as you go and Done just closes. */
  $("#cpDone").onclick = () => { v.photoCrop = { ...draftCrop }; markDirty(); shut(); };
  $("#cpReplace").onclick = () => pick && pick.click();
  $("#cpRemove").onclick = async () => {
    await Photos.remove(v);          /* takes the file with it, not just the reference */
    photoFor = null; draftCrop = null;
    markDirty(); render(); toast("Photo removed");
  };
}

/* Tap the circle: the camera roll if there is nothing in it yet, the framing if there
   is. On iOS the file input offers the camera, the photo library and Files all three. */
function wireAvatar(v){
  const av = $("#cvPhoto"), pick = $("#cvPhotoFile");
  if(!av || !pick) return;
