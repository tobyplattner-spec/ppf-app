<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FDF9F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Plattner Peonies &amp; Farmstead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#C25A6D; --rose-dark:#8A3D4C; --rose-tint:#F7E7EA;
  --graphite:#3A3A3C; --graphite-60:#8A8A8C; --graphite-30:#C9C9CB;
  --cream:#FDF9F7; --card:#FFFFFF; --line:#E8E2DF;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--graphite);
  font-family:'Lato',system-ui,sans-serif; font-weight:400; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.display{
  font-family:'Baskervville',Georgia,serif; text-transform:uppercase;
  letter-spacing:.08em; font-weight:400; margin:0;
}
h1{font-size:26px}
h2{font-size:24px}
h3{font-family:'Lato',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite-60);margin:0 0 12px}
.num{font-family:'Lato',sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--rose-dark);text-decoration:none}
button{font-family:'Lato',sans-serif;font-size:14px;cursor:pointer}

/* shell */
/* header and nav stick together as one block, so the nav never needs to know how
   tall the header happens to be. */
.topbar{position:sticky;top:0;z-index:20;background:var(--graphite)}
header{background:var(--graphite);color:var(--cream);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .mark{width:30px;height:30px;flex:none}
/* Baskervville's cap height is about 0.69 em, so 32px of font gives roughly 22px of
   letter — a little under the 30px mark, which reads better than matching it exactly. */
header h1{color:var(--cream);font-size:32px;line-height:1;flex:1;min-width:200px}
@media(max-width:1100px){ header h1{font-size:26px} }
@media(max-width:760px){ header h1{font-size:21px} }
nav{display:flex;gap:4px;padding:0 24px;background:var(--graphite);border-top:1px solid rgba(253,249,247,.15)}
nav a{
  color:rgba(253,249,247,.72); padding:10px 16px; font-size:13px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase; border-bottom:2px solid transparent;
}
nav a.on{color:var(--cream);border-bottom-color:var(--rose)}
main{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
.filebar{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(253,249,247,.72)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--graphite-60);flex:none}
.dot.ok{background:#7FA663} .dot.dirty{background:var(--rose)}

/* controls */
.btn{background:transparent;border:1px solid var(--graphite-30);color:var(--graphite);padding:7px 14px;border-radius:var(--radius)}
.btn:hover{background:#fff;border-color:var(--graphite-60)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--rose-dark);border-color:var(--rose-dark)}
.btn.light{border-color:rgba(253,249,247,.4);color:var(--cream)}
.btn.light:hover{background:rgba(253,249,247,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{
  font-family:'Lato',sans-serif;font-size:14px;color:var(--graphite);
  background:#fff;border:1px solid var(--graphite-30);border-radius:var(--radius);padding:7px 10px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint)}

/* An empty date field draws "mm/dd/yyyy" of its own accord. The calendar icon on the
   right already says what the field is, so blank the letters and keep the slashes —
   the field reads "  /  /    ", which is a shape rather than an instruction.
   `required` is what makes an empty field match :invalid; there is no form to submit,
   so it costs nothing. :not(:focus) keeps the digits visible while you are typing. */
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-month-field,
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-day-field,
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-year-field{color:transparent}
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit-text{color:var(--graphite-30)}
/* Vertical only — dragging a textarea wider would push it out of its grid column. */
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--graphite-60);margin:0 0 4px}

/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid{display:grid;gap:14px}
.metrics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.metric .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--graphite-60)}
.metric .v{font-size:30px;line-height:1.25;margin-top:2px}
.metric .s{font-size:12px;color:var(--graphite-60)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.section{margin:30px 0 0}
.muted{color:var(--graphite-60)}
.small{font-size:13px}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--graphite-60);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
}
th:hover{color:var(--graphite)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--rose-tint)}
td.r,th.r{text-align:right}


/* collection: swatches, season strips, editable panels */
.strip{display:inline-flex;gap:2px;vertical-align:-2px;margin-right:8px}
.strip i{width:5px;height:13px;border-radius:1.5px;background:var(--line)}
.strip i.on{background:var(--rose)}
.strip i.near{background:var(--rose-tint)}
.cell{display:flex;align-items:center;min-width:0}
.cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.crumb{font-size:13px;color:var(--graphite-60);display:inline-block;margin-bottom:10px}
.crumb:hover{color:var(--rose-dark)}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
/* The bloom, or a drawing standing in for it, and the one place a photo is swapped. */
.avatarwrap{position:relative;flex:0 0 auto;line-height:0}
.avatar{position:relative;width:72px;height:72px;border-radius:50%;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:var(--card);transition:box-shadow .12s,border-color .12s}
.avatar svg{width:100%;height:100%;display:block}
.avatar img{display:block}
.avatar:hover,.avatar:focus-visible{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint);outline:none}
.avatar.over{border-color:var(--rose);box-shadow:0 0 0 5px var(--rose-tint)}
/* Framing: the same circle, big enough to aim with. */
.cropview{position:relative;border-radius:50%;overflow:hidden;cursor:grab;
  border:1px solid var(--line);background:var(--line);touch-action:none;user-select:none}
.cropview.grabbing{cursor:grabbing}
.cropview img{pointer-events:none}
.pagehead .grow{flex:1;min-width:240px}
.subline{font-size:13px;color:var(--graphite-60);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px 16px}
/* Every row sits on the same twelve columns, so a field edge in one row lands on a
   field edge in the next instead of the two rows ragging against each other. */
.fieldrow{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 16px;margin-bottom:16px}
.fieldrow:last-child{margin-bottom:0}
.fieldrow > div{grid-column:span 3}
.fieldrow > div.span6{grid-column:span 6}
.fieldrow > div.span9{grid-column:span 9}
.fieldrow > div.span12{grid-column:span 12}
@media(max-width:900px){ .fieldrow > div{grid-column:span 6}
  .fieldrow > div.span6,.fieldrow > div.span9{grid-column:span 12} }
@media(max-width:560px){ .fieldrow > div, .fieldrow > div.span6{grid-column:span 12} }
.fields .wide{grid-column:1/-1}
.fields label{margin-bottom:4px}
.ro{font-size:14px;padding:7px 0;color:var(--graphite)}
.ro.muted{color:var(--graphite-60)}

.card.editing{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-tint)}
.btn.danger{border-color:#E0BDBD;color:#A32D2D}
.btn.danger:hover{background:#FCEBEB;border-color:#A32D2D}
.seg{display:inline-flex;background:var(--line);border-radius:22px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 18px;border-radius:20px;font-size:13px;font-weight:700;
  letter-spacing:.03em;color:var(--graphite-60);cursor:pointer;transition:background .12s,color .12s}
.seg button.on{background:var(--card);color:var(--graphite);box-shadow:0 1px 3px rgba(58,58,60,.2)}
.seg button:hover:not(.on){color:var(--graphite)}
.rowx{border:none;background:none;color:var(--graphite-30);font-size:17px;line-height:1;padding:2px 4px;border-radius:4px}
.rowx:hover{color:var(--rose-dark);background:var(--rose-tint)}
.emptyrow td{padding:26px;text-align:center;color:var(--graphite-60)}
.countpill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--rose-tint);color:var(--rose-dark)}
.countpill.zero{background:#F0EFEE;color:var(--graphite-60)}

/* Outstanding work. A row is a whole link, so the number and the sentence are one
   target rather than two things to aim between. */
.todo{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);
  color:var(--graphite);text-decoration:none}
.todo:last-child{border-bottom:none}
.todo:hover{color:var(--rose-dark)}
.todo .num{min-width:34px;text-align:right;font-weight:700;font-size:17px}

/* The season on show. A page that only ever holds one year should say which. */
.seasontag{font-size:17px;font-weight:700;color:var(--graphite-60)}

/* plant sheet — a panel over the cultivar it belongs to, not a page of its own.
   Named psheet-* so it can never collide with an unrelated .sheet again. */
.psback{position:fixed;inset:0;background:rgba(58,58,60,.42);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px}
.pspanel{background:var(--card);border-radius:14px;width:min(760px,100%);
  max-height:min(86vh,780px);overflow:auto;box-shadow:0 14px 44px rgba(58,58,60,.32)}
.pshead{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 0}
.pshead .grow{flex:1;min-width:0}
.psbody{padding:14px 24px 0}
.psfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 24px 20px;margin-top:18px;border-top:1px solid var(--line)}
/* Confirming a delete needs a sentence and three buttons; side by side they crush. */
.psfoot.stacked{display:block}
.psfoot.stacked .acts{justify-content:flex-end}
tbody tr[data-tx],tbody tr[data-goplant]{cursor:pointer}
.psx{border:none;background:none;font-size:21px;line-height:1;color:var(--graphite-60);
  padding:2px 7px;border-radius:6px;cursor:pointer}
.psx:hover{background:var(--line);color:var(--graphite)}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.est{background:var(--rose-tint);color:var(--rose-dark)}
.pill.plant{background:#EDEFEA;color:#4A5A3C}
.pill.order{background:#F2EEE9;color:#6B5B4A}
.pill.other{background:#EFEFF0;color:var(--graphite-60)}
.loclink,.locink{color:var(--rose-dark);font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--rose)}
.loclink:hover,.locink:hover{color:var(--rose);border-bottom-style:solid}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:20px;color:var(--graphite-60)}

/* bloom bars */
.bloom{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
.bar{height:16px;background:var(--rose);border-radius:3px;min-width:2px}
.bar.none{background:var(--line)}
.bar.unk{background:var(--graphite-30)}

/* connect screen */
.connect{max-width:520px;margin:64px auto;text-align:center}
.connect h2{margin-bottom:14px}
.connect p{color:var(--graphite-60);margin:0 0 20px}

/* plant record */
.kv{display:grid;grid-template-columns:132px 1fr;gap:6px 14px;font-size:14px}
.kv > div{display:block}
.kv > div dt{color:var(--graphite-60);font-size:13px;margin-bottom:2px}
.kv > div dd{margin:0}
.kv dt{color:var(--graphite-60);font-size:13px}
.kv dd{margin:0}
.back{font-size:13px;color:var(--graphite-60);display:inline-block;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.two{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}

/* order builder */
.lines td{padding:5px 6px}
.lines input,.lines select{padding:6px 8px;font-size:13px}

/* A picker swapped over to typing a new name. The chevron is the way back to the
   list — it is the dropdown's own glyph, so it reads as "give me the list again". */
.pick{position:relative;display:block}
.pick > input{padding-right:28px}
.lines .pick > input{padding-right:24px}
.pickback{position:absolute;right:1px;top:1px;bottom:1px;width:24px;padding:0;
  border:none;background:none;color:var(--graphite-30);font-size:12px;line-height:1;
  cursor:pointer;border-radius:0 var(--radius) var(--radius) 0}
.pickback:hover{color:var(--rose);background:var(--rose-tint)}
.alloc{font-size:12px;color:var(--graphite-60);font-variant-numeric:tabular-nums}
.warn{color:var(--rose-dark);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--graphite);color:var(--cream);padding:10px 18px;border-radius:var(--radius);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

/* property map — sized to the viewport, never scrolls */
/* The pane takes whatever height is left after the header and nav, measured by the
   layout rather than guessed at — a hardcoded calc() left it hanging below the fold,
   so the map centered itself inside a box whose bottom you couldn't see.
   The pane is a flex item all the way down: no percentage heights, which resolve to
   zero against a flex-sized parent and take the whole map with them. */
body.mapview{overflow:hidden;height:100vh;display:flex;flex-direction:column}
body.mapview .topbar{flex:none}
/* margin:0 is load-bearing. main carries `margin:0 auto` from the base rule, and an
   auto margin on a flex item's cross axis cancels the stretch and shrinks it to its
   content — which here is absolutely positioned and so measures zero. That collapsed
   the pane to nothing and overflow:hidden clipped the entire map away. */
body.mapview main{margin:0;padding:0;max-width:none;width:100%;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
body.mapview .mapwrap{width:100%}
.mapwrap{position:relative;flex:1 1 auto;min-height:340px}
.plot{
  position:absolute;inset:0;background:var(--cream);
  touch-action:none;overflow:hidden;cursor:grab;
  user-select:none;-webkit-user-select:none;   /* a drag must never start selecting text */
}
.maptop{
  position:absolute;top:14px;left:18px;z-index:4;display:flex;align-items:baseline;gap:12px;
  background:rgba(253,249,247,.88);border-radius:var(--radius);padding:4px 12px;
  pointer-events:none;                /* never intercept a pan that starts up here */
}
.maphud{pointer-events:none}
.maptop h2{font-size:20px}
.island{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;gap:8px;
  background:rgba(253,249,247,.97);border:1px solid var(--graphite-30);border-radius:16px;
  padding:12px 12px 14px;width:186px;max-height:calc(100% - 130px);
  box-shadow:0 3px 16px rgba(58,58,60,.16);
}
.island .ilabel{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--graphite-60);flex:none;
}
.island .ihint{font-size:11px;color:var(--graphite-60);line-height:1.45;flex:none}
/* Dragging off the island shows the marker it is about to become, at the size it
   will be at the current zoom — so you can see whether it fits before you let go. */
.ghost{
  position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);
  background:var(--rose);border:2px solid #fff;border-radius:50%;
  box-shadow:0 2px 8px rgba(58,58,60,.35);opacity:.6;
}
.ghost.over{opacity:1}
.plot.panning{cursor:grabbing}
/* While any drag is live, nothing anywhere is selectable — a pointer that wanders
   over the header must not start highlighting it. */
body.dragging, body.dragging *{user-select:none !important;-webkit-user-select:none !important}
body.dragging{cursor:grabbing}
/* Child combinator, not descendant: this must hit the map only. As a descendant
   rule it also caught the compass svg and stretched it across the whole pane. */
.plot > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{cursor:grab}
.pin:active{cursor:grabbing}
.pin text{user-select:none;pointer-events:none}
.maphud{position:absolute;left:18px;bottom:18px;font-size:11px;color:var(--graphite-60);background:rgba(253,249,247,.88);padding:3px 9px;border-radius:var(--radius);z-index:4}
/* Compass and scale live in the pane, not the map, so panning and zooming can't
   drag them around — only the scale's reading changes. */
.compass{position:absolute;top:16px;right:20px;z-index:4;pointer-events:none;opacity:.9}
.compass svg{display:block;width:88px;height:88px}
.scalebar{
  position:absolute;right:20px;bottom:18px;z-index:4;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-size:11px;font-family:'Lato',sans-serif;color:var(--graphite);
  text-shadow:0 0 3px var(--cream),0 0 3px var(--cream);
}
.sbbar{
  height:6px;border:1.5px solid var(--graphite);border-top:none;opacity:.75;
  transition:width .06s linear;
}
.chip{
  flex:0 0 auto;                      /* flex items shrink by default — these must not */
  border:1px solid var(--graphite-30);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;
  line-height:1.35;cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  touch-action:none;user-select:none;
}
.chip:hover{border-color:var(--rose);color:var(--rose-dark)}
.chip:active{cursor:grabbing}
.trayscroll{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;padding:2px 1px;min-height:0}
.scale{font-size:11px;color:var(--graphite-60);margin-top:6px}

/* planting day sheet */
}
/* The sandbox says so on the bar, on every screen: the one thing that must never
   happen is typing into it believing it is the farm, or the other way about. */
.sandtag{
  font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:var(--rose);color:#fff;border-radius:5px;padding:3px 7px;line-height:1;
}
body.sandbox .topbar,body.sandbox header,body.sandbox nav{background:#4A3A3E}
.books{margin-right:4px}
.books button{padding:5px 12px;font-size:12px}
</style>
</head>
<body>

<script>
"use strict";

/* ---------- constants ---------- */
const SEASONS = ["Very Early","Early","Early-Mid","Mid","Mid-Late","Late","Very Late"];
/* Ready to Plant is a root in your hands that you made rather than bought: lifted,
   cut and waiting on a hole. It sits beside Received because it is the same stage. */
const STATUSES = ["Ordered","Received","Ready to Plant","Planted","Established","Divided","Lost","Sold"];
const BLOOM_TYPES = ["Single","Semi-Double","Double","Bomb","Japanese","Anemone"];
const PLANT_TYPES = ["Herbaceous","Intersectional (Itoh)","Tree"];
const STRENGTH = ["Self-supporting","Needs support","Flops"];
const FRAGRANCE = ["None","Light","Moderate","Strong"];
const CAT_OUT = ["Plants","Tools","Books","Amendments","Supports","Subscriptions","Packaging","Other"];
const CAT_IN  = ["Stems","Bouquets","Roots","Divisions","U-pick","Events","Other"];
/* Money in is money for a number of things, so income carries the count as well as the
   sum. The four that are plainly countable are named; the rest just say Quantity. */
const CAT_IN_UNITS = { Stems:"Stems", Bouquets:"Bouquets", Roots:"Roots", Divisions:"Divisions" };
const unitsLabel = cat => CAT_IN_UNITS[cat] || "Quantity";
const unitWord = (cat, n) => {
  const w = (CAT_IN_UNITS[cat] || "unit").toLowerCase();
  return n === 1 ? w.replace(/s$/, "") : (w === "unit" ? "units" : w);
};

const SPACING_FT = 3;   // herbaceous peonies, minimum comfortable center-to-center

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cents = n => Math.round((Number(n) || 0) * 100);
const money = n => (cents(n) / 100);
const fmt = n => "$" + money(n).toFixed(2);
/* Asking for a locale date builds a formatter every time; one kept formatter does
   the same job for about a thirty-sixth of the work. Held on the function itself,
   so this is still the one self-contained line the tests pull out. */
const fmtDate = d => d ? (fmtDate.f || (fmtDate.f = new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric"}))).format(new Date(d + "T00:00:00")) : "—";
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* Buttons are titles, so they take title case: everything capitalised except the
   little joining words, and those only when they are neither first nor last.
   Anything built from data has to come through here, because the label is only
   assembled at the moment it is drawn. */
const SMALL_WORDS = new Set(["a","an","and","as","at","but","by","for","in","nor",
  "of","off","on","or","per","so","the","to","up","via","vs"]);
function titleCase(s){
  const w = String(s ?? "").trim().split(/\s+/);
  return w.map((x,i) => i > 0 && i < w.length - 1 && SMALL_WORDS.has(x.toLowerCase())
    ? x.toLowerCase()
    : x.replace(/^[a-z]/, c => c.toUpperCase())).join(" ");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- state ---------- */
let DB = null, dirty = false;

/* Every change writes itself a moment later, so the button in the corner is a fallback
   rather than a chore. Actions that speak for themselves still save at once, with a word. */
let autoT = null;
/* Bumped by every edit. A save only clears the flag if nothing changed while it
   was in flight — otherwise the edit made mid-write would be marked saved and the
   pending autosave would then find nothing left to do. */
let editSeq = 0;
function markDirty(){ dirty = true; editSeq++; paintFileState(); saveSoon(); }
function saveSoon(){
  clearTimeout(autoT);
  autoT = setTimeout(() => { if(dirty && Store.file) saveNow(null, true); }, 500);
}
function paintFileState(){
  const dot=$("#dot"), st=$("#fileState"), btn=$("#saveBtn");
  paintBooks();
  if(!DB){ dot.className="dot"; st.textContent="No file"; btn.disabled=true; return; }
  const owed = Store.unsent && !dirty;
  dot.className = "dot " + (dirty || owed ? "dirty" : "ok");
  const where = Store.name() || DATA_FILE;
  st.textContent = where + (dirty ? " — unsaved"
    : owed ? (navigator.onLine === false ? " — waiting for signal" : " — not sent yet")
    : " — saved");
  btn.disabled = !dirty && !owed;
}
/* Two sets of books in the one repository: the farm's, and one to experiment on. They
   are separate files with separate photographs, and what one owes is never sent to the
   other, so an afternoon of poking about cannot reach the records that matter. */
function paintBooks(){
  const seg = $("#bookSeg"), tag = $("#sandTag");
  if(!seg) return;
  const on = !!DB && Store.canSwitchBooks;
  seg.hidden = !on;
  if(tag) tag.hidden = !(DB && Store.isSandbox);
  document.body.classList.toggle("sandbox", !!DB && Store.isSandbox);
  if(!on){ seg.innerHTML = ""; return; }
  const B = Store.books;
  seg.innerHTML = Object.keys(B).map(k =>
    `<button data-book="${k}" class="${Store.book === k ? "on" : ""}">${esc(B[k].label)}</button>`).join("");
  seg.querySelectorAll("[data-book]").forEach(el => el.onclick = () => switchBook(el.dataset.book));
}
async function switchBook(to){
  if(to === Store.book) return;
  /* An edit that has not reached home yet belongs to the book it was made in. It stays
     on that book's own shelf and is still owed, but it will not go until you come back
     — so it is said out loud rather than assumed. */
  if((dirty || Store.unsent) && !confirm(
    `There is work in ${Store.bookLabel()} that has not been sent yet. It stays here and goes ` +
    `the next time you open ${Store.bookLabel()}. Change books anyway?`)) return;
  const was = Store.book;
  try{
    DB = await Store.openBook(to);
    await Photos.loadAll(DB);
    dirty = false; editing = null; openPlant = null; openTxn = null;
    armDelete = armPlant = false;
    view = null; plotAR = null; fitW = null; focusId = null;
    bloomYear = null; ledRange = "all"; ledFrom = ledTo = "";
    colFilter.q = "";
    location.hash = "#/dashboard";
    render(); paintFileState();
    toast(Store.isSandbox ? "Sandbox — nothing here is the farm" : "Back in the farm's records");
  }catch(e){
    await Store.setBook(was);
    render();
    toast("Could not open that: " + e.message);
  }
}

const today = () => new Date().toISOString().slice(0,10);
/* An action that speaks for itself passes its own message, so a one-click change
   can say what it did instead of just "Saved". */
let saving = null;
async function saveNow(msg, quiet){
  clearTimeout(autoT);
  if(saving) await saving;                     // one writer at a time
  const at = editSeq;
  try{
    saving = Store.save(DB); await saving;
    /* Typed into while the file was being written: the flag stays up and the next
       autosave has something to do, rather than the write clearing it wrongly. */
    if(editSeq === at) dirty = false; else saveSoon();
    paintFileState(); if(!quiet) toast(msg || "Saved");
  }
  catch(e){
    paintFileState();
    if(e.kind === "conflict") await resolveConflict();
    else toast("Save failed: " + e.message);
  }
  finally{ saving = null; }
}

/* ---------- derived ---------- */
const cultivar = id => DB.cultivars.find(v => v.id === id) || {};

function plantCost(pid){
  let c = 0;
  for(const t of DB.transactions)
    for(const a of (t.allocations||[]))
      if(a.target==="plant" && a.targetId===pid) c += cents(a.amount) * (t.direction==="income" ? -1 : 1);
  return c/100;
}
/* The same walk answers every plant at once. Screens that need more than one cost
   ask for the lot rather than walking the ledger once per peony. Built fresh each
   time it is called, so there is no kept answer that can fall out of date. */
function plantCosts(){
  const m = new Map();
  for(const t of DB.transactions){
    const sign = t.direction === "income" ? -1 : 1;
    for(const a of (t.allocations || []))
      if(a.target === "plant") m.set(a.targetId, (m.get(a.targetId) || 0) + cents(a.amount) * sign);
  }
  return { of: id => (m.get(id) || 0) / 100 };
}
/* Over everything by default, or over whatever slice the ledger is showing. */
function totals(list){
  let out=0, inc=0, alloc=0;
  for(const t of (list || DB.transactions)){
    if(t.direction==="income") inc += cents(t.amount); else out += cents(t.amount);
    for(const a of (t.allocations||[])) if(t.direction!=="income") alloc += cents(a.amount);
  }
  return {out:out/100, inc:inc/100, alloc:alloc/100, overhead:(out-alloc)/100};
}
function txBalance(t){
  const a = (t.allocations||[]).reduce((s,x)=>s+cents(x.amount),0);
  return {allocated:a/100, diff:(cents(t.amount)-a)/100, balanced:a===cents(t.amount)};
}
function activePlants(){ return DB.plants.filter(p => !["Lost","Sold","Divided"].includes(p.status)); }

/* ---------- a root settles on its own ---------- */
/* Roots go in in the fall and are left alone for two springs; by the third the plant is
   properly settled. One that went in before midsummer counts that spring as its first.
   Nothing else in the app ever moves a plant on from Planted, so the calendar does it. */
const firstSpring = d => Number(d.slice(0,4)) + (Number(d.slice(5,7)) >= 7 ? 1 : 0);
const settledOn = d => `${firstSpring(d) + 2}-06-01`;      // its third spring, once the season is under way
function ageIntoEstablished(){
  const on = today();
  const moved = DB.plants.filter(p =>
    p.status === "Planted" && p.plantedDate && settledOn(p.plantedDate) <= on);
  for(const p of moved) p.status = "Established";
  return moved.length;
}
/* Wishlist was dropped. Anything left on one reads as something you meant to have. */
function retireWishlist(){
  const old = DB.plants.filter(p => p.status === "Wishlist");
  for(const p of old) p.status = "Ordered";
  return old.length;
}
/* Everything that has to be put right the moment a file is opened, from either way in.
   A change you did not make says so, so it is never a surprise. */
function settleOnLoad(){
  const settled = ageIntoEstablished(), legacy = retireWishlist();
  if(settled) saveNow(`${settled} plant${settled === 1 ? " is" : "s are"} now established`);
  else if(legacy) saveNow(null, true);
  return settled;
}
function nextPlantId(){ return DB.plants.reduce((m,p)=>Math.max(m,p.id),0) + 1; }
function nextTxId(){ return DB.transactions.reduce((m,t)=>Math.max(m,t.id),0) + 1; }
function nextBloomId(){ return DB.blooms.reduce((m,b)=>Math.max(m,b.id),0) + 1; }

/* ---------- what bloomed, and when ---------- */
/* One row per cultivar per day. Everything worth knowing is derived from it rather
   than stored twice: the season's first and last bloom, the real bloom window that
   eventually replaces the catalog guess, stems cut, and cost per stem. */
const bloomsOn = d => DB.blooms.filter(b => b.date === d);
const bloomDays = () => [...new Set(DB.blooms.map(b => b.date))].sort().reverse();
const bloomYears = () => [...new Set(DB.blooms.map(b => b.date.slice(0,4)))].sort().reverse();
const inYear = (b, y) => !y || b.date.slice(0,4) === y;

/* Null when a cultivar simply did not bloom that year — an absence is not a zero. */
function cultivarSeason(cid, year){
  const rows = DB.blooms.filter(b => b.cultivarId === cid && inYear(b, year))
    .sort((a,b) => a.date.localeCompare(b.date));
  if(!rows.length) return null;
  return { year, first: rows[0].date, last: rows[rows.length-1].date, days: rows.length,
           stems: rows.reduce((s,r) => s + (r.stems || 0), 0) };
}
function seasonTotals(year){
  const rows = DB.blooms.filter(b => inYear(b, year));
  return { stems: rows.reduce((s,r) => s + (r.stems || 0), 0),
           cultivars: new Set(rows.map(r => r.cultivarId)).size,
           days: new Set(rows.map(r => r.date)).size,
           first: rows.length ? rows.map(r => r.date).sort()[0] : null };
}

function pillClass(s){
  if(s==="Established") return "est";
  if(s==="Planted"||s==="Received"||s==="Ready to Plant") return "plant";
  if(s==="Ordered") return "order";
  return "other";
}

const ROUTES = [["#/dashboard","Dashboard"],["#/collection","Collection"],["#/map","Map"],["#/bloom","Bloom"],["#/ledger","Ledger"]];

  document.body.classList.toggle("mapview", hash.startsWith("#/map") && !!DB);
  /* An open panel is what keeps an edit alive; leaving the screen behind it ends the
     edit. The ledger only counts while one of its transactions is actually open. */
  const panelOpen = hash.startsWith("#/collection/") || hash.startsWith("#/plant/")
    || (hash.startsWith("#/ledger") && openTxn !== null);
  if(editing && !panelOpen) editing = null;
  if(!DB){ return renderConnect(app); }

/* ---------- connect ---------- */
/* Two ways in. The repository is where the farm actually lives — the same records the
   phone is reading, so an evening at the desk and a morning in the field are the same
   afternoon's work. A local folder is the other way: what you fall back on when the
   network is not there, and what the app was before it could be carried. */
let connectStep = null;          /* null | "repo" */

/* The token is asked for once per machine and kept here, which is what lets the app
   itself sit in a public repository with nothing worth stealing in it. */
function repoFormHtml(cfg){

  <div style="text-align:left">

    <p class="small muted" style="margin:10px 0 0">A fine-grained token with <strong>Contents: read and write</strong>
      on that one repository. It stays on this computer and is never part of the app.</p>

}
function readRepoForm(){

           token: $("#rToken").value.trim(), branch: "main" };
}

function renderConnect(app){
  const needsRegrant = !!Store.pending;

  if(connectStep === "repo"){
    app.innerHTML = `<div class="connect card">
      <h2>Connect your records</h2>
      <p>Once, on this computer.</p>
      ${repoFormHtml({})}
      <div style="display:flex;gap:8px;margin-top:20px">
        <button class="btn" id="rBack">Back</button>

      }catch(e){

    return;
  }

  const folderLine = !Store.supported
    ? `<p class="small muted" style="margin-top:22px">A local farm folder needs Chrome or Edge on the desktop.</p>`
    : `<p class="small muted" style="margin-top:22px">
         <a href="#" id="cFolder">Open a local farm folder instead</a> — the folder holding
         <strong>farm-data.json</strong>, written in place, the way this app began.</p>`;

  app.innerHTML = `<div class="connect card">
    <h2>${needsRegrant ? "Reconnect your farm folder" : "Connect your records"}</h2>
    <p>${needsRegrant
      ? "Browsers ask permission again each session. One click and you're back in."
      : "Your records live in a repository of their own, and this reads and writes them in place \u2014 the same ones the phone is reading."}</p>
    <button class="btn primary" id="connect">${needsRegrant ? "Reconnect" : "Connect Your Records"}</button>
    ${needsRegrant ? "" : folderLine}

  $("#connect").onclick = async () => {

      }catch(e){ if(e.name !== "AbortError") toast("Could not open: " + e.message); }
      return;
    }
    connectStep = "repo"; render();
  };

  if(fold) fold.onclick = async e => {

    }catch(e){ if(e.name !== "AbortError") toast("Could not open: " + e.message); }

}

/* ---------- when two of you saved ---------- */
/* Only ever asked when it has actually happened: this copy is behind the one in the
   repository, and both have words in them. Neither answer loses anything, because the
   one written over is still a commit and can be read back. */
function askWhoWins(){
  return new Promise(res => {
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;background:rgba(43,43,43,.45);display:flex;" +
      "align-items:center;justify-content:center;z-index:9999;padding:20px";
    box.innerHTML = `<div class="card" style="max-width:440px">
      <h3 style="margin:0 0 10px">This was saved somewhere else too</h3>
      <p class="small" style="margin:0 0 18px">The records in the repository have changed since this
        ${Store.mode === "github" ? "window" : "app"} read them \u2014 most likely from your phone. Nothing is lost either way;
        whichever you don't keep stays in the history.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="wMine" style="flex:1">Keep What's Here</button>
        <button class="btn" id="wTheirs" style="flex:1">Take the Newer One</button>
      </div>
      <p class="small muted" id="wBusy" style="margin:14px 0 0;display:none">Working\u2026</p>
    </div>`;
    document.body.appendChild(box);
    const done = v => { box.remove(); res(v); };
    box.querySelector("#wMine").onclick   = () => { box.querySelector("#wBusy").style.display = "block"; done("mine"); };
    box.querySelector("#wTheirs").onclick = () => { box.querySelector("#wBusy").style.display = "block"; done("theirs"); };
  });
}

async function resolveConflict(){
  const who = await askWhoWins();
  try{
    if(who === "mine"){
      await Store.forceSave(DB);
      dirty = false; paintFileState(); render();
      toast("Kept this copy");
    }else{
      DB = await Store.reload();
      dirty = false; paintFileState(); render();
      toast("Took the newer copy");
    }
  }catch(e){ toast("Could not settle it: " + e.message); }
}

/* ---------- dashboard ---------- */
function renderDashboard(app){
  const t = totals();
  const act = activePlants();
  const costs = plantCosts();
  const paid = []; for(const p of act){ const c = costs.of(p.id); if(c > 0) paid.push(c); }
  const avg = paid.length ? paid.reduce((s,c)=>s+c,0)/paid.length : 0;

  const counts = {};
  for(const p of act){ const s = cultivar(p.cultivarId).bloomSeason; counts[s||"?"] = (counts[s||"?"]||0)+1; }
  const max = Math.max(1, ...Object.values(counts));
  const bars = SEASONS.map(s => {
    const n = counts[s]||0;
    return `<div class="bloom"><span class="muted">${s}</span>
      <div class="bar ${n?"":"none"}" style="width:${n?Math.round(n/max*100):3}%"></div>
      <span class="num muted">${n}</span></div>`;
  }).join("") + (counts["?"] ? `<div class="bloom"><span class="muted">Unrecorded</span>
      <div class="bar unk" style="width:${Math.round(counts["?"]/max*100)}%"></div>
      <span class="num muted">${counts["?"]}</span></div>` : "");

  const byStatus = {};
  for(const p of DB.plants) byStatus[p.status] = (byStatus[p.status]||0)+1;

  app.innerHTML = `
  <div class="between"><h2>Dashboard</h2><span class="muted small num">${DB.plants.length} plants · ${DB.cultivars.length} cultivars</span></div>

  <div class="grid metrics section">
    ${metric("Plants", act.length, `${DB.cultivars.length} cultivars`)}
    ${metric("Invested", fmt(t.out), `${fmt(t.alloc)} in plants`)}
    ${metric("Average plant", fmt(avg), `${paid.length} purchased`)}
    ${metric("Overhead", fmt(t.overhead), "tools, books, other")}
  </div>

  ${outstandingCard()}

  <div class="two section">
    <div class="card"><h3>Bloom window</h3>${bars}
      <p class="small muted" style="margin:12px 0 0">Reference values from the catalog. Recorded bloom dates replace these as seasons accumulate.</p></div>
    <div class="card"><h3>Status</h3>
      ${STATUSES.filter(s=>byStatus[s]).map(s=>
        `<div class="between" style="padding:5px 0;border-bottom:1px solid var(--line)">
          <span class="pill ${pillClass(s)}">${s}</span><span class="num">${byStatus[s]}</span></div>`).join("")}
    </div>
  </div>`;
}

/* Things the farm is waiting on. Every line is a fact the app already knows and a
   link to the one screen where you can act on it — never a nag, and never a count
   you would have to go and work out for yourself. */
function outstanding(){
  const act = activePlants(), out = [];
  const add = (n, what, href) => { if(n) out.push({ n, what, href }); };

  add(act.filter(p => p.status === "Ordered").length, "ordered and not yet received", "#/ledger");
  add(act.filter(p => p.status === "Ready to Plant").length,
      "divided and waiting to go back in the ground", "#/collection");
  add(act.filter(p => ["Received","Ordered","Ready to Plant"].includes(p.status) && p.x !== null).length,
      "placed on the map but not yet in the ground", "#/map");
  add(act.filter(p => p.x === null).length, "without a square on the map", "#/map");
  add(act.filter(p => p.status === "Planted" && !p.plantedDate).length,
      "planted with no date recorded", "#/collection");
  add(DB.cultivars.filter(c => !c.bloomSeason).length, "cultivars with no bloom season", "#/collection");

  /* Only worth saying once anything has bloomed at all — before the first season it
     is just a list of everything you own. */
  const y = String(new Date().getFullYear());
  if(DB.blooms.some(b => b.date.startsWith(y))){
    const seen = new Set(DB.blooms.filter(b => b.date.startsWith(y)).map(b => b.cultivarId));
    add(DB.cultivars.filter(c => !seen.has(c.id)).length, `cultivars not yet seen in bloom this year`, "#/bloom");
  }
  return out;
}
function outstandingCard(){
  const items = outstanding();
  if(!items.length) return `
    <div class="card section"><h3>Outstanding</h3>

  return `

    ${items.map(i => `<a class="todo" href="${i.href}">

  </div>`;
}
function metric(k,v,s){
  return `<div class="card metric"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;
}

/* ---------- editing: one binding for every field in the app ---------- */
/* Edits commit on change, which for text means on blur — so a re-render can never
   pull the caret out from under you mid-word. */
function bindEdits(app){
  app.querySelectorAll("[data-edit]").forEach(el => {
    el.onchange = () => {
      const [kind, id, field] = el.dataset.edit.split(":");
      const obj = kind === "p" ? findPlant(Number(id))
                : kind === "t" ? DB.transactions.find(x => x.id === Number(id))
                               : findCultivar(id);
      if(!obj) return;
      let v = el.value;
      if(el.dataset.t === "bool") v = v === "yes";
      else if(el.dataset.t === "num") v = v.trim() === "" ? null : Number(v);
      else { v = v.trim(); if(v === "") v = null; }
      obj[field] = v;
      markDirty(); render();
    };
  });
}
const F = {
  text: (k,id,f,v,ph="") => `<input data-edit="${k}:${id}:${f}" value="${esc(v ?? "")}" placeholder="${esc(ph)}">`,
  num:  (k,id,f,v,step=1) => `<input type="number" step="${step}" min="0" data-t="num" data-edit="${k}:${id}:${f}" value="${v ?? ""}">`,
  date: (k,id,f,v) => `<input type="date" required data-edit="${k}:${id}:${f}" value="${v || ""}">`,
  area: (k,id,f,v,rows=2) => `<textarea rows="${rows}" data-edit="${k}:${id}:${f}">${esc(v || "")}</textarea>`,
  sel:  (k,id,f,v,opts,blank="—") => `<select data-edit="${k}:${id}:${f}"><option value="">${blank}</option>${
          opts.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`,
};
const field = (label, control, cls = "") => `<div class="${cls}"><label>${label}</label>${control}</div>`;

/* ---------- pickers ---------- */
/* Fields like vendor and cultivar are a list you pick from nearly every time, and
   occasionally something new. So: a plain dropdown, with one extra option at the
   bottom that swaps it for a text box. Which boxes are currently swapped is held
   here rather than on the record, so a half-typed name can never reach the file. */
const NEW = "__new";
let newEntry = {};
const clearNew = pre => { for(const k of Object.keys(newEntry)) if(!pre || k.startsWith(pre)) delete newEntry[k]; };

/* A value that isn't in the list yet needs the text box whether or not you asked
   for it — otherwise the dropdown would quietly drop what you typed. */
function picker(key, attrs, value, known, addLabel){
  const v = value ?? "";
  if(newEntry[key] || (v && !known.includes(v)))
    return `<span class="pick"><input ${attrs} value="${esc(v)}" placeholder="${
      esc(addLabel.replace(/^\+ |…$/g, ""))}"><button class="pickback" data-pick="${key}"
      title="Back to the list" aria-label="Back to the list">&#9662;</button></span>`;
  return `<select ${attrs}><option value="">—</option>${
    known.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")
  }<option value="${NEW}">${esc(addLabel)}</option></select>`;
}
/* `set` takes the value as it changes; `done` runs when you leave the field.
   Three ways back to the list: the chevron, Escape, or emptying the box. */
function wirePicker(el, key, set, done){
  if(!el) return;
  if(el.tagName === "SELECT"){
    el.onchange = () => {
      if(el.value === NEW){ newEntry[key] = "focus"; render(); return; }
      set(el.value); if(done) done();
    };
    return;
  }
  const toList = () => { delete newEntry[key]; set(""); render(); };
  if(newEntry[key] === "focus"){ newEntry[key] = true; el.focus(); }
  el.oninput = () => set(el.value);
  el.onchange = () => {
    const v = el.value.trim();
    if(!v) return toList();
    set(v); if(done) done();
  };
  el.onkeydown = e => { if(e.key === "Escape"){ e.stopPropagation(); toList(); } };
  const back = el.parentElement && el.parentElement.querySelector(`[data-pick]`);
  /* mousedown, not click: a click would blur the box first, commit the half-typed
     name, and re-render the button out from under the pointer. */
  if(back) back.onmousedown = e => { e.preventDefault(); toList(); };
}
/* Who you have dealt with before, on this side of the ledger. */
const PARTIES = dir => [...new Set(DB.transactions
  .filter(t => t.direction === dir && t.counterparty)
  .map(t => t.counterparty.trim()))].filter(Boolean).sort((a,b) => a.localeCompare(b));

/* Panels are read-only until you say otherwise. `editing` holds the key of the one
   panel that is open; Save closes it and writes the file. */
let editing = null;
const isEditing = key => editing === key;
function beginEdit(key){ editing = key; clearNew(); render(); }
function commitEdit(){ editing = null; clearNew(); render(); saveNow(); }
const ro = v => `<div class="ro${(v === null || v === undefined || v === "") ? " muted" : ""}">${esc(v ?? "") || "—"}</div>`;
/* One field, editable or not depending on the panel it sits in. */
const rw = (on, label, control, value, cls) => field(label, on ? control : ro(value), cls);
const editBar = (on, name) => on
  ? `<button class="btn primary" id="save_${name}">Save</button>`
  : `<button class="btn" id="edit_${name}">Edit</button>`;

/* Colors are free text, so filtering matches families: picking Pink finds Blushy Pink,
   Pinky White and Pink/White too. Modifiers like deep and creamy are ignored so they
   never become families of their own. */
const COLOR_FAMILY = {
  white:"White", cream:"Cream", creamy:"Cream", ivory:"Cream",
  blush:"Blush", blushy:"Blush", pale:"Blush",
  pink:"Pink", pinky:"Pink", rose:"Pink",
  coral:"Coral", salmon:"Coral", peach:"Coral", apricot:"Coral",
  red:"Red", crimson:"Red", scarlet:"Red",
  magenta:"Magenta", fuchsia:"Magenta",
  purple:"Purple", lavender:"Lavender", yellow:"Yellow", lemon:"Yellow",
};
const FAMILY_ORDER = ["White","Cream","Blush","Pink","Magenta","Coral","Red","Purple","Lavender","Yellow"];
const families = c => [...new Set(String(c || "").toLowerCase().split(/[^a-z]+/).filter(Boolean)
  .map(w => COLOR_FAMILY[w]).filter(Boolean))];
const familiesInUse = () => FAMILY_ORDER.filter(f => DB.cultivars.some(v => families(v.color).includes(f)));

/* ---------- the face of a cultivar ---------- */
/* Until there is a photograph of your own bloom, the circle draws one from what you have
   already recorded: the color family and the form. It is plainly a drawing, not a
   photograph, and it is replaced the moment you put a real one in its place. */
const PETAL = {
  White:   ["#FCF9F5","#C9BBB0","#FFFFFF"],
  Cream:   ["#F6EBD2","#CDB489","#FDF7E8"],
  Blush:   ["#F6D8DE","#D79FAC","#FCEDF0"],
  Pink:    ["#E79CB1","#BE6B84","#F3C6D2"],
  Magenta: ["#C4548A","#8E3A64","#DB8CB2"],
  Coral:   ["#F08E74","#C2634C","#F8BAA7"],
  Red:     ["#B93A45","#82232C","#D46E78"],
  Purple:  ["#9273B0","#664E80","#B9A2CE"],
  Lavender:["#C3B0D6","#9280AC","#DCD1E8"],
  Yellow:  ["#EBD581","#BCA652","#F5E8BB"],
};
const UNSET_PETAL = ["#E8E3DF","#BCB4AC","#F2EEEB"];      // color not recorded: it says so by being drab
const GOLD = "#E8C55B", GOLD_DEEP = "#B8912C";
/* A number off the name, so a cultivar always draws the same flower and two pink
   doubles are still told apart at a glance. */
const bloomSeed = v => Math.abs([...String(v.id || v.name || "?")].reduce((h,c) => (h*31+c.charCodeAt(0))|0, 7));
/* Petal count and how far the rings reach in. A bomb is a ring of guards under a
   pompom; a double is rings all the way in; a single shows its stamens. */
const FORMS = {
  "Single":      { rings:[[5,16,26,31]], heart:"stamens" },
  "Semi-Double": { rings:[[7,15,26,31],[6,10,17,37]], heart:"stamens" },
  "Double":      { rings:[[8,15,26,31],[7,11,19,36],[6,8,13,41]], heart:"packed" },
  "Bomb":        { rings:[[7,17,29,28]], heart:"pompom" },
  "Japanese":    { rings:[[7,16,26,31]], heart:"straps" },
  "Anemone":     { rings:[[7,16,26,31]], heart:"petaloids" },
};

function bloomSvg(v){
  const fam = families(v.color);
  const [fill, deep, light] = PETAL[fam[0]] || UNSET_PETAL;
  const in2 = fam[1] && PETAL[fam[1]] ? PETAL[fam[1]] : null;   // "Pink/White": pink guards, white heart
  const [, iDeep, iLight] = in2 || [fill, deep, light];
  const form = FORMS[v.bloomType] || FORMS["Double"];
  const seed = bloomSeed(v), spin = seed % 24, wobble = (seed % 5) - 2;
  const id = "b" + seed.toString(36), id2 = id + "i";
  const g1 = in2 ? id2 : id, e1 = in2 ? iDeep : deep;

  const petal = (cy, rx, ry, a, grad, edge) =>
    `<ellipse cx="50" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${grad})" stroke="${edge}"
      stroke-opacity=".42" stroke-width="1" transform="rotate(${a} 50 50)"/>`;
  const ring = ([n, rx, ry, cy], k) => {
    const count = k === 0 ? Math.max(5, n + (seed % 3) - 1) : n;
    const inner = k > 0 && !!in2;
    return Array.from({length:count}, (_,i) =>
      petal(cy + (k === 0 ? wobble * 0.4 : 0), rx, ry, spin + k * (180/count) + i * (360/count),
            inner ? id2 : id, inner ? iDeep : deep)).join("");
  };
  const spokes = (n, r1, r2, color, w) => Array.from({length:n}, (_,i) => {
    const a = (spin + i * (360/n)) * Math.PI/180;
    return `<line x1="${50+Math.cos(a)*r1}" y1="${50+Math.sin(a)*r1}" x2="${50+Math.cos(a)*r2}"
      y2="${50+Math.sin(a)*r2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join("");

  const hearts = {
    packed: Array.from({length:5}, (_,i) => petal(45, 4.5, 8, spin + 40 + i * 72, g1, e1)).join("") +
      `<circle cx="50" cy="50" r="2.4" fill="${e1}" opacity=".35"/>`,
    stamens: `<circle cx="50" cy="50" r="8" fill="${GOLD}" opacity=".92"/>` +
      spokes(13, 6.5, 12, GOLD_DEEP, 1.7) +
      `<circle cx="50" cy="50" r="3.4" fill="${GOLD_DEEP}" opacity=".6"/>`,
    pompom: `<circle cx="50" cy="50" r="18" fill="${iLight}" stroke="${iDeep}" stroke-opacity=".45"/>` +
      Array.from({length:9}, (_,i) => petal(41, 5, 10, spin + 20 + i * 40, g1, e1)).join("") +
      Array.from({length:5}, (_,i) => petal(45, 3.4, 6, spin + i * 72, g1, e1)).join("") +
      `<circle cx="50" cy="50" r="2.6" fill="${e1}" opacity=".4"/>`,
    straps: `<circle cx="50" cy="50" r="15" fill="${light}" fill-opacity=".6"/>` +
      Array.from({length:14}, (_,i) => `<ellipse cx="50" cy="41" rx="2.1" ry="10" fill="${GOLD}"
        stroke="${GOLD_DEEP}" stroke-opacity=".55" stroke-width=".6"
        transform="rotate(${spin + i*(360/14)} 50 50)"/>`).join("") +
      `<circle cx="50" cy="50" r="4" fill="${GOLD_DEEP}" opacity=".5"/>`,
    petaloids: Array.from({length:13}, (_,i) => `<ellipse cx="50" cy="40" rx="3" ry="11"
        fill="${iLight}" stroke="${iDeep}" stroke-opacity=".4" stroke-width=".7"
        transform="rotate(${spin + i*(360/13)} 50 50)"/>`).join("") +
      `<circle cx="50" cy="50" r="4.5" fill="${GOLD}" opacity=".8"/>`,
  };
  const grad = (gid, [f,, l]) => `<radialGradient id="${gid}" cx="50%" cy="80%" r="72%">
      <stop offset="0%" stop-color="${l}"/><stop offset="100%" stop-color="${f}"/></radialGradient>`;

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>${grad(id, [fill, deep, light])}${in2 ? grad(id2, in2) : ""}</defs>
    <circle cx="50" cy="50" r="50" fill="${deep}" fill-opacity=".13"/>
    ${form.rings.map(ring).join("")}
    ${hearts[form.heart]}
  </svg>`;
}

/* The circle itself: a photograph once there is one, a drawing until then, and either
   way the place you drop a new one. */
function bloomAvatar(v){
  const src = Photos.url(v);
  return `<div class="avatarwrap">
    <div class="avatar" id="cvPhoto" role="button" tabindex="0"
      title="${src ? "Click to frame this photo, or drop a new one in"
                   : "Click or drop an image to add a photo"}">${
      src ? `<img src="${esc(src)}" alt="${esc(v.name || "")}" style="${photoStyle(cropOf(v), 72)}">`
          : bloomSvg(v)}</div>
    <input type="file" accept="image/*" id="cvPhotoFile" hidden>
  </div>`;
}

/* The whole frame is kept, only made small enough to keep — so the crop can be changed
   later without going back to the camera roll. A long edge of 800 is sharp at any zoom
   the circle can reach. The picture can be picked from anywhere on the machine; what
   lands in the farm folder is this copy, never the original. */
const PHOTO_PX = 800;
function takePhoto(v, file, thenAdjust){
  if(!file || !/^image\//.test(file.type)) return toast("That is not an image");
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = async () => {
    const k = Math.min(1, PHOTO_PX / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    /* Written as a file in photos/ — the picture never enters farm-data.json. */
    const blob = await new Promise(res => c.toBlob(res, PHOTO_MIME, 0.72));
    if(!blob) return toast("Could not read that image");
    try{ await Photos.write(v, blob); }
    catch(e){ return toast("Could not save the photo: " + e.message); }
    v.photoCrop = { ar: c.width / c.height, zoom: 1, x: 0, y: 0 };
    markDirty();
    /* Straight into framing it, which is what you wanted to do next anyway. */
    if(thenAdjust !== false){ photoFor = v.id; draftCrop = { ...v.photoCrop }; }
    render();
    toast(`Photo set for ${v.name || "this cultivar"}`);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Could not read that image"); };
  img.src = url;
}

/* ---------- framing the photo ---------- */
/* The crop is three numbers rather than a second image: how far in, and how far off
   center either way, as fractions of the picture. So it can be changed as often as you
   like and never costs anything, and one photo serves the circle at any size. */
let photoFor = null, draftCrop = null;
const DEFAULT_CROP = { ar: 1, zoom: 1, x: 0, y: 0 };
const cropOf = v => ({ ...DEFAULT_CROP, ...(v.photoCrop || {}) });
const MAX_ZOOM = 4;

/* The picture is laid over the circle so its shorter side just covers, then scaled.
   Offsets are fractions of the drawn size, so they hold at 72px and at 260. */
function photoBox(crop, C){
  const ar = crop.ar || 1, zoom = crop.zoom || 1;
  const W = (ar >= 1 ? C * ar : C) * zoom;
  const H = (ar >= 1 ? C : C / ar) * zoom;
  return { W, H, maxX: (W - C) / (2 * W), maxY: (H - C) / (2 * H) };
}
function clampCrop(crop){
  crop.zoom = Math.max(1, Math.min(MAX_ZOOM, crop.zoom || 1));
  const b = photoBox(crop, 100);
  crop.x = Math.max(-b.maxX, Math.min(b.maxX, crop.x || 0));
  crop.y = Math.max(-b.maxY, Math.min(b.maxY, crop.y || 0));
  return crop;
}
function photoStyle(crop, C){
  const b = photoBox(crop, C);
  return `position:absolute;left:50%;top:50%;width:${b.W}px;height:${b.H}px;max-width:none;` +
    `transform:translate(-50%,-50%) translate(${(crop.x || 0) * b.W}px,${(crop.y || 0) * b.H}px)`;
}

const CROP_PX = 260;
function photoPanel(v){
  const c = draftCrop || cropOf(v);      // opened without a draft: frame what is already set
  return `<div class="psback" id="cpBack"><div class="pspanel" style="width:min(420px,100%)">
    <div class="pshead">
      <div class="grow"><h2>Frame the bloom</h2>
        <div class="subline">${esc(v.name || "Untitled cultivar")}</div></div>
      <button class="psx" id="cpClose" title="Close">×</button>
    </div>
    <div class="psbody" style="display:flex;flex-direction:column;align-items:center">
      <div class="cropview" id="cpView" style="width:${CROP_PX}px;height:${CROP_PX}px">
        <img id="cpImg" src="${esc(Photos.url(v) || "")}" alt="" draggable="false" style="${photoStyle(c, CROP_PX)}">
      </div>
      <div class="row" style="width:100%;max-width:${CROP_PX}px;margin-top:14px;gap:10px">
        <span class="small muted">Out</span>
        <input type="range" id="cpZoom" min="1" max="${MAX_ZOOM}" step="0.02" value="${c.zoom}" style="flex:1">
        <span class="small muted">In</span>
      </div>
      <p class="small muted" style="margin:10px 0 0;text-align:center">Drag the picture to move it,
        the slider or the scroll wheel to zoom. This is exactly what the circle will show.</p>
    </div>
    <div class="psfoot">
      <button class="btn" id="cpReplace">Replace</button>
      <div class="acts">
        <button class="btn danger" id="cpRemove">Remove</button>
        <button class="btn primary" id="cpDone">Done</button>
      </div>
    </div>
  </div></div>`;
}

function wirePhotoPanel(v){
  const view = $("#cpView"), img = $("#cpImg"), zoom = $("#cpZoom"), pick = $("#cvPhotoFile");
  if(!view || !img) return;
  if(!draftCrop) draftCrop = cropOf(v);
  /* Painted straight onto the element while dragging: a re-render mid-drag would
     replace the picture under the pointer. */
  const paint = () => { img.setAttribute("style", photoStyle(draftCrop, CROP_PX)); };
  const shut = () => { photoFor = null; draftCrop = null; render(); };

  view.addEventListener("pointerdown", e => {
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    view.classList.add("grabbing");
    const b = photoBox(draftCrop, CROP_PX), x0 = draftCrop.x, y0 = draftCrop.y;
    const move = ev => {
      draftCrop.x = x0 + (ev.clientX - e.clientX) / b.W;
      draftCrop.y = y0 + (ev.clientY - e.clientY) / b.H;
      clampCrop(draftCrop); paint();
    };
    const up = () => {
      view.removeEventListener("pointermove", move);
      view.classList.remove("grabbing");
    };
    view.addEventListener("pointermove", move);
    view.addEventListener("pointerup", up, {once:true});
    view.addEventListener("pointercancel", up, {once:true});
  });
  view.addEventListener("wheel", e => {
    e.preventDefault();
    draftCrop.zoom = (draftCrop.zoom || 1) * (e.deltaY < 0 ? 1.09 : 1/1.09);
    clampCrop(draftCrop); paint();
    if(zoom) zoom.value = draftCrop.zoom;
  }, {passive:false});
  if(zoom) zoom.oninput = e => { draftCrop.zoom = Number(e.target.value); clampCrop(draftCrop); paint(); };

  $("#cpClose").onclick = shut;
  $("#cpBack").onclick = e => { if(e.target.id === "cpBack") shut(); };
  /* The crop is the cheap part, so it is written as you go and Done just closes. */
  $("#cpDone").onclick = () => { v.photoCrop = { ...draftCrop }; markDirty(); shut(); };
  $("#cpReplace").onclick = () => pick && pick.click();
  $("#cpRemove").onclick = async () => {
    await Photos.remove(v);          /* takes the file with it, not just the reference */
    photoFor = null; draftCrop = null;
    markDirty(); render(); toast("Photo removed");
  };
}

/* Click it or drop on it — the same thing either way. A circle already carrying a
   photograph opens the framing instead of the file picker. */
function wireAvatar(v){
  const av = $("#cvPhoto"), pick = $("#cvPhotoFile");
  if(!av || !pick) return;
  const open = () => {
    if(!Photos.url(v)) return pick.click();
    photoFor = v.id; draftCrop = cropOf(v); render();
  };
  av.onclick = open;
  av.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } };
  pick.onchange = e => { const f = e.target.files && e.target.files[0]; if(f) takePhoto(v, f); };
  pick.onclick = e => e.stopPropagation();
  av.ondragover = e => { e.preventDefault(); av.classList.add("over"); };
  av.ondragleave = () => av.classList.remove("over");
  av.ondrop = e => {
    e.preventDefault(); av.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) takePhoto(v, f); else toast("Drop an image file");
  };
}

/* Where in the season it opens, at a glance — scannable down a column. */
function seasonStrip(s){
  const i = SEASONS.indexOf(s);
  return `<span class="strip" title="${esc(s || "season unrecorded")}">${
    SEASONS.map((_,k) => `<i class="${k === i ? "on" : (i >= 0 && Math.abs(k-i) === 1 ? "near" : "")}"></i>`).join("")}</span>`;
}

/* ---------- creating and removing ---------- */
function uniqueCultivarId(name){
  let base = slug(name) || "cultivar", id = base, n = 1;
  while(DB.cultivars.some(v => v.id === id)) id = base + "-" + (++n);
  return id;
}
function newCultivar(name){
  const v = { id: uniqueCultivarId(name), name, color: null, bloomSeason: null, bloomType: null,
    plantType: "Herbaceous", fragrance: null, stemStrength: null, photo: null, notes: null };
  DB.cultivars.push(v);
  markDirty();
  return v;
}
function blankPlant(cultivarId, extra = {}){
  return { id: nextPlantId(), cultivarId, status: "Ordered", source: null,
    acquiredDate: null, plantedDate: null, eyeCount: null,
    x: null, y: null, parentPlantId: null, notes: null, ...extra };
}
function newPlant(cultivarId, extra = {}){
  const p = blankPlant(cultivarId, extra);
  DB.plants.push(p);
  markDirty();
  return p;
}
/* A plant carries ledger allocations, so removing it would leave the books short.
   Those allocations become overhead rather than vanishing. */
function deletePlant(id){
  if(!DB.plants.some(p => p.id === id)) return 0;      // nothing removed, nothing to save
  let freed = 0;
  for(const t of DB.transactions){
    const keep = (t.allocations || []).filter(a => !(a.target === "plant" && a.targetId === id));
    freed += (t.allocations || []).length - keep.length;
    t.allocations = keep;
  }
  DB.plants = DB.plants.filter(p => p.id !== id);
  for(const p of DB.plants) if(p.parentPlantId === id) p.parentPlantId = null;
  markDirty();
  return freed;
}
function deleteCultivar(id){
  if(DB.plants.some(p => p.cultivarId === id)) return false;   // still has plants
  if(!DB.cultivars.some(v => v.id === id)) return false;      // nothing there to remove
  DB.cultivars = DB.cultivars.filter(v => v.id !== id);
  markDirty();
  return true;
}

/* ---------- collection: cultivars -> plants -> one plant ---------- */
let colSort = {key:"name", dir:1}, colFilter = {q:"", color:"", season:""};

/* `byCv` is plants already grouped by cultivar, for a caller building many rows at
   once — one sweep of the plant list instead of one per cultivar. Left out, the row
   finds its own plants exactly as before, so a single row costs a caller nothing. */
function cultivarRow(v, byCv){
  /* `list` is every plant ever recorded for this cultivar, so a lost or sold one is
     still reachable. `plants` counts only the living, which is what "owned" means. */
  /* Checked rather than trusted: `DB.cultivars.map(cultivarRow)` hands a callback its
     index as a second argument, and a row asked for that way must still be right. */
  const all = byCv instanceof Map ? (byCv.get(v.id) || [])
                                  : DB.plants.filter(p => p.cultivarId === v.id);
  const alive = all.filter(live);
  const statuses = {};
  for(const p of alive) statuses[p.status] = (statuses[p.status] || 0) + 1;
  return { v, id:v.id, name:v.name || "—", color:v.color || "", season:v.bloomSeason || "",
    type:v.bloomType || "", plants:alive.length, gone:all.length - alive.length, statuses,
    placed:alive.filter(p => p.x !== null).length,
    /* Only the cultivar page shows a cost; the collection asks for a row and never
       reads this, so it is worked out on the way out rather than on the way in. */
    get cost(){ return all.reduce((s,p) => s + plantCost(p.id), 0); },
    list:all };
}
const effKey = cols => cols.some(c => c[0] === colSort.key) ? colSort.key : cols[0][0];
function sortRows(rows, cols){
  const k = effKey(cols);
  return rows.sort((a,b) => {
    let x = a[k], y = b[k];
    if(k === "season"){ x = SEASONS.indexOf(x); y = SEASONS.indexOf(y); }
    if(typeof x === "string") return x.localeCompare(y) * colSort.dir;
    return ((x ?? 0) - (y ?? 0)) * colSort.dir;
  });
}
function headerCells(cols){
  const active = effKey(cols);
  return cols.map(([k,l,cls]) =>
    `<th data-k="${k}" class="${cls || ""}">${l}${active === k ? (colSort.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("");
}
function wireTable(app, hrefFor){
  app.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if(colSort.key === k) colSort.dir *= -1; else { colSort.key = k; colSort.dir = 1; }
    render();
  });
  app.querySelectorAll("a.loclink").forEach(a => a.onclick = e => e.stopPropagation());
  app.querySelectorAll("tbody tr[data-go]").forEach(tr => tr.onclick = e => {
    if(e.target.closest("a")) return;
    location.hash = hrefFor(tr.dataset.go);
  });
}
const SOURCE_LIST = () => [...new Set(DB.plants.map(p => p.source).filter(Boolean))].sort();

/* ---------- level 1: the cultivars ---------- */
function renderCollection(app){
  const cols = [["name","Cultivar"],["color","Color"],["season","Season"],["type","Form"],["plants","Plants","r"]];
  const byCv = new Map();
  for(const p of DB.plants){ let a = byCv.get(p.cultivarId); if(!a) byCv.set(p.cultivarId, a = []); a.push(p); }
  const all = DB.cultivars.map(v => cultivarRow(v, byCv));
  const rows = sortRows(all.filter(r =>
    (!colFilter.q || (r.name + " " + r.color + " " + r.season + " " + r.type).toLowerCase().includes(colFilter.q.toLowerCase())) &&
    (!colFilter.season || r.season === colFilter.season) &&
    (!colFilter.color || families(r.color).includes(colFilter.color))
  ), cols);
  const owned = all.filter(r => r.plants > 0).length;
  const plants = all.reduce((s,r) => s + r.plants, 0);

  app.innerHTML = `
  <div class="pagehead">
    <div class="grow">
      <h2>Collection</h2>
      <div class="subline"><span class="num">${owned}</span> cultivar${owned === 1 ? "" : "s"} ·
        <span class="num">${plants}</span> plants${all.length > owned ? ` · <span class="num">${all.length-owned}</span> not owned yet` : ""}</div>
    </div>
    <div class="acts"><button class="btn primary" id="addCultivar">Add Cultivar</button></div>
  </div>

  <div class="row section">
    <input id="q" placeholder="Search name, color, season or form" style="flex:2;min-width:230px" value="${esc(colFilter.q)}">
    <select id="fc" style="flex:1;min-width:140px"><option value="">Any color</option>
      ${familiesInUse().map(f => `<option ${colFilter.color === f ? "selected" : ""}>${f}</option>`).join("")}</select>
    <select id="fb" style="flex:1;min-width:140px"><option value="">Any season</option>
      ${SEASONS.filter(s => DB.cultivars.some(v => v.bloomSeason === s))
        .map(s => `<option ${colFilter.season === s ? "selected" : ""}>${s}</option>`).join("")}</select>

  </div>

  <div class="card section" style="padding:6px 8px">
    <table><thead><tr>${headerCells(cols)}</tr></thead><tbody>
      ${rows.length ? rows.map(r => `<tr data-go="${r.id}">
        <td><div class="cell"><span>${esc(r.name)}</span></div></td>
        <td class="muted">${esc(r.color) || "—"}</td>
        <td><div class="cell">${seasonStrip(r.season)}<span class="muted">${esc(r.season) || "—"}</span></div></td>
        <td>${esc(r.type) || "—"}</td>
        <td class="r"><span class="countpill ${r.plants ? "" : "zero"}"${
          r.gone ? ` title="${r.gone} no longer growing"` : ""}>${
          r.plants || (r.gone ? "none left" : "none")}</span></td>
      </tr>`).join("") : `<tr class="emptyrow"><td colspan="5">Nothing matches those filters.</td></tr>`}
    </tbody></table>
  </div>
  <p class="small muted">Open a cultivar to edit its cultivar details and see its individual plants.</p>`;

  /* Typing outruns the table once the collection is large, so the list catches up a
     beat after the last keystroke rather than being rebuilt under each one. */
  let qT = null;
  $("#q").oninput = e => {
    colFilter.q = e.target.value;
    const pos = e.target.selectionStart;
    clearTimeout(qT);
    qT = setTimeout(() => {
      render();
      const q = $("#q"); if(q){ q.focus(); q.setSelectionRange(pos, pos); }
    }, 120);
  };
  $("#fc").onchange = e => { colFilter.color = e.target.value; render(); };
  $("#fb").onchange = e => { colFilter.season = e.target.value; render(); };
  $("#addCultivar").onclick = () => {
    draftCultivar = blankCultivar();
    editing = "c:" + DRAFT_ID;
    render();
  };
  wireTable(app, id => "#/collection/" + id);

  if(draftCultivar){
    app.insertAdjacentHTML("beforeend", cultivarSheet(draftCultivar));
    bindEdits(app);
    const shut = () => { discardCultivarDraft(); render(); };
    $("#csClose").onclick = shut;
    $("#csDiscard").onclick = shut;
    $("#csBack").onclick = e => { if(e.target.id === "csBack") shut(); };
    $("#csSave").onclick = () => {
      const v = draftCultivar;
      if(!(v.name || "").trim()) return toast("Give it a name first");
      v.id = uniqueCultivarId(v.name);          // the slug comes from the name you chose
      DB.cultivars.push(v);
      draftCultivar = null; editing = null;
      markDirty(); saveNow();
      location.hash = "#/collection/" + v.id;
    };
  }
}

/* The same fields serve the panel on the cultivar page and the new-cultivar sheet,
   so the two can never drift apart. */

      ${rw(on, "Fragrance", F.sel("c", v.id, "fragrance", v.fragrance, FRAGRANCE), v.fragrance)}

/* A new cultivar is a draft too: it exists only in this variable until Save. */
let draftCultivar = null;
const DRAFT_ID = "__draft";
const findCultivar = id => (draftCultivar && draftCultivar.id === id) ? draftCultivar : DB.cultivars.find(x => x.id === id);
function blankCultivar(){
  return { id: DRAFT_ID, name: "", color: null, bloomSeason: null, bloomType: null,
           plantType: "Herbaceous", fragrance: null, stemStrength: null, photo: null, notes: null };
}
function discardCultivarDraft(){ draftCultivar = null; editing = null; }

function cultivarSheet(v){
  return `<div class="psback" id="csBack"><div class="pspanel">
    <div class="pshead">

/* ---------- level 2: one cultivar, and every plant of it ---------- */
/* Season by season, what this cultivar actually did. Cost per stem is cumulative:
   a root is bought once and cuts for decades, so dividing one season's stems into
   the whole purchase price would say something untrue in the early years. */
function seasonCard(v, cost){
  const years = bloomYears().filter(y => cultivarSeason(v.id, y));
  if(!years.length) return `
    <div class="card section"><h3>Season</h3>
      <p class="small muted" style="margin:8px 0 0">Nothing recorded yet. Once you log a day on the
        <a href="#/bloom">Bloom</a> tab, first bloom, the length of the season and cost per stem appear here.</p></div>`;

  let running = 0;
  const rows = years.slice().sort().map(y => {                 // oldest first, so the running total means something
    const s = cultivarSeason(v.id, y);
    running += s.stems;
    return `<tr style="cursor:default">
      <td class="num">${y}</td>
      <td class="small">${fmtDate(s.first)}</td>
      <td class="small">${s.last === s.first ? "—" : fmtDate(s.last)}</td>
      <td class="r num">${s.days}</td>
      <td class="r num">${s.stems || "—"}</td>
      <td class="r num">${cost && running ? fmt(cost / running) : "—"}</td>
    </tr>`;
  }).reverse();

  return `
  <div class="card section" style="padding:6px 8px">
    <table><thead><tr><th>Season</th><th>First bloom</th><th>Last bloom</th>
      <th class="r">Days</th><th class="r">Stems</th><th class="r">Cost per stem</th></tr></thead>
    <tbody>${rows.join("")}</tbody></table>
  </div>
  <p class="small muted">Cost per stem is what you paid for this cultivar against every stem it has cut so far,
    so it falls each season.</p>`;
}
