/* ---------- the plant sheet ---------- */
/* A plant answers a narrow set of questions: which root is this, where did it come
   from, when did it go in, where is it now, what did it cost. Everything about the
   flower itself — and, when it comes, what was cut from it — belongs to the cultivar. */
let openPlant = null;
/* Add plant opens a draft. It is a plain object held here, not in DB.plants, so
   closing the sheet without saving leaves the data exactly as it was. */
let draftPlant = null;
const findPlant = id => (draftPlant && draftPlant.id === id) ? draftPlant : DB.plants.find(x => x.id === id);
const isDraft = p => !!draftPlant && draftPlant.id === p.id;
function discardDraft(){ draftPlant = null; openPlant = null; editing = null;
  draftDivide = null; armDividePlant = false; }

function plantSheet(p){
  if(dividing(p)) return dividePanel(p);       // the same panel, asking a different question
  const v = cultivar(p.cultivarId);
  const on = isEditing("p:" + p.id);
  const others = DB.plants.filter(x => x.id !== p.id && live(x));
  const allocs = [];
  for(const t of DB.transactions)
    for(const a of (t.allocations || []))
      if(a.target === "plant" && a.targetId === p.id) allocs.push({t,a});
  const cost = allocs.reduce((s,x) => s + x.a.amount, 0);
  const parent = DB.plants.find(o => o.id === p.parentPlantId);

  /* The same two moments an order gets: they were cut together, and one weekend they
     all go in. Divisions already planted are left out of the count. */
  const kids = divisionsOf(p.id), ready = kids.filter(k => k.status === READY).length;
  const kidActs = !ready ? ""
    : armDividePlant
      ? `<div class="row" style="margin:14px 0 2px;align-items:flex-end">
           <div style="max-width:190px">${field("Planted on",
             `<input type="date" required id="dvPlantDate" value="${today()}">`)}</div>
           <button class="btn" id="dvPlantCancel" style="margin-bottom:1px">Cancel</button>
           <button class="btn primary" id="dvPlantGo" style="margin-bottom:1px">Mark ${ready} Planted</button>
         </div>`
      : `<div class="row" style="margin:14px 0 2px">
           <button class="btn" id="dvPlant">Mark ${ready} Planted</button>
         </div>`;

  return `<div class="psback" id="psBack"><div class="pspanel" id="pspanel">
    <div class="pshead">
      <div class="grow"><h2>${isDraft(p) ? "New plant" : `Plant <span class="num">${p.id}</span>`}</h2>${
        isDraft(p) ? `<div class="subline">Nothing is added until you save</div>` : ""}</div>
      <span class="pill ${pillClass(p.status)}">${p.status}</span>
      <button class="psx" id="psClose" title="Close">×</button>
    </div>

    <div class="psbody">
      <div class="fieldrow">
        ${rw(on, "Cultivar", `<select data-edit="p:${p.id}:cultivarId">${
          DB.cultivars.slice().sort((a,b) => (a.name||"").localeCompare(b.name||""))
            .map(c => `<option value="${esc(c.id)}" ${p.cultivarId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")
          }</select>`, v.name)}
        ${rw(on, "Status", F.sel("p", p.id, "status", p.status, STATUSES, "—"), p.status)}
        ${rw(on, "Source", picker("psource", `id="p_source"`, p.source, SOURCE_LIST(), "+ New source…"), p.source)}
        ${rw(on, "Acquired", F.date("p", p.id, "acquiredDate", p.acquiredDate), fmtDate(p.acquiredDate))}
      </div>
      <div class="fieldrow">
        ${rw(on, "Planted", F.date("p", p.id, "plantedDate", p.plantedDate), fmtDate(p.plantedDate))}
        ${rw(on, "Eyes", F.num("p", p.id, "eyeCount", p.eyeCount), p.eyeCount)}
        ${on
          ? field("Divided from", `<select data-t="num" data-edit="p:${p.id}:parentPlantId"><option value="">—</option>${
              others.map(o => `<option value="${o.id}" ${p.parentPlantId === o.id ? "selected" : ""}>#${o.id} ${
                esc(cultivar(o.cultivarId).name)}</option>`).join("")}</select>`)
          /* The crown it came off is where the rest of the batch lives, so it is a way there. */
          : field("Divided from", parent
              ? `<div class="ro"><a class="locink" href="#/plant/${parent.id}">#${parent.id} ${
                  esc(cultivar(parent.cultivarId).name || "Unnamed cultivar")}</a></div>`
              : `<div class="ro muted">—</div>`)}
        ${field("Position", p.x === null
          ? `<div class="ro muted"><a href="#/map">not placed</a></div>`
          /* A crown that has been divided away is not on the map any more, so where it
             stood is a fact about the past rather than somewhere to go. */
          : !live(p) ? `<div class="ro muted">was at ${p.x}, ${p.y} ft</div>`
          : `<div class="ro"><a class="locink" href="#/map/${p.id}">${p.x}, ${p.y} ft</a></div>`)}
      </div>
      <div class="fieldrow">
        ${rw(on, "Notes", F.area("p", p.id, "notes", p.notes), p.notes, "span12")}
      </div>

      ${kids.length ? `<div class="between" style="margin-top:20px"><h3 style="margin:0">Its divisions</h3>
          <span class="small muted">${stageSummary(kids)}</span></div>
        ${kidActs}
        <table style="margin-top:10px"><tbody>${kids.map(k => `<tr data-goplant="${k.id}">
          <td>${esc(cultivar(k.cultivarId).name || "Unnamed cultivar")} <span class="small muted">plant ${k.id}</span></td>
          <td><span class="pill ${pillClass(k.status)}">${k.status}</span></td>
          <td class="r small muted">${k.x === null ? "no square" : `${k.x}, ${k.y} ft`}</td></tr>`).join("")}</tbody></table>
        <p class="small muted" style="margin:10px 0 0">${ready
          ? `Marking them planted dates all <span class="num">${ready}</span> the same day. One that went in on
             its own day, set on its own page.`
          : `Every division off this crown is in the ground.`}</p>` : ""}
    </div>

    <div class="psfoot">
      <span class="small muted">${isDraft(p) ? "" : (cost
        ? `Cost <span class="num">${fmt(cost)}</span> · ${allocs.map(x => esc(x.t.counterparty)).join(", ")}`
        : "Nothing allocated to this plant")}</span>
      <div class="acts">
        <button class="btn danger" id="delPlant">${isDraft(p) ? "Discard" : "Delete"}</button>
        ${canDivide(p) ? `<button class="btn" id="divide_plant">Divide</button>` : ""}
        ${on ? `<button class="btn primary" id="save_plant">Save</button>`
             : `<button class="btn" id="edit_plant">Edit</button>`}
      </div>
    </div>
  </div></div>`;
}

function wirePlantSheet(app, p){
  if(dividing(p)) return wireDivide(app, p);
  /* Opened from the map it closes back to the map; opened from a cultivar page it
     closes back to that. Where it came from is simply where the hash still points. */
  const close = () => {
    const onMap = location.hash.startsWith("#/map");
    const cid = p.cultivarId;
    clearNew(); armDividePlant = false;
    if(isDraft(p)) discardDraft(); else { editing = null; openPlant = null; }
    if(onMap) return render();
    location.hash = "#/collection/" + cid;
    render();                                  // the hash may already be that, so force it
  };
  $("#psClose").onclick = close;
  $("#psBack").onclick = e => { if(e.target.id === "psBack") close(); };
  bindEdits(app);
  wirePicker($("#p_source"), "psource",           // stands in for the generic binding
    v => { p.source = v.trim() || null; }, markDirty);   // no re-render: it would eat the click on Save
  if(isEditing("p:" + p.id)) $("#save_plant").onclick = () => {
    if(isDraft(p)){ DB.plants.push(p); draftPlant = null; markDirty(); }
    commitEdit();
  };
  else $("#edit_plant").onclick = () => beginEdit("p:" + p.id);
  const dv = $("#divide_plant");
  if(dv) dv.onclick = () => { editing = null; armDividePlant = false; draftDivide = blankDivide(p); render(); };

  /* One click to the division, and the "Divided from" link is the way back. */
  app.querySelectorAll("[data-goplant]").forEach(tr => tr.onclick = () => {
    editing = null; armDividePlant = false;
    location.hash = "#/plant/" + tr.dataset.goplant;
  });
  const mp = $("#dvPlant");
  if(mp) mp.onclick = () => { editing = null; armDividePlant = true; render(); };
  const mc = $("#dvPlantCancel");
  if(mc) mc.onclick = () => { armDividePlant = false; render(); };
  const mg = $("#dvPlantGo");
  if(mg) mg.onclick = () => markDivisionsPlanted(p.id, $("#dvPlantDate").value);
  $("#delPlant").onclick = () => {
    if(isDraft(p)) return close();            // never existed; nothing to confirm
    const n = DB.transactions.reduce((s,t) => s + (t.allocations||[]).filter(a =>
      a.target === "plant" && a.targetId === p.id).length, 0);
    if(!confirm(`Delete plant ${p.id}?` + (n ? `\n\n${n} ledger allocation${n===1?"":"s"} will be released back to overhead — the ledger total is unchanged.` : ""))) return;
    const onMap = location.hash.startsWith("#/map"), cid = p.cultivarId;
    deletePlant(p.id); editing = null; openPlant = null;
    if(onMap) return render();
    location.hash = "#/collection/" + cid;
  };
}

/* ---------- dividing ---------- */
/* Lifting a crown ends one plant and starts several. The parent is not deleted: it goes
   to Divided, keeps its cost and its place in the record, and each piece becomes a plant
   of its own pointing back at it. Nothing is written until the button at the foot, so
   opening the question and thinking better of it costs nothing. */
let draftDivide = null, armDividePlant = false;
const READY = "Ready to Plant";

/* A division stays attached to the crown it came off, so the parent's page is where the
   batch is handled: they were lifted together and they go back in together. */
const divisionsOf = id => DB.plants.filter(p => p.parentPlantId === id).sort((a,b) => a.id - b.id);

/* Only moves things forward, and only the ones still waiting: a division you already
   put in on its own day keeps the date you gave it. */
function markDivisionsPlanted(id, date){
  let n = 0;
  for(const k of divisionsOf(id)) if(k.status === READY){
    k.status = "Planted";
    k.plantedDate = date || null;
    n++;
  }
  armDividePlant = false;
  if(!n){ toast("Nothing left to mark planted"); return 0; }
  markDirty(); render();
  saveNow(`${n} division${n === 1 ? "" : "s"} marked planted`);
  return n;
}

/* Only something in the ground can be lifted — a root still on order or already gone
   has nothing to cut. */
const canDivide = p => !isDraft(p) && ["Planted","Established"].includes(p.status);
const dividing = p => !!draftDivide && draftDivide.from === p.id;
function blankDivide(p){
  return { from: p.id, date: today(), lines: [{eyes:""},{eyes:""},{eyes:""}] };
}
function discardDivide(){ draftDivide = null; }
/* Eyes left blank stay null: not counted is not the same as none. */
const divideEyes = l => l.eyes === "" ? null : Math.max(0, Math.round(Number(l.eyes) || 0));
/* Changing the count keeps the eyes already typed rather than starting the list again. */
function setDivideCount(n){
  const lines = draftDivide.lines;
  n = Math.max(1, Math.min(24, Math.round(Number(n) || 0) || lines.length));
  while(lines.length > n) lines.pop();
  while(lines.length < n) lines.push({eyes:""});
  return n;
}
function divideTotals(){
  const counted = draftDivide.lines.filter(l => divideEyes(l) !== null);
  return { n: draftDivide.lines.length, counted: counted.length,
           eyes: counted.reduce((s,l) => s + divideEyes(l), 0) };
}

function commitDivide(p){
  const d = draftDivide;
  if(!d.date) return toast("Needs a date");
  if(!DB.plants.some(x => x.id === p.id)) return toast("That plant is gone");
  /* A division is a root in a crate, not a plant in the ground: the day it was cut is
     the day it was acquired, and Planted stays empty until it really is. */
  const made = d.lines.map(l => newPlant(p.cultivarId, {
    status: "Ready to Plant", acquiredDate: d.date, plantedDate: null,
    eyeCount: divideEyes(l), parentPlantId: p.id }));
  /* Divided is not living, so the map stops drawing it and its square comes free for
     one of the pieces to go back into. */
  p.status = "Divided";
  markDirty();
  const onMap = location.hash.startsWith("#/map");
  discardDivide(); editing = null; openPlant = null;
  if(onMap) render();
  else { location.hash = "#/collection/" + p.cultivarId; render(); }
  saveNow(`Plant ${p.id} divided into ${made.length}`);
  return made;
}

function dividePanel(p){
  const d = draftDivide, v = cultivar(p.cultivarId), t = divideTotals();
  const name = esc(v.name || "Untitled cultivar");
  return `<div class="psback" id="psBack"><div class="pspanel" id="pspanel">
    <div class="pshead">
      <div class="grow"><h2>Divide plant <span class="num">${p.id}</span></h2>
        <div class="subline">${name}${p.x === null ? "" : ` · ${p.x}, ${p.y} ft`} · nothing is changed until you divide</div></div>
      <span class="pill ${pillClass(p.status)}">${p.status}</span>
      <button class="psx" id="dvClose" title="Close">×</button>
    </div>

    <div class="psbody">
      <div class="fieldrow">
        <div style="grid-column:span 4">${field("Divided", `<input type="date" required id="dv-date" value="${d.date}">`)}</div>
        <div style="grid-column:span 4">${field("Divisions", `<input type="number" min="1" max="24" step="1" id="dv-n" value="${t.n}">`)}</div>

      <table class="lines"><thead><tr>
        <th style="width:70%">Division</th><th style="width:30%">Eyes</th>

      <tbody>${d.lines.map((l,i) => `<tr style="cursor:default">
        <td class="muted small">${name} <span class="num">${i + 1}</span> of <span class="num">${t.n}</span></td>
        <td><input type="number" min="0" step="1" data-de="${i}" value="${esc(l.eyes)}" placeholder="not counted"></td>
      </tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin:8px 0 0">Three to five eyes is a division that will bloom again in a season or two.</p>
      <p class="small muted" style="margin:10px 0 0">Plant <span class="num">${p.id}</span> becomes Divided and keeps its
        cost and its history${p.x === null ? "" : `, and its square at ${p.x}, ${p.y} ft comes free`}. The
        <span class="num">${t.n}</span> new ${t.n === 1 ? "root is" : "roots are"} recorded as
        <strong>Ready to Plant</strong>, acquired on the date above and not planted until you say so — mark

    </div>

    <div class="psfoot">

        <button class="btn primary" id="dvGo">Divide into ${t.n}</button>
      </div>

}

function paintDivide(){
  if(!draftDivide) return;
  const t = divideTotals(), sum = $("#dvSum");
  if(sum) sum.innerHTML = t.counted
    ? `<span class="num">${t.eyes}</span> eye${t.eyes === 1 ? "" : "s"} across <span class="num">${
        t.counted}</span> of <span class="num">${t.n}</span>`
    : `<span class="num">${t.n}</span> division${t.n === 1 ? "" : "s"}, eyes not counted`;
}

function wireDivide(app, p){
  const d = draftDivide;
  /* Backing out returns to the plant, not out of it: you opened the question from here. */
  const back = () => { discardDivide(); render(); };
  $("#dvClose").onclick = back;
  $("#dvCancel").onclick = back;
  $("#psBack").onclick = e => { if(e.target.id === "psBack") back(); };
  $("#dv-date").onchange = e => { d.date = e.target.value; };
  $("#dv-n").onchange = e => { setDivideCount(e.target.value); render(); };
  app.querySelectorAll("[data-de]").forEach(el => {
    el.oninput = () => { d.lines[el.dataset.de].eyes = el.value; paintDivide(); };
  });
  $("#dvGo").onclick = () => commitDivide(p);
  paintDivide();
}

/* ---------- bloom ---------- */
/* Recording is a daily habit for six weeks a year, so the panel opens on today with
   the cursor already in the first line. Everything else on the screen is a read of
   what has been recorded, never a second place to type it. */
let bloomYear = null, draftBloom = null, armBloomDel = false;

/* What was in bloom yesterday is very nearly what is in bloom today, so a new day opens
   with the last one's cultivars and empty stem boxes: take off what has finished, add
   what has opened, type the numbers. A gap of more than a week is a different moment in
   the season — or a different season — so nothing is carried across it. */
const CARRY_DAYS = 10;
function blankBloom(date){
  const d = date || today();
  const last = bloomDays().find(x => x < d);
  const near = last && (Date.parse(d) - Date.parse(last)) / 86400000 <= CARRY_DAYS;
  const carried = near ? bloomsOn(last)
    .sort((a,b) => (cultivar(a.cultivarId).name || "").localeCompare(cultivar(b.cultivarId).name || ""))
    .map(r => ({ cultivarId: r.cultivarId, stems: "" })) : [];
  return { date: d, from: null, carriedFrom: carried.length ? last : null,
           lines: carried.concat([{ cultivarId:"", stems:"" }]) };
}
function loadBloom(date){
  return { date, from: date,
    lines: bloomsOn(date)
      .sort((a,b) => (cultivar(a.cultivarId).name || "").localeCompare(cultivar(b.cultivarId).name || ""))
      .map(r => ({ cultivarId:r.cultivarId, stems: r.stems === 0 ? "" : String(r.stems ?? "") }))
      .concat([{ cultivarId:"", stems:"" }]) };      // room to add one you missed
}
function discardBloomDraft(){ draftBloom = null; armBloomDel = false; }
/* A day was one visit with the bucket, so it comes out as one thing: every cultivar
   recorded against it goes together. First bloom, the day count and the length of the
   season all read off these rows, so they close over the gap on their own. */
function deleteBloomDay(date){
  const n = bloomsOn(date).length;
  if(!n) return 0;                                   // nothing there, nothing to save
  DB.blooms = DB.blooms.filter(b => b.date !== date);
  markDirty();
  return n;
}
/* Same rule as an order: one empty line at the end, never a stack of them. */
function trimBloomLines(){
  const before = draftBloom.lines.length;
  draftBloom.lines = draftBloom.lines.filter(l => l.cultivarId);
  draftBloom.lines.push({ cultivarId:"", stems:"" });
  return draftBloom.lines.length !== before;
}
const bloomStems = l => l.stems === "" ? 0 : Math.max(0, Math.round(Number(l.stems) || 0));
function bloomTotals(){
  const filled = draftBloom.lines.filter(l => l.cultivarId);
  return { filled, stems: filled.reduce((s,l) => s + bloomStems(l), 0) };
}

/* The day you opened is replaced by exactly what is on screen, so removing a line
   removes the record. A day you did not open is merged into, so catching up on
   yesterday cannot wipe what yesterday already said. */
function commitBloom(){
  const d = draftBloom, { filled } = bloomTotals();
  if(!filled.length && !d.from) return toast("Nothing to record");
  if(!d.date) return toast("Needs a date");
  if(d.from) DB.blooms = DB.blooms.filter(b => b.date !== d.from);
  for(const l of filled){
    const found = DB.blooms.find(b => b.date === d.date && b.cultivarId === l.cultivarId);
    /* An empty box means you did not count, so it never writes over a number the day
       already has — which is what makes a carried-forward line safe to leave alone. */
    if(found){ if(l.stems !== "") found.stems = bloomStems(l); }
    else DB.blooms.push({ id: nextBloomId(), date: d.date, cultivarId: l.cultivarId,
                          stems: bloomStems(l), notes: null });
  }
  /* Saving a day with every line taken off it is a delete by another route, so it
     says so rather than reporting that nothing was recorded. */
  const emptied = !filled.length, day = emptied ? d.from : d.date;
  discardBloomDraft(); markDirty(); render();
  saveNow(`${fmtDate(day)} ${emptied ? "deleted" : "recorded"}`);
}

function renderBloom(app){
  const years = bloomYears();
  /* Default to the season you are actually in; fall back to the last one recorded
     so an out-of-season visit still shows something. */
  const now = String(new Date().getFullYear());
  const year = bloomYear && years.includes(bloomYear) ? bloomYear
             : years.includes(now) ? now : (years[0] || now);
  const t = seasonTotals(year);
  const days = bloomDays().filter(d => d.startsWith(year));

  app.innerHTML = `
  <div class="between">
    <div class="row" style="gap:14px">
      <h2 style="margin:0">Bloom</h2>
      ${years.length > 1
        ? `<select id="by" style="max-width:110px">${
            years.map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>`
        : `<span class="seasontag num">${year}</span>`}
    </div>
    <button class="btn primary" id="addBloom">Record Blooms</button>
  </div>

  <div class="grid metrics section">
    ${metric("Stems", t.stems, t.stems ? `cut in ${year}` : "none cut yet")}
    ${metric("Cultivars", t.cultivars, "bloomed this season")}
    ${metric("First bloom", t.first ? fmtDate(t.first) : "—", t.first ? `of ${year}` : "not yet recorded")}
    ${metric("Days", t.days, "logged")}
  </div>

  ${days.length ? `<div class="card section" style="padding:6px 8px">
    <table><thead><tr><th>Date</th><th>In bloom</th><th class="r">Stems</th></tr></thead>
    <tbody>${days.map(d => {
      const rows = bloomsOn(d);
      const stems = rows.reduce((s,r) => s + (r.stems || 0), 0);
      const names = rows.map(r => cultivar(r.cultivarId).name || "Unnamed cultivar")
        .sort((a,b) => a.localeCompare(b));
      return `<tr data-day="${d}">
        <td class="muted small" style="white-space:nowrap">${fmtDate(d)}</td>
        <td>${esc(names.join(", "))}</td>
        <td class="r num">${stems || "—"}</td></tr>`;
    }).join("")}</tbody></table>
  </div>
  <p class="small muted">A day with no stems against it is a cultivar you saw in bloom but did not cut.
    ${years.length > 1 ? `Earlier seasons are behind the year above; each cultivar's page carries all of them side by side.`
      : ""}</p>`
  : `<div class="card section"><h3>Nothing recorded yet</h3>
      <p class="small muted" style="margin:8px 0 0">During bloom season, record a day as you come in with the bucket:
      the cultivars you cut from and how many stems each gave. First bloom, the length of the
      season and cost per stem all fall out of that.</p></div>`}`;

  if(draftBloom) app.insertAdjacentHTML("beforeend", bloomSheet());

  /* Today, already recorded, opens for editing — never a second entry against the same day. */
  $("#addBloom").onclick = () => {
    draftBloom = bloomsOn(today()).length ? loadBloom(today()) : blankBloom();
    armBloomDel = false; render();
  };
  const yr = $("#by"); if(yr) yr.onchange = e => { bloomYear = e.target.value; render(); };
  app.querySelectorAll("[data-day]").forEach(tr => tr.onclick = () => {
    draftBloom = loadBloom(tr.dataset.day); armBloomDel = false; render();
  });
  if(draftBloom) wireBloomSheet(app);
}

function bloomSheet(){
  const d = draftBloom, t = bloomTotals();
  const taken = new Set(d.lines.map(l => l.cultivarId).filter(Boolean));
  const all = DB.cultivars.slice().sort((a,b) => (a.name||"").localeCompare(b.name||""));
  const held = d.from ? bloomsOn(d.from).length : 0;   // what is on the day as stored, not as edited

  /* Asked the same way as a transaction: the question takes over the footer instead of
     stacking a second layer over a sheet that is already a layer. Only a stored day can
     be deleted — a new one has nothing behind it, so Discard is the whole of it. */
  const foot = armBloomDel
    ? `<div class="confirming">
         <p class="small" style="margin:0 0 12px">Delete ${fmtDate(d.from)}? The <span class="num">${held}</span>
           cultivar${held === 1 ? "" : "s"} recorded that day ${held === 1 ? "goes" : "go"} with it and the
           season's totals close over the gap. There is no way back.</p>
         <div class="acts">
           <button class="btn" id="blCancelDel">Cancel</button>
           <button class="btn danger" id="blDelDay">Delete the Day</button>
         </div></div>`
    : `<span class="small muted" id="blSum"></span>
       <div class="acts">
         ${d.from ? `<button class="btn danger" id="blDel">Delete Day</button>` : ""}
         <button class="btn" id="blDiscard">Discard</button>
         <button class="btn primary" id="blSave">Save</button>
       </div>`;

  return `<div class="psback" id="blBack"><div class="pspanel">
    <div class="pshead">
      <div class="grow"><h2>${d.from ? "Edit a day" : "Record a day"}</h2>
        <div class="subline">${d.from ? fmtDate(d.from)
          : d.carriedFrom ? `Carried from ${fmtDate(d.carriedFrom)} — take off what has finished`
          : "Nothing is added until you save"}</div></div>
      <button class="psx" id="blClose" title="Close">×</button>
    </div>
    <div class="psbody">
      <div class="fieldrow">
        <div style="grid-column:span 4">${field("Date", `<input type="date" required id="bl-date" value="${d.date}">`)}</div>
      </div>
      <table class="lines"><thead><tr>
        <th style="width:64%">Cultivar</th><th style="width:30%">Stems cut</th><th style="width:6%"></th>
      </tr></thead>
      <tbody>${d.lines.map((l,i) => `<tr style="cursor:default">
        <td><select data-bi="${i}"><option value="">—</option>${
          all.filter(c => c.id === l.cultivarId || !taken.has(c.id))
             .map(c => `<option value="${esc(c.id)}" ${c.id === l.cultivarId ? "selected" : ""}>${
               esc(c.name || "Unnamed cultivar")}</option>`).join("")}</select></td>
        <td><input type="number" min="0" step="1" data-bs="${i}" value="${esc(l.stems)}" placeholder="0"></td>
        <td class="r">${l.cultivarId ? `<button class="rowx" data-bx="${i}" title="Remove this line">×</button>` : ""}</td>
      </tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin:8px 0 0">A new line appears as you pick a cultivar.
        Leave the stems empty for something you saw in bloom but did not cut.</p>
    </div>
    <div class="psfoot${armBloomDel ? " stacked" : ""}">${foot}</div>
  </div></div>`;
}

function paintBloom(){
  if(!draftBloom) return;
  const t = bloomTotals(), sum = $("#blSum"), save = $("#blSave");
  if(sum) sum.innerHTML = t.filled.length
    ? `<span class="num">${t.stems}</span> stem${t.stems === 1 ? "" : "s"} · <span class="num">${
        t.filled.length}</span> cultivar${t.filled.length === 1 ? "" : "s"} in bloom`
    : "";
  if(save) save.disabled = !t.filled.length && !draftBloom.from;
}

function wireBloomSheet(app){
  const d = draftBloom;
  const shut = () => { discardBloomDraft(); render(); };
  $("#blClose").onclick = shut;
  $("#blBack").onclick = e => { if(e.target.id === "blBack") shut(); };
  $("#bl-date").onchange = e => { d.date = e.target.value; };

  app.querySelectorAll("[data-bi]").forEach(el => el.onchange = () => {
    d.lines[el.dataset.bi].cultivarId = el.value;
    trimBloomLines(); render();                 // the list of what is left to pick changes
  });
  app.querySelectorAll("[data-bs]").forEach(el => {
    el.oninput = () => { d.lines[el.dataset.bs].stems = el.value; paintBloom(); };
  });
  app.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => {
    d.lines.splice(Number(b.dataset.bx), 1); trimBloomLines(); render();
  });

  /* Half the footer is gone while the question is up, so each button is asked for
     rather than assumed. */
  const on = (sel, fn) => { const el = $(sel); if(el) el.onclick = fn; };
  on("#blDiscard", shut);
  on("#blSave", commitBloom);
  on("#blDel", () => { armBloomDel = true; render(); });
  on("#blCancelDel", () => { armBloomDel = false; render(); });
  on("#blDelDay", () => {
    const day = d.from;
    deleteBloomDay(day);
    discardBloomDraft(); render();
    saveNow(`${fmtDate(day)} deleted`);
  });
  paintBloom();
}

/* ---------- ledger ---------- */
/* An open-ended range: either end can be left empty. Dates are ISO strings, so a
   plain string comparison is a date comparison. A transaction with no date at all
   sits outside any range rather than drifting to one end of it. */
/* A ledger is read in a few habitual ways — all of it, what has just gone out, or one
   season at a time — so those are one click each and the two date boxes are kept for
   the rest. The seasons are read off the transactions themselves.

   An open-ended range: either end can be left empty. Dates are ISO strings, so a plain
   string comparison is a date comparison. A transaction with no date at all sits
   outside any range rather than drifting to one end of it. */
let ledRange = "all", ledFrom = "", ledTo = "";
const ledYears = () => [...new Set(DB.transactions.map(t => (t.date || "").slice(0,4))
  .filter(Boolean))].sort().reverse();
function ledBounds(){
  if(ledRange === "custom") return [ledFrom, ledTo];
  if(ledRange === "d30"){
    const d = new Date(); d.setDate(d.getDate() - 29);
    return [d.toISOString().slice(0,10), ""];
  }
  if(/^\d{4}$/.test(ledRange)) return [ledRange + "-01-01", ledRange + "-12-31"];
  return ["", ""];
}
const inBounds = (x, f, t) =>
  (!f && !t) ? true : !x.date ? false : (!f || x.date >= f) && (!t || x.date <= t);
/* Only says what the lit control does not already say — a year button has the year on
   it, so repeating Jan 1 to Dec 31 back is noise. */
function ledWords(f, t){
  if(/^\d{4}$/.test(ledRange)) return `all of ${ledRange}`;
  if(ledRange === "d30") return `${fmtDate(f)} onwards`;
  return !f && !t ? "every transaction"
    : f && t ? `${fmtDate(f)} to ${fmtDate(t)}`
    : f ? `${fmtDate(f)} onwards`
    : `up to ${fmtDate(t)}`;
}

function renderLedger(app){
  const all = DB.transactions;
  const [lf, lt] = ledBounds();
  const list = all.filter(x => inBounds(x, lf, lt)).slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const t = totals(list);
  const ranged = !!(lf || lt);
  const spent = list.filter(x => x.direction !== "income").length;

  app.innerHTML = `
  <div class="between"><h2>Ledger</h2>
    <button class="btn primary" id="addTxn">Record a Transaction</button></div>

  <div class="grid metrics section">
    ${metric("Out", fmt(t.out), `${spent} transaction${spent === 1 ? "" : "s"}`)}
    ${metric("In", fmt(t.inc), t.inc ? "revenue recorded" : "nothing yet")}
    ${metric("Allocated", fmt(t.alloc), "attached to plants")}
    ${metric("Overhead", fmt(t.overhead), "unallocated")}
  </div>

  <div class="row section" style="align-items:flex-end">
    <div class="seg" role="tablist">
      <button data-lr="all" class="${ledRange === "all" ? "on" : ""}">All</button>
      <button data-lr="d30" class="${ledRange === "d30" ? "on" : ""}">Last 30 days</button>
      ${ledYears().map(y => `<button data-lr="${y}" class="${ledRange === y ? "on" : ""}">${y}</button>`).join("")}
      <button data-lr="custom" class="${ledRange === "custom" ? "on" : ""}">Custom</button>
    </div>
    ${ledRange === "custom" ? `
      <div style="max-width:180px">${field("From", `<input type="date" id="lfrom" value="${ledFrom}">`)}</div>
      <div style="max-width:180px">${field("To", `<input type="date" id="lto" value="${ledTo}">`)}</div>` : ""}
  </div>
  ${ranged ? `<p class="small muted" style="margin:10px 0 0">${ledWords(lf, lt)} · showing <span class="num">${
    list.length}</span> of <span class="num">${all.length}</span> — the figures above follow the range.</p>` : ""}

  <div class="card section" style="padding:6px 8px">
    <table><thead><tr><th>Date</th><th>Counterparty</th><th>Category</th><th class="r">Amount</th><th class="r">Allocated</th></tr></thead>
    <tbody>${list.map(x=>{
      const b = txBalance(x);
      return `<tr data-tx="${x.id}">
        <td class="muted small" style="white-space:nowrap">${fmtDate(x.date)}</td>
        <td>${esc(x.counterparty)}<div class="small muted">${esc(x.description||"")}</div></td>
        <td><span class="tag">${esc(x.category||"—")}</span></td>
        <td class="r num">${x.direction==="income"?"+":""}${fmt(x.amount)}</td>
        <td class="r alloc">${(x.allocations||[]).length
            ? `${fmt(b.allocated)} · ${x.allocations.length} plant${x.allocations.length>1?"s":""}${b.balanced?"":` <span class="warn">off by ${fmt(Math.abs(b.diff))}</span>`}`
            : "—"}</td></tr>`;
    }).join("")}</tbody></table>
  </div>
  <p class="small muted">Unallocated spending is overhead. Per-plant cost is derived from these allocations, never typed twice.</p>`;

  /* Panels graft on with insertAdjacentHTML, which leaves what is already there
     untouched — so handlers attached earlier survive and the order stopped mattering. */
  const open = openTxn === null ? null : DB.transactions.find(x => x.id === openTxn);
  if(openTxn !== null && !open) openTxn = null;
  if(draftTxn) app.insertAdjacentHTML("beforeend", txnSheet());
  else if(open) app.insertAdjacentHTML("beforeend", txnView(open));

  app.querySelectorAll("[data-lr]").forEach(el => el.onclick = () => { ledRange = el.dataset.lr; render(); });
  /* The two boxes are only there while Custom is the lit one. */
  const lfEl = $("#lfrom"); if(lfEl) lfEl.onchange = e => { ledFrom = e.target.value; render(); };
  const ltEl = $("#lto");   if(ltEl) ltEl.onchange = e => { ledTo   = e.target.value; render(); };
  $("#addTxn").onclick = () => { draftTxn = blankTxn("order"); render(); };
  app.querySelectorAll("[data-tx]").forEach(tr => tr.onclick = () => {
    openTxn = Number(tr.dataset.tx); armDelete = armPlant = false; render();
  });
  if(draftTxn) wireTxnSheet(app);
  else if(open) wireTxnView(app, open);
}

/* ---------- looking back at a transaction ---------- */
/* Read-only on purpose. A saved plant order is the record of what the plants cost,
   and those plants have positions and histories hanging off it; correcting one
   means deleting it and recording it again, which is deliberate rather than easy. */
let openTxn = null, armDelete = false, armPlant = false;
function closeTxnView(){ openTxn = null; armDelete = armPlant = false; editing = null; render(); }

/* An order is a batch, and a batch moves through the season together: the box lands,
   then one weekend they all go in. These are the two moments worth one click. */
const orderPlants = x => (x.allocations || [])
  .filter(a => a.target === "plant")
  .map(a => DB.plants.find(p => p.id === a.targetId))
  .filter(Boolean);
const BEFORE_RECEIVED = ["Ordered"];
const BEFORE_PLANTED  = ["Ordered","Received"];

/* Roots already in the ground are left alone — this only ever moves things forward. */
function markOrder(x, to, date){
  const from = to === "Received" ? BEFORE_RECEIVED : BEFORE_PLANTED;
  let n = 0;
  for(const p of orderPlants(x)) if(from.includes(p.status)){
    p.status = to;
    if(to === "Planted") p.plantedDate = date || null;
    n++;
  }
  armPlant = false;
  if(!n){ toast(`Nothing left to mark ${to.toLowerCase()}`); return 0; }
  markDirty(); render();
  saveNow(`${n} root${n === 1 ? "" : "s"} marked ${to.toLowerCase()}`);
  return n;
}
function stageSummary(ps){
  const c = {};
  for(const p of ps) c[p.status] = (c[p.status] || 0) + 1;
  return STATUSES.filter(st => c[st])
    .map(st => `<span class="num">${c[st]}</span> ${st.toLowerCase()}`).join(" · ");
}

/* Kind is never stored. A plant order is simply an expense that bought plants,
   and that is legible from the allocations. */
function txnKindOf(x){
  if(x.direction === "income") return TXN_KINDS[2];
  return (x.allocations || []).some(a => a.target === "plant") ? TXN_KINDS[0] : TXN_KINDS[1];
}

         <div class="acts">

/* ---------- record an order ---------- */
/* ---------- the transaction sheet ---------- */
/* One panel, three kinds of transaction. Nothing is written until Save, the same as
   a new plant or cultivar. A plant order is the only kind that creates records
   beyond the ledger entry itself. */
const TXN_KINDS = [
  { id:"order",   label:"Plant order", dir:"expense" },
  { id:"expense", label:"Expense",     dir:"expense" },
  { id:"income",  label:"Income",      dir:"income"  },
];
let draftTxn = null;
function blankTxn(kind = "order", carry = {}){
  return { kind, date: carry.date || today(),
    counterparty: carry.counterparty || "", description: "", amount: "", units: "",
    category: "", shipping: "", tax: "", lines: [{ name:"", qty:1, price:"" }] };
}
function discardTxnDraft(){ draftTxn = null; clearNew(); }

const hasContent = l => !!(String(l.name).trim() || String(l.price).trim());
/* Keep exactly one empty line at the end, so there is always somewhere to type
   and never a stack of identical blanks. Returns true if the shape changed. */
function trimLines(){
  const before = draftTxn.lines.length;
  draftTxn.lines = draftTxn.lines.filter(hasContent);
  draftTxn.lines.push({ name:"", qty:1, price:"" });
  return draftTxn.lines.length !== before;
}
function orderTotals(){
  const lineTotal = l => cents(l.price) * (Number(l.qty) || 0);
  const sub = draftTxn.lines.reduce((s,l) => s + lineTotal(l), 0);
  const ship = cents(draftTxn.shipping), tax = cents(draftTxn.tax);
  const filled = draftTxn.lines.filter(l => l.name.trim() && Number(l.qty) > 0);
  return { lineTotal, sub, ship, tax, total: sub + ship + tax, filled,
           roots: filled.reduce((s,l) => s + Number(l.qty), 0) };
}

function paintOrder(){
  if(!draftTxn || draftTxn.kind !== "order") return;
  const t = orderTotals();
  draftTxn.lines.forEach((l,i) => {

    ` · <span class="num">${t.roots}</span> root${t.roots === 1 ? "" : "s"}` +
    ` · total <span class="num">${fmt(t.total/100)}</span>`;

/* A remainder of a few cents, handed out one at a time to the dearest roots first.
   Works in both directions, because proportional rounding can overshoot. */
function spreadRemainder(out, rem){
  if(!rem || !out.length) return;
  const order = out.map((_,i) => i).sort((a,b) => out[b].base - out[a].base || a - b);
  const step = rem > 0 ? 1 : -1;
  for(let i = 0; rem !== 0; i++){ out[order[i % order.length]].amount += step; rem -= step; }
}
/* Shipping is charged for moving roots, so it splits evenly per root.
   Tax is charged on value, so it splits in proportion to what each root cost.
   Either way the allocations add up to the charge exactly. */
function previewAlloc(filled, ship, tax = 0){
  const out = [];
  for(const l of filled){
    const unit = cents(l.price);
    for(let k = 0; k < Number(l.qty); k++) out.push({ name:l.name.trim(), base:unit, amount:unit });
  }
  if(!out.length) return out;
  const sub = out.reduce((s,r) => s + r.base, 0);

  if(ship > 0){
    const share = Math.floor(ship / out.length);
    out.forEach(r => r.amount += share);
    spreadRemainder(out, ship - share * out.length);
  }
  if(tax > 0){
    let given = 0;
    out.forEach(r => {
      const share = sub > 0 ? Math.round(tax * r.base / sub) : Math.floor(tax / out.length);
      r.amount += share; given += share;
    });
    spreadRemainder(out, tax - given);
  }
  return out;
}

function commitOrder(filled, ship, tax = 0){
  const vendor = (draftTxn.counterparty || "").trim();
  if(!vendor) return toast("Vendor is required");
  const rows = previewAlloc(filled, ship, tax);
  const total = rows.reduce((s,r)=>s+r.amount,0);
  if(total <= 0) return toast("Nothing to record");

  const allocations = [];
  let pid = nextPlantId();
  for(const r of rows){
    let v = DB.cultivars.find(x => x.name.toLowerCase() === r.name.toLowerCase());
    if(!v){
      v = newCultivar(r.name);          // one definition of what a cultivar is
    }
    DB.plants.push({ id:pid, cultivarId:v.id, label:null, status:"Ordered", source:vendor,
      acquiredDate:draftTxn.date || null, plantedDate:null, eyeCount:null,
      x:null, y:null, soil:null, parentPlantId:null, diseaseIssues:null, notes:null });
    allocations.push({ target:"plant", targetId:pid, amount: r.amount/100 });
    pid++;
  }

  DB.transactions.push({
    id: nextTxId(), date: draftTxn.date || null, direction:"expense",
    counterparty: vendor,
    description: `${rows.length} root${rows.length > 1 ? "s" : ""}` +
      (ship || tax ? ` (${[ship ? `$${(ship/100).toFixed(2)} shipping` : "", tax ? `$${(tax/100).toFixed(2)} tax` : ""].filter(Boolean).join(", ")})` : ""),
    amount: total/100, category:"Plants", allocations
  });

  discardTxnDraft();
  markDirty(); saveNow();
  toast(`${rows.length} plant${rows.length > 1 ? "s" : ""} added`);
  location.hash = "#/collection";
}

/* ---------- property map ---------- */
const live = p => !["Lost","Sold","Divided"].includes(p.status);
function mapped(){ return DB.plants.filter(p => live(p) && p.x !== null && p.y !== null); }
function unmapped(){ return DB.plants.filter(p => live(p) && (p.x === null || p.y === null)); }

/* The map is a grid of 3 ft cells and a cell holds at most one peony, which is
   what actually enforces spacing — snapped plants can never sit closer than 3 ft. */
const CELL = () => DB.property.cellFt || 3;
const cellX = p => Math.floor(p.x / CELL());
const cellY = p => Math.floor(p.y / CELL());
const cellCenter = (cx, cy) => ({ x:(cx + 0.5) * CELL(), y:(cy + 0.5) * CELL() });
function cellFree(cx, cy, exceptId){
  const P = DB.property;
  if(cx < 0 || cy < 0 || (cx+0.5)*CELL() > P.widthFt || (cy+0.5)*CELL() > P.depthFt) return false;
  return !DB.plants.some(p => p.id !== exceptId && p.x !== null && live(p) && cellX(p) === cx && cellY(p) === cy);
}
/* Snap to the cell under the point; if it's taken, spiral out to the closest free one. */
function snapFree(x, y, exceptId){
  const c = CELL(), bx = Math.floor(x/c), by = Math.floor(y/c);
  if(cellFree(bx, by, exceptId)) return cellCenter(bx, by);
  for(let r = 1; r <= 60; r++){
    let best = null, bestD = Infinity;
    for(let dx = -r; dx <= r; dx++) for(let dy = -r; dy <= r; dy++){
      if(Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      if(!cellFree(bx+dx, by+dy, exceptId)) continue;
      const q = cellCenter(bx+dx, by+dy), d = Math.hypot(q.x-x, q.y-y);
      if(d < bestD){ bestD = d; best = q; }
    }
    if(best) return best;
  }
  return null;
}

/* Pairs sitting closer than SPACING_FT center to center, anywhere on the property. */
function clashes(){
  const ps = mapped(), ids = new Set(), pairs = [];
  /* Nothing further apart than SPACING_FT can be crowded, so only the eight squares
     around a peony are worth measuring against. Same pairs, in the same order. */
  const key = (a,b) => a + ":" + b, buckets = new Map(), at = new Map();
  for(let i=0;i<ps.length;i++){
    const p = ps[i];
    at.set(p, i);
    const k = key(Math.floor(p.x/SPACING_FT), Math.floor(p.y/SPACING_FT));
    let a = buckets.get(k); if(!a) buckets.set(k, a = []); a.push(p);

        if(d < SPACING_FT){ ids.add(p.id); ids.add(q.id); pairs.push({a:p, b:q, d}); }

}

/* A small compass rose and bar scale. Both are drawn at a size in feet that works
   out to a fixed size on screen, so they don't inflate as you zoom in. */
function compass(cx, cy, R){
  const ink = "#3A3A3C", paper = "#FDF9F7";
  /* one point of the rose: a lit half and a shadowed half, meeting on its axis */
  const pt = (a, len, w) => {
    const r = a*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
    const T = (x,y) => `${(cx+x*c-y*s).toFixed(2)} ${(cy+x*s+y*c).toFixed(2)}`;
    return `<path d="M ${T(0,-len)} L ${T(-w,0)} L ${T(0,0)} Z" fill="${ink}"/>` +
           `<path d="M ${T(0,-len)} L ${T(w,0)} L ${T(0,0)} Z" fill="${paper}" stroke="${ink}" stroke-width="${R*0.016}"/>`;
  };
  const ring = (rad, sw) => `<circle cx="${cx}" cy="${cy}" r="${R*rad}" fill="none" stroke="${ink}" stroke-width="${R*sw}"/>`;
  const ticks = Array.from({length:48}, (_,i) => {
    const r = i*7.5*Math.PI/180, r1 = R*0.615, r2 = R*0.685;
    return `<line x1="${(cx+r1*Math.sin(r)).toFixed(2)}" y1="${(cy-r1*Math.cos(r)).toFixed(2)}" x2="${(cx+r2*Math.sin(r)).toFixed(2)}" y2="${(cy-r2*Math.cos(r)).toFixed(2)}" stroke="${ink}" stroke-width="${R*0.022}" stroke-linecap="round"/>`;
  }).join("");
  const lbl = (a,t) => { const r = a*Math.PI/180;
    return `<text x="${(cx+R*0.90*Math.sin(r)).toFixed(2)}" y="${(cy-R*0.90*Math.cos(r)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="Lato,sans-serif" font-size="${R*0.235}" font-weight="700" fill="${ink}">${t}</text>`; };
  return `<g>
    ${ring(0.76,0.028)}${ring(0.575,0.020)}${ticks}
    ${[45,135,225,315].map(a=>pt(a, R*0.44, R*0.085)).join("")}
    ${[0,90,180,270].map(a=>pt(a, R*0.72, R*0.105)).join("")}
    ${lbl(0,"N")}${lbl(90,"E")}${lbl(180,"S")}${lbl(270,"W")}
  </g>`;
}

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${compass(size/2, size/2, size/2)}</svg>`;
}
const NICE_FT = [1,2,3,5,10,15,20,25,50,75,100,150,200,300,500];

   number actually occupies — so the label is always exact, not approximated. */
function scaleParts(ftPerPx, targetPx){
  const raw = ftPerPx * targetPx;
  const len = NICE_FT.reduce((a,b) => Math.abs(b-raw) < Math.abs(a-raw) ? b : a);
  return { len, px: Math.max(28, Math.round(len / ftPerPx)) };
}


/* zoom / pan, in feet */
let view = null, plotAR = null, fitW = null, plotW = null;
const mapAR = () => DB.property.widthFt / DB.property.depthFt;

   landscape map fill a landscape box instead of letterboxing inside it. */
function viewH(){ return view.w / (plotAR || mapAR()); }

   to its right. That puts the blank grid on the left, under the island, where it
   costs nothing — rather than splitting it evenly and hiding the property. */
const ISLAND_PX = 214, EDGE_PX = 26;
const freeWidth = pw => Math.max(pw * 0.5, pw - ISLAND_PX - EDGE_PX);
function computeFitW(){
  const P = DB.property, ar = plotAR || mapAR(), pw = plotW || 1200;
  fitW = Math.max(P.widthFt * pw / freeWidth(pw), P.depthFt * ar);
  return fitW;
}
/* Where the map wants to sit at a given zoom: centered in the strip between the island
   and the right edge, then pulled back if that would push part of it off screen. */
function restingX(w){
  const P = DB.property, pw = plotW || 1200, k = pw / w, mapW = P.widthFt * k;
  let leftPx = ISLAND_PX + (freeWidth(pw) - mapW)/2;
  const lo = Math.min(0, pw - mapW), hi = Math.max(0, pw - mapW);
  leftPx = Math.max(lo, Math.min(leftPx, hi));
  return -leftPx / k;
}

/* Zoom about a fixed point, so whatever is under the cursor stays under it. */
function zoomAt(f, cx, cy){
  const w0 = view.w, lim = fitW || computeFitW();

     otherwise following a location link leaves the map parked off to one side. */
  if(view.w >= lim - 1e-6) return fitView();
  const k = view.w / w0;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;

function clampView(){

function clearFocus(){
  if(focusId === null) return false;
  focusId = null;
  document.querySelectorAll("[data-focus]").forEach(n => n.remove());
  return true;
}
function focusOn(id){
  const p = DB.plants.find(x => x.id === id);
  if(!p || p.x === null) return;
  if(!plotAR) plotAR = mapAR();
  const w = Math.min(computeFitW(), 55);
  view = { x: p.x - w/2, y: 0, w };

/* Last line of defense: if the pane ever measures flat, give it an explicit height
   from the viewport. A zero-height pane hides the map, the island and the compass
   all at once, so it must never be possible. */
function ensurePaneHeight(){
  const wrap = document.querySelector(".mapwrap"); if(!wrap) return;
  const r = wrap.getBoundingClientRect();
  if(r.height < 60) wrap.style.height = Math.max(340, window.innerHeight - r.top - 8) + "px";

/* The container's real shape isn't known until it's in the DOM. */
function syncPlotAR(){
  ensurePaneHeight();
  const plot = $("#plot"); if(!plot) return false;
  const r = plot.getBoundingClientRect();
  if(!r.width || !r.height) return false;
  plotW = r.width;
  const ar = r.width / r.height;
  if(plotAR === null || Math.abs(ar - plotAR)/ar > 0.01){ plotAR = ar; return true; }
  return false;

let resizeT = null;

/* Cheap enough to run on every wheel tick, which keeps the reading honest while
   the full re-render is still debounced. */
function paintScale(){
  const bar = $("#sbBar"), txt = $("#sbText");
  if(!bar || !txt) return;
  const s = scaleParts(view.w / (plotW || 1200), 120);
  bar.style.width = s.px + "px";
  txt.textContent = s.len + " ft";
}

const setDragging = on => document.body.classList.toggle("dragging", on);

function wireMap(){
  const plot = $("#plot"), svg = $("#svg"); if(!plot || !svg) return;
  paintScale();
  /* Screen pixels to map feet, straight off the SVG's own matrix — this is exact
     whatever the container does, including the letterboxing from xMidYMid meet. */
  const pt = svg.createSVGPoint();
  const toFt = ev => { pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const clampP = (v,max) => Math.max(0, Math.min(max, Math.round(v*10)/10));

  /* One table for the whole wiring pass. Searching the plant list per marker is
     the same list walked once for every marker on it. */
  const byId = new Map(DB.plants.map(p => [p.id, p]));
  svg.querySelectorAll("[data-pin]").forEach(el => {
    const p = byId.get(Number(el.dataset.pin));
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId); setDragging(true);
      const s = toFt(e), x0 = p.x, y0 = p.y;
      /* Every child moves, and each keeps the offset it started with — reading the
         offset afresh on each move would compound it and the label would drift away. */
      const parts = [...el.querySelectorAll("circle"), ...el.querySelectorAll("text")].map(n => ({
        n,
        ax: n.tagName === "circle" ? "cx" : "x",
        ay: n.tagName === "circle" ? "cy" : "y",
        dx: +n.getAttribute(n.tagName === "circle" ? "cx" : "x") - x0,
        dy: +n.getAttribute(n.tagName === "circle" ? "cy" : "y") - y0,
      }));
      const cellRect = svg.querySelector(`[data-cell="${p.id}"]`);
      let moved = false;
      const move = ev => {
        if(Math.abs(ev.clientX-e.clientX) + Math.abs(ev.clientY-e.clientY) > 3) moved = true;
        if(!moved) return;
        const c = toFt(ev);
        p.x = clampP(x0 + (c.x - s.x), DB.property.widthFt);
        p.y = clampP(y0 + (c.y - s.y), DB.property.depthFt);
        parts.forEach(q => { q.n.setAttribute(q.ax, p.x + q.dx); q.n.setAttribute(q.ay, p.y + q.dy); });
        if(cellRect){                                   // preview the square it will land in
          const t = snapFree(p.x, p.y, p.id);
          if(t){ cellRect.setAttribute("x", t.x - CELL()/2); cellRect.setAttribute("y", t.y - CELL()/2); }
        }
      };
      const up = () => {
        el.removeEventListener("pointermove", move); setDragging(false);
        if(!moved){ openPlant = p.id; render(); return; }   // sheet opens over the map
        const q = snapFree(p.x, p.y, p.id);
        if(q){ p.x = q.x; p.y = q.y; } else { p.x = x0; p.y = y0; toast("No free square nearby"); }
        markDirty(); render();
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up, {once:true});
      el.addEventListener("pointercancel", up, {once:true});
    });
  });

  /* Drag a name off the island and drop it on the map. Pointer capture keeps the
     events on the chip even once the cursor is over the plot. */
  document.querySelectorAll("[data-place]").forEach(el => {
    el.addEventListener("pointerdown", e => {
      /* The island sits inside the plot, so without this the plot's pan handler
         grabs the pointer capture and the drag dies the moment you're zoomed in. */
      e.preventDefault(); e.stopPropagation();
      const p = byId.get(Number(el.dataset.place));
      el.setPointerCapture(e.pointerId); setDragging(true);
      const ghost = document.createElement("div");
      ghost.className = "ghost";
      ghost.title = cultivar(p.cultivarId).name;
      const dia = Math.max(13, Math.round(2 * CELL() * 0.38 * ((plotW || 1200) / view.w)));
      ghost.style.width = ghost.style.height = dia + "px";
      let dragging = false;
      const overPlot = ev => {
        const r = plot.getBoundingClientRect();
        return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
      };
      const move = ev => {
        if(!dragging){
          if(Math.abs(ev.clientX-e.clientX) + Math.abs(ev.clientY-e.clientY) < 4) return;
          dragging = true; document.body.appendChild(ghost);
        }
        ghost.style.left = ev.clientX + "px";
        ghost.style.top  = ev.clientY + "px";
        ghost.classList.toggle("over", overPlot(ev));
      };
      const drop = ev => {
        el.removeEventListener("pointermove", move); setDragging(false);
        ghost.remove();
        let target;
        if(dragging && overPlot(ev)){ const c = toFt(ev); target = snapFree(c.x, c.y, p.id); }
        else if(!dragging){ target = snapFree(view.x + view.w/2, view.y + viewH()/2, p.id); }
        else return;                                   // dragged off the map — cancel
        if(!target) return toast("No free square there");
        p.x = target.x; p.y = target.y;
        markDirty(); render();
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", drop, {once:true});
      el.addEventListener("pointercancel", () => { el.removeEventListener("pointermove", move); setDragging(false); ghost.remove(); }, {once:true});
    });
  });

  /* ctrl/⌘ + wheel zooms about the cursor. The viewBox updates on every tick for
     responsiveness; the full re-render is deferred so markers resize once it settles. */
  let wheelT = null;
  /* Browsers report wheel deltas in pixels, lines or pages depending on the device. */
  const wheelPx = (d, mode, span) => mode === 1 ? d * 16 : mode === 2 ? d * span : d;
  plot.addEventListener("wheel", e => {
    e.preventDefault();
    if(e.ctrlKey || e.metaKey){
      const c = toFt(e);
      zoomAt(e.deltaY > 0 ? 1/0.86 : 0.86, c.x, c.y);
      paintScale();
    }else{
      /* Plain scroll pans. clampView holds it still if there's nothing to pan to. */
      const r = plot.getBoundingClientRect(), k = view.w / r.width;
      view.x += wheelPx(e.deltaX, e.deltaMode, r.width)  * k;
      view.y += wheelPx(e.deltaY, e.deltaMode, r.height) * k;
      clampView();
    }
    svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${viewH()}`);
    clearTimeout(wheelT);
    wheelT = setTimeout(() => render(), 90);
  }, {passive:false});

  plot.addEventListener("dblclick", e => { e.preventDefault(); fitView(); render(); });

  plot.addEventListener("pointerdown", e => {
    if(view.w >= DB.property.widthFt) return;
    e.preventDefault();                        // no text selection, no native image drag
    plot.setPointerCapture(e.pointerId); plot.classList.add("panning"); setDragging(true);
    /* Scale is captured once. Deriving it from the SVG matrix on every move would read
       a coordinate system this very drag is busy changing — the feedback is what made
       panning shake. The zoom can't change mid-pan, so one reading is enough. */
    const ftPerPx = view.w / plot.getBoundingClientRect().width;
    const x0 = view.x, y0 = view.y;
    let raf = null, last = null;
    const apply = () => {
      raf = null;
      view.x = x0 - (last.x - e.clientX) * ftPerPx;
      view.y = y0 - (last.y - e.clientY) * ftPerPx;
      clampView();
      svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${viewH()}`);
    };
    const move = ev => {
      last = { x:ev.clientX, y:ev.clientY };
      if(raf === null) raf = requestAnimationFrame(apply);   // one update per frame
    };
    const up = () => {
      plot.removeEventListener("pointermove", move);
      if(raf !== null){ cancelAnimationFrame(raf); raf = null; }
      if(last) apply();
      plot.classList.remove("panning"); setDragging(false);
      /* Nothing drawn depends on where the view sits, only on how wide it is, and
         the viewBox is already up to date — so a pan ends here. */
    };
    plot.addEventListener("pointermove", move);
    plot.addEventListener("pointerup", up, {once:true});
    plot.addEventListener("pointercancel", up, {once:true});
  });
}

/* ---------- boot ---------- */
/* Safety net: a stuck drag class would leave the whole page unselectable. */
window.addEventListener("pointerup", () => setDragging(false));
window.addEventListener("pointercancel", () => setDragging(false));
window.addEventListener("blur", () => setDragging(false));

$("#saveBtn").onclick = saveNow;
document.addEventListener("keydown", e => {
  if((e.metaKey||e.ctrlKey) && e.key === "s"){ e.preventDefault(); if(dirty) saveNow(); }
  if(e.key === "Escape" && draftCultivar){ discardCultivarDraft(); render(); return; }
  if(e.key === "Escape" && draftBloom){ discardBloomDraft(); render(); return; }
  if(e.key === "Escape" && openTxn !== null){
    if(armDelete || armPlant){ armDelete = armPlant = false; render(); return; }  // back out of the question first
    return closeTxnView();
  }
  /* Back out of the division first, the same way the ledger backs out of its question. */
  if(e.key === "Escape" && photoFor !== null){ photoFor = null; draftCrop = null; render(); return; }
  if(e.key === "Escape" && draftDivide){ discardDivide(); render(); return; }
  if(e.key === "Escape" && armDividePlant){ armDividePlant = false; render(); return; }
  if(e.key === "Escape" && openPlant !== null){
    const p = findPlant(openPlant), cid = p && p.cultivarId;
    const onMap = location.hash.startsWith("#/map");
    if(p && isDraft(p)) discardDraft(); else { editing = null; openPlant = null; }
    if(onMap) return render();
    location.hash = cid ? "#/collection/" + cid : "#/collection";
    render();
  }
});
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- keeping up with the other device ---------- */
/* The phone and this window are reading the same file, so coming back to this window
   is the moment to ask whether anything changed while you were away. Only ever when
   there is nothing unsaved here — an edit in progress is never overwritten. */
let checking = false;
async function catchUp(){
  if(checking || !DB || !Store.isRepo) return;
  checking = true;
  try{
    if(Store.unsent){ await Store.flush(); paintFileState(); }
    else if(await Store.remoteChanged() && !dirty){
      DB = await Store.reload();
      render(); paintFileState();
      toast("Updated \u2014 these records were saved elsewhere");
    }
  }catch(e){ if(e.kind === "conflict") await resolveConflict(); }
  finally{ checking = false; }
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) catchUp(); });
window.addEventListener("focus", catchUp);
window.addEventListener("online", catchUp);
setInterval(() => { if(!document.hidden) catchUp(); }, 120000);

if("serviceWorker" in navigator)
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

(async function boot(){
  try{
    if(await Store.restore()){ DB = await Store.load(); }
  }catch(e){ /* fall through to connect screen */ }
  render();
  if(DB) settleOnLoad();
})();
</script>
</body>
</html>
