}
/* Where in the season it opens, at a glance — scannable down a column. */
function seasonStrip(s){
  const i = SEASONS.indexOf(s);
  return `<span class="strip" title="${esc(s || "season unrecorded")}">${
    SEASONS.map((_,k) => `<i class="${k === i ? "on" : (i >= 0 && Math.abs(k-i) === 1 ? "near" : "")}"></i>`).join("")}</span>`;
}
/* ---------- creating and removing ---------- */
function uniqueCultivarId(name){
  let base = slug(name) || "cultivar", id = base, n = 1;
  while(DB.cultivars.some(v => v.id === id)) id = base + "-" + (++n);
  return id;
}
function newCultivar(name){
  const v = { id: uniqueCultivarId(name), name, color: null, bloomSeason: null, bloomType: null,
    plantType: "Herbaceous", fragrance: null, stemStrength: null, photo: null, notes: null };
  DB.cultivars.push(v);
  markDirty();
  return v;
}
function blankPlant(cultivarId, extra = {}){
  return { id: nextPlantId(), cultivarId, status: ACQUIRED, source: null,
    acquiredDate: null, plantedDate: null, eyeCount: null,
    x: null, y: null, parentPlantId: null, notes: null, ...extra };
}
function newPlant(cultivarId, extra = {}){
  const p = blankPlant(cultivarId, extra);
  DB.plants.push(p);
  markDirty();
  return p;
}
/* A plant carries ledger allocations, so removing it would leave the books short.
   Those allocations become overhead rather than vanishing. */
function deletePlant(id){
  if(!DB.plants.some(p => p.id === id)) return 0;      // nothing removed, nothing to save
  let freed = 0;
  for(const t of DB.transactions){
    const keep = (t.allocations || []).filter(a => !(a.target === "plant" && a.targetId === id));
    freed += (t.allocations || []).length - keep.length;
    t.allocations = keep;
  }
  DB.plants = DB.plants.filter(p => p.id !== id);
  for(const p of DB.plants) if(p.parentPlantId === id) p.parentPlantId = null;
  markDirty();
  return freed;
}
function deleteCultivar(id){
  if(DB.plants.some(p => p.cultivarId === id)) return false;   // still has plants
  if(!DB.cultivars.some(v => v.id === id)) return false;      // nothing there to remove
  DB.cultivars = DB.cultivars.filter(v => v.id !== id);
  markDirty();
  return true;
}
/* ---------- collection: cultivars -> plants -> one plant ---------- */
let colSort = {key:"name", dir:1}, colFilter = {q:""};

/* `byCv` is plants already grouped by cultivar, for a caller building many rows at
   once — one sweep of the plant list instead of one per cultivar. Left out, the row
   finds its own plants exactly as before, so a single row costs a caller nothing. */
function cultivarRow(v, byCv){
  /* `list` is every plant ever recorded for this cultivar, so a lost or sold one is
     still reachable. `plants` counts only the living, which is what "owned" means. */
  /* Checked rather than trusted: `DB.cultivars.map(cultivarRow)` hands a callback its
     index as a second argument, and a row asked for that way must still be right. */
  const all = byCv instanceof Map ? (byCv.get(v.id) || [])
                                  : DB.plants.filter(p => p.cultivarId === v.id);
  const alive = all.filter(live);
  const statuses = {};
  for(const p of alive) statuses[p.status] = (statuses[p.status] || 0) + 1;
  return { v, id:v.id, name:v.name || "—", color:v.color || "", season:v.bloomSeason || "",
    type:v.bloomType || "", plants:alive.length, gone:all.length - alive.length, statuses,
    placed:alive.filter(p => p.x !== null).length,
    /* Only the cultivar page shows a cost; the collection asks for a row and never
       reads this, so it is worked out on the way out rather than on the way in. */
    get cost(){ return all.reduce((s,p) => s + plantCost(p.id), 0); },
    list:all };
}
const effKey = cols => cols.some(c => c[0] === colSort.key) ? colSort.key : cols[0][0];
function sortRows(rows, cols){
  const k = effKey(cols);
  return rows.sort((a,b) => {
    let x = a[k], y = b[k];
    if(k === "season"){ x = SEASONS.indexOf(x); y = SEASONS.indexOf(y); }
    if(typeof x === "string") return x.localeCompare(y) * colSort.dir;
    return ((x ?? 0) - (y ?? 0)) * colSort.dir;
  });
}
const SOURCE_LIST = () => [...new Set(DB.plants.map(p => p.source).filter(Boolean))].sort();
/* The same fields serve the panel on the cultivar page and the new-cultivar sheet,
   so the two can never drift apart. */
function cultivarFields(v, on){
  return `
    <div class="fieldrow">
      ${rw(on, "Name", F.text("c", v.id, "name", v.name, "Cultivar name"), v.name, "span6")}
      ${rw(on, "Type", F.sel("c", v.id, "plantType", v.plantType, PLANT_TYPES), v.plantType)}
      ${rw(on, "Form", F.sel("c", v.id, "bloomType", v.bloomType, BLOOM_TYPES), v.bloomType)}
    </div>
    <div class="fieldrow">
      ${rw(on, "Color", F.text("c", v.id, "color", v.color, "e.g. Blush pink"), v.color)}
      ${field("Bloom season", on
        ? F.sel("c", v.id, "bloomSeason", v.bloomSeason, SEASONS)
        : `<div class="ro${v.bloomSeason ? "" : " muted"}">${seasonStrip(v.bloomSeason)}${esc(v.bloomSeason) || "—"}</div>`)}
      ${rw(on, "Fragrance", F.sel("c", v.id, "fragrance", v.fragrance, FRAGRANCE), v.fragrance)}
      ${rw(on, "Stems", F.sel("c", v.id, "stemStrength", v.stemStrength, STRENGTH), v.stemStrength)}
    </div>
    <div class="fieldrow">
      ${rw(on, "Notes", F.area("c", v.id, "notes", v.notes), v.notes, "span12")}
    </div>`;
}

/* A new cultivar is a draft too: it exists only in this variable until Save. */
let draftCultivar = null;
const DRAFT_ID = "__draft";
const findCultivar = id => (draftCultivar && draftCultivar.id === id) ? draftCultivar : DB.cultivars.find(x => x.id === id);
function blankCultivar(){
  return { id: DRAFT_ID, name: "", color: null, bloomSeason: null, bloomType: null,
           plantType: "Herbaceous", fragrance: null, stemStrength: null, photo: null, notes: null };
}
function discardCultivarDraft(){ draftCultivar = null; editing = null; }

/* ---------- sorting, without a table to click ---------- */
/* The desktop sorts by tapping a column heading. There are no column headings here,
   so the same two facts — which key, which way — are asked for directly. */
function sortBar(cols){
  const k = effKey(cols);
  return `<div class="row" style="gap:8px;margin:0 0 12px;flex-wrap:nowrap">
    <span class="small muted" style="flex:none">Sort</span>
    <select id="sortKey" style="flex:1">${cols.map(([key,label]) =>
      `<option value="${key}" ${key === k ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>
    <button class="btn sm" id="sortDir" style="flex:none;width:46px;min-height:44px;font-size:16px"
      aria-label="Reverse the order">${colSort.dir > 0 ? "&#8593;" : "&#8595;"}</button>
  </div>`;
}
function wireSortBar(){
  const s = $("#sortKey"); if(!s) return;
  s.onchange = e => { colSort.key = e.target.value; colSort.dir = 1; render(); };
  $("#sortDir").onclick = () => { colSort.dir *= -1; render(); };
}
/* Nothing recorded is an em dash, and zero is a number — a count of no eyes is a fact
   about the root, not an absence of one. */
function kv(k, val, raw){
  const has = !(val === null || val === undefined || val === "");
  return `<div class="kvrow"><dt>${k}</dt><dd class="${has ? "" : "muted"}">${
    has ? (raw ? val : esc(val)) : "&mdash;"}</dd></div>`;
}
/* ---------- level 1: the cultivars ---------- */
function renderCollection(app){

  const all = DB.cultivars.map(v => cultivarRow(v, byCv));
  const rows = sortRows(all.filter(r =>
    !colFilter.q || (r.name + " " + r.color + " " + r.season + " " + r.type).toLowerCase().includes(colFilter.q.toLowerCase())
  ), cols);

  app.innerHTML = `
  ${screenHead("Collection", `<span class="num">${owned}</span> cultivar${owned === 1 ? "" : "s"} ·
    <span class="num">${plants}</span> plants${all.length > owned

  <input id="q" type="search" placeholder="Search name, color, season or form" value="${esc(colFilter.q)}">

      trail: `<span class="countpill ${r.plants ? "" : "zero"}">${

  </div>

  ${fab("addCultivar", "Add a cultivar")}`;

  let qT = null;

/* ---------- level 2: one cultivar, and every plant of it ---------- */
/* Season by season, what this cultivar actually did. Cost per stem is cumulative:
   a root is bought once and cuts for decades, so dividing one season's stems into
   the whole purchase price would say something untrue in the early years. */
function seasonCard(v, cost){
  const years = bloomYears().filter(y => cultivarSeason(v.id, y));
  if(!years.length) return `
    <div class="card section"><h3>Season</h3>
      <p class="small muted" style="margin:8px 0 0">Nothing recorded yet. Once you log a day on the
        <a href="#/bloom">Bloom</a> tab, first bloom, the length of the season and cost per stem appear here.</p></div>`;

  let running = 0;
  const rows = years.slice().sort().map(y => {              // oldest first, so the running total means something
    const s = cultivarSeason(v.id, y);
    running += s.stems;
    return li({
      cls: "static",
      lead: `<span class="num">${y}</span>`,
      meta: `${fmtDate(s.first)}${s.last === s.first ? "" : " – " + fmtDate(s.last)} ·
             <span class="num">${s.days}</span> day${s.days === 1 ? "" : "s"}`,
      trail: `<span class="num">${s.stems || "—"}${s.stems ? " stems" : ""}</span>
              <span class="sub num">${cost && running ? fmt(cost / running) + " a stem" : ""}</span>`,
    });
  }).reverse().join("");

  return `
  <h3 class="section" style="margin-bottom:8px">Season</h3>
  <div class="card flush">${rows}</div>
  <p class="small muted section">Cost per stem is what you paid for this cultivar against every stem it has
    cut so far, so it falls each season.</p>`;
}

  if(vEdit) $("#save_cultivar").onclick = commitEdit;
  else      $("#edit_cultivar").onclick = () => beginEdit("c:" + v.id);
  $("#addPlant").onclick = () => {
    draftPlant = blankPlant(v.id);
    openPlant = draftPlant.id;
    editing = "p:" + draftPlant.id;      // opens straight into edit mode
    render();
  };
  const del = $("#delCultivar");
  if(del) del.onclick = () => {
    if(!confirm(`Delete ${v.name}? It has no plants, so nothing else is affected.`)) return;
    deleteCultivar(v.id); location.hash = "#/collection";
  };
}
/* ---------- one root, into the ground ---------- */
/* A peony with a square is one fact short of being planted, and the fact is the day. So
   the sheet asks for the day and nothing else, in the foot where the button stood. */
let armPlantOne = false;
const canPlantOne = p => !isDraft(p) && p.status === PLANNED;
function plantOne(p, date){
  if(!date) return toast("Needs a date");
  if(p.status !== PLANNED) return toast("That plant is not waiting on a hole");
  p.status = PLANTED; p.plantedDate = date;
  armPlantOne = false;
  markDirty(); render();
  saveNow(`Plant ${p.id} planted on ${fmtDate(date)}`);
  return 1;
}

/* ---------- the plant sheet ---------- */
/* A plant answers a narrow set of questions: which root is this, where did it come
   from, when did it go in, where is it now, what did it cost. Everything about the
   flower itself — and, when it comes, what was cut from it — belongs to the cultivar. */
let openPlant = null;
/* Add plant opens a draft. It is a plain object held here, not in DB.plants, so
   closing the sheet without saving leaves the data exactly as it was. */
let draftPlant = null;
const findPlant = id => (draftPlant && draftPlant.id === id) ? draftPlant : DB.plants.find(x => x.id === id);
const isDraft = p => !!draftPlant && draftPlant.id === p.id;
function discardDraft(){ draftPlant = null; openPlant = null; editing = null;
  draftDivide = null; armDividePlant = false; armPlantOne = false; }

/* A peony can leave the map without leaving the record: the square comes free and it
   goes back to the tray, which is the difference between moving it and deleting it.
   Asked for in one place only — by holding the peony itself on the map, where the square
   being given up is the thing under your thumb. The plant's own page used to ask it too,
   off a hold on the position, which put a destructive answer under a finger that was
   only reading. Somewhere you go to look at a peony is not somewhere to lose its square. */
function unplacePlant(p){
  p.x = null; p.y = null;
  /* The square was the whole of the plan, so giving up the square gives up the plan and
     leaves exactly what was there before it was dropped: a root in your hands. */
  if(p.status === PLANNED) p.status = ACQUIRED;
  if(focusId === p.id) focusId = null;          // the ring has nothing left to point at
  markDirty();
}

function plantSheet(p){
  if(dividing(p)) return dividePanel(p);       // the same sheet, asking a different question
  const v = cultivar(p.cultivarId);
  const on = isEditing("p:" + p.id);
  const others = DB.plants.filter(x => x.id !== p.id && live(x));
  const allocs = [];
  for(const t of DB.transactions)
    for(const a of (t.allocations || []))
      if(a.target === "plant" && a.targetId === p.id) allocs.push({t,a});
  const cost = allocs.reduce((s,x) => s + x.a.amount, 0);
  const parent = DB.plants.find(o => o.id === p.parentPlantId);

  const where = p.x === null
    ? `<a href="#/map">not placed</a>`
    /* A crown that has been divided away is not on the map any more, so where it stood
       is a fact about the past rather than somewhere to go. */
    : !live(p) ? `was at ${p.x}, ${p.y} ft`
    /* Straight to the peony on the map, which is where its square is given up if it

  const fields = on ? `
    <div class="fieldrow">

        DB.cultivars.slice().sort((a,b) => (a.name||"").localeCompare(b.name||""))
          .map(c => `<option value="${esc(c.id)}" ${p.cultivarId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")
        }</select>`)}
    </div>
    <div class="fieldrow pair">
      ${field("Status", F.sel("p", p.id, "status", p.status, STATUSES, "—"))}
      ${field("Eyes", F.num("p", p.id, "eyeCount", p.eyeCount))}
    </div>
    <div class="fieldrow">
      ${field("Source", picker("psource", `id="p_source"`, p.source, SOURCE_LIST(), "+ New source…"))}
    </div>
    <div class="fieldrow pair">
      ${field("Acquired", F.date("p", p.id, "acquiredDate", p.acquiredDate))}
      ${field("Planted", F.date("p", p.id, "plantedDate", p.plantedDate))}
    </div>
    <div class="fieldrow">
      ${field("Divided from", `<select data-t="num" data-edit="p:${p.id}:parentPlantId"><option value="">—</option>${
        others.map(o => `<option value="${o.id}" ${p.parentPlantId === o.id ? "selected" : ""}>#${o.id} ${
          esc(cultivar(o.cultivarId).name)}</option>`).join("")}</select>`)}
    </div>
    <div class="fieldrow">${field("Notes", F.area("p", p.id, "notes", p.notes))}</div>
    <div class="kvlist" style="margin-top:4px">${kv("Position", where, true)}</div>`
  : `<div class="kvlist">
      ${kv("Cultivar", v.name)}
      ${kv("Source", p.source)}
      ${kv("Acquired", p.acquiredDate ? fmtDate(p.acquiredDate) : null)}
      ${kv("Planted", p.plantedDate ? fmtDate(p.plantedDate) : null)}
      ${kv("Eyes", p.eyeCount)}
      ${kv("Divided from", from, true)}
      ${kv("Position", where, true)}
      ${kv("Notes", p.notes)}
      ${isDraft(p) ? "" : kv("Cost", cost
        ? `<span class="num">${fmt(cost)}</span> <span class="small muted">${
            esc(allocs.map(x => x.t.counterparty).join(", "))}</span>`
        : null, true)}
    </div>`;

  /* The same moment an order gets: they were cut together, and one weekend they all go
     in. Divisions already in the ground are left out of the count. */
  const kids = divisionsOf(p.id), ready = kids.filter(k => NOT_YET_IN.includes(k.status)).length;
  const kidActs = !ready ? ""
    : armDividePlant
      ? `<div class="fieldrow pair" style="margin:14px 0 6px">
           ${field("Planted on", `<input type="date" required id="dvPlantDate" value="${today()}">`)}
           <div><label>&nbsp;</label><button class="btn primary wide" id="dvPlantGo">Mark ${ready} Planted</button></div>
         </div>
         <button class="btn wide" id="dvPlantCancel">Cancel</button>`
      : `<button class="btn wide" id="dvPlant" style="margin:12px 0 2px">Mark ${ready} Planted</button>`;

  const divisions = kids.length ? `
    <div class="between" style="margin-top:24px"><h3 style="margin:0">Its divisions</h3>
      <span class="small muted">${stageSummary(kids)}</span></div>
    ${kidActs}
    <div class="card flush" style="margin-top:10px">${kids.map(k => li({
      go: true,
      data: ` data-goplant="${k.id}"`,
      lead: `Plant <span class="num">${k.id}</span>`,
      meta: esc(k.x === null ? "no square yet" : `${k.x}, ${k.y} ft`),

    <p class="small muted" style="margin:10px 0 0">${ready
      ? `Marking them planted dates all <span class="num">${ready}</span> the same day. One that went in on
         its own day, set on its own page.`
      : `Every division off this crown is in the ground.`}</p>` : "";

  const planting = armPlantOne && canPlantOne(p);
  return sheet("ps", {
    title: isDraft(p) ? "New plant" : `Plant <span class="num">${p.id}</span>`,
    sub: isDraft(p) ? "Nothing is added until you save" : esc(v.name || "Untitled cultivar"),
    pill: `<span class="pill ${pillClass(p.status)}" style="margin-top:6px">${p.status}</span>`,
    body: fields + divisions,
    stacked: planting,
    foot: planting
      ? `<div class="confirming">
           <p class="small">The day plant <span class="num">${p.id}</span> went in the ground${
             p.x === null ? "" : ` at <span class="num">${p.x}, ${p.y}</span> ft`}. That is the whole of
             it — it becomes Planted, and becomes Established on its own when the time comes.</p>
           <div class="fieldrow pair">
             ${field("Planted on", `<input type="date" required id="ppDate" value="${today()}">`)}
             <div><label>&nbsp;</label><button class="btn primary wide" id="ppGo">Plant</button></div>
           </div>
           <div class="acts"><button class="btn" id="ppCancel">Cancel</button></div>
         </div>`
      : `<div class="acts">
      <button class="btn danger" id="delPlant">${isDraft(p) ? "Discard" : "Delete"}</button>
      ${canPlantOne(p) ? `<button class="btn" id="plant_plant">Plant</button>` : ""}
      ${canDivide(p) ? `<button class="btn" id="divide_plant">Divide</button>` : ""}
      ${on ? `<button class="btn primary" id="save_plant">Save</button>`
           : `<button class="btn primary" id="edit_plant">Edit</button>`}
    </div>`
  });
}

function dividePanel(p){
  const d = draftDivide, v = cultivar(p.cultivarId), t = divideTotals();
  const name = esc(v.name || "Untitled cultivar");
  return sheet("ps", {
    closeId: "dvClose",

      </tr></thead>
      <tbody>${d.lines.map((l,i) => `<tr>
        <td class="muted small">${name} <span class="num">${i + 1}</span> of <span class="num">${t.n}</span></td>

      </tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin:10px 0 0">Three to five eyes is a division that will bloom again

      <p class="small muted" style="margin:10px 0 0">Plant <span class="num">${p.id}</span> becomes Divided and keeps
        its cost and its history${p.x === null ? "" : `, and its square at ${p.x}, ${p.y} ft comes free`}. The
        <span class="num">${t.n}</span> new ${t.n === 1 ? "root is" : "roots are"} recorded as
        <strong>Acquired</strong> on the date above. Drop ${t.n === 1 ? "it" : "them"} on the map to claim
        ${t.n === 1 ? "a square" : "squares"}, and plant ${t.n === 1 ? "it" : "them"} when
        ${t.n === 1 ? "it goes" : "they go"} in the ground.</p>`,
    foot: `<span class="small muted" id="dvSum"></span>
      <div class="acts">
        <button class="btn" id="dvCancel">Cancel</button>
        <button class="btn primary" id="dvGo">Divide into ${t.n}</button>
      </div>`
  });
}
function wirePlantSheet(app, p){
  if(dividing(p)) return wireDivide(app, p);
  /* Opened from the map it closes back to the map; opened from a cultivar page it
     closes back to that. Where it came from is simply where the hash still points. */
  const close = () => {
    const onMap = location.hash.startsWith("#/map");
    const cid = p.cultivarId;
    clearNew(); armDividePlant = false; armPlantOne = false;
    if(isDraft(p)) discardDraft(); else { editing = null; openPlant = null; }
    if(onMap) return render();
    location.hash = "#/collection/" + cid;
    render();                                  // the hash may already be that, so force it
  };
  $("#psClose").onclick = close;
  $("#psBack").onclick = e => { if(e.target.id === "psBack") close(); };
  bindEdits(app);
  wirePicker($("#p_source"), "psource",           // stands in for the generic binding
    v => { p.source = v.trim() || null; }, markDirty);   // no re-render: it would eat the click on Save
  /* The whole footer is gone while the question is up, so each button is asked for
     rather than assumed — the same way a bloom day's is. */
  const on = (sel, fn) => { const el = $(sel); if(el) el.onclick = fn; };
  if(isEditing("p:" + p.id)) on("#save_plant", () => {
    if(isDraft(p)){ DB.plants.push(p); draftPlant = null; markDirty(); }
    commitEdit();
  });
  else on("#edit_plant", () => beginEdit("p:" + p.id));
  const dv = $("#divide_plant");
  if(dv) dv.onclick = () => { editing = null; armDividePlant = false; draftDivide = blankDivide(p); render(); };
  on("#plant_plant", () => { editing = null; armDividePlant = false; armPlantOne = true; render(); });
  on("#ppCancel", () => { armPlantOne = false; render(); });
  on("#ppGo", () => plantOne(p, $("#ppDate").value));

  /* One click to the division, and the "Divided from" link is the way back. */
  app.querySelectorAll("[data-goplant]").forEach(tr => tr.onclick = () => {
    editing = null; armDividePlant = false; armPlantOne = false;
    location.hash = "#/plant/" + tr.dataset.goplant;
  });
  const mp = $("#dvPlant");
  if(mp) mp.onclick = () => { editing = null; armDividePlant = true; render(); };
  const mc = $("#dvPlantCancel");
  if(mc) mc.onclick = () => { armDividePlant = false; render(); };
  const mg = $("#dvPlantGo");
  if(mg) mg.onclick = () => markDivisionsPlanted(p.id, $("#dvPlantDate").value);
  on("#delPlant", () => {
    if(isDraft(p)) return close();            // never existed; nothing to confirm
    const n = DB.transactions.reduce((s,t) => s + (t.allocations||[]).filter(a =>
      a.target === "plant" && a.targetId === p.id).length, 0);
    if(!confirm(`Delete plant ${p.id}?` + (n ? `\n\n${n} ledger allocation${n===1?"":"s"} will be released back to overhead — the ledger total is unchanged.` : ""))) return;
    const onMap = location.hash.startsWith("#/map"), cid = p.cultivarId;
    deletePlant(p.id); editing = null; openPlant = null;
    if(onMap) return render();
    location.hash = "#/collection/" + cid;
  });
}
/* ---------- dividing ---------- */
/* Lifting a crown ends one plant and starts several. The parent is not deleted: it goes
   to Divided, keeps its cost and its place in the record, and each piece becomes a plant
   of its own pointing back at it. Nothing is written until the button at the foot, so
   opening the question and thinking better of it costs nothing. */
let draftDivide = null, armDividePlant = false;

/* A division stays attached to the crown it came off, so the parent's page is where the
   batch is handled: they were lifted together and they go back in together. */
const divisionsOf = id => DB.plants.filter(p => p.parentPlantId === id).sort((a,b) => a.id - b.id);

/* Only moves things forward, and only the ones still waiting: a division you already
   put in on its own day keeps the date you gave it. */
function markDivisionsPlanted(id, date){
  let n = 0;
  for(const k of divisionsOf(id)) if(NOT_YET_IN.includes(k.status)){
    k.status = PLANTED;
    k.plantedDate = date || null;
    n++;
  }
  armDividePlant = false;
  if(!n){ toast("Nothing left to mark planted"); return 0; }
  markDirty(); render();
  saveNow(`${n} division${n === 1 ? "" : "s"} marked planted`);
  return n;
}

/* Only something in the ground can be lifted — a root still on order or already gone
   has nothing to cut. */
const canDivide = p => !isDraft(p) && [PLANTED, ESTABLISHED].includes(p.status);
const dividing = p => !!draftDivide && draftDivide.from === p.id;
function blankDivide(p){
  return { from: p.id, date: today(), lines: [{eyes:""},{eyes:""},{eyes:""}] };
}
function discardDivide(){ draftDivide = null; }
/* Eyes left blank stay null: not counted is not the same as none. */
const divideEyes = l => l.eyes === "" ? null : Math.max(0, Math.round(Number(l.eyes) || 0));
/* Changing the count keeps the eyes already typed rather than starting the list again. */
function setDivideCount(n){
  const lines = draftDivide.lines;
  n = Math.max(1, Math.min(24, Math.round(Number(n) || 0) || lines.length));
  while(lines.length > n) lines.pop();
  while(lines.length < n) lines.push({eyes:""});
  return n;
}
function divideTotals(){
  const counted = draftDivide.lines.filter(l => divideEyes(l) !== null);
  return { n: draftDivide.lines.length, counted: counted.length,
           eyes: counted.reduce((s,l) => s + divideEyes(l), 0) };
}

function commitDivide(p){
  const d = draftDivide;
  if(!d.date) return toast("Needs a date");
  if(!DB.plants.some(x => x.id === p.id)) return toast("That plant is gone");
  /* A division is a root in a crate, not a plant in the ground: the day it was cut is
     the day it was acquired, and it joins the same road a bought root joins. */
  const made = d.lines.map(l => newPlant(p.cultivarId, {
    status: ACQUIRED, acquiredDate: d.date, plantedDate: null,
    eyeCount: divideEyes(l), parentPlantId: p.id }));
  /* Divided is not living, so the map stops drawing it and its square comes free for
     one of the pieces to go back into. */
  p.status = "Divided";
  markDirty();
  const onMap = location.hash.startsWith("#/map");
  discardDivide(); editing = null; openPlant = null;
  if(onMap) render();
  else { location.hash = "#/collection/" + p.cultivarId; render(); }
  saveNow(`Plant ${p.id} divided into ${made.length}`);
  return made;
}
function paintDivide(){
  if(!draftDivide) return;
  const t = divideTotals(), sum = $("#dvSum");
  if(sum) sum.innerHTML = t.counted
    ? `<span class="num">${t.eyes}</span> eye${t.eyes === 1 ? "" : "s"} across <span class="num">${
        t.counted}</span> of <span class="num">${t.n}</span>`
    : `<span class="num">${t.n}</span> division${t.n === 1 ? "" : "s"}, eyes not counted`;
}

function wireDivide(app, p){
  const d = draftDivide;
  /* Backing out returns to the plant, not out of it: you opened the question from here. */
  const back = () => { discardDivide(); render(); };
  $("#dvClose").onclick = back;
  $("#dvCancel").onclick = back;
  $("#psBack").onclick = e => { if(e.target.id === "psBack") back(); };
  $("#dv-date").onchange = e => { d.date = e.target.value; };
  $("#dv-n").onchange = e => { setDivideCount(e.target.value); render(); };
  app.querySelectorAll("[data-de]").forEach(el => {
    el.oninput = () => { d.lines[el.dataset.de].eyes = el.value; paintDivide(); };
  });
  $("#dvGo").onclick = () => commitDivide(p);
  paintDivide();
}
/* ---------- bloom ---------- */
/* Recording is a daily habit for six weeks a year, so the panel opens on today with
   the cursor already in the first line. Everything else on the screen is a read of
   what has been recorded, never a second place to type it. */
let bloomYear = null, draftBloom = null, armBloomDel = false;

/* What was in bloom yesterday is very nearly what is in bloom today, so a new day opens
   with the last one's cultivars and empty stem boxes: take off what has finished, add
   what has opened, type the numbers. A gap of more than a week is a different moment in
   the season — or a different season — so nothing is carried across it. */
const CARRY_DAYS = 10;
function blankBloom(date){
  const d = date || today();
  const last = bloomDays().find(x => x < d);
  const near = last && (Date.parse(d) - Date.parse(last)) / 86400000 <= CARRY_DAYS;
  const carried = near ? bloomsOn(last)
    .sort((a,b) => (cultivar(a.cultivarId).name || "").localeCompare(cultivar(b.cultivarId).name || ""))
    .map(r => ({ cultivarId: r.cultivarId, stems: "" })) : [];
  return { date: d, from: null, carriedFrom: carried.length ? last : null,
           lines: carried.concat([{ cultivarId:"", stems:"" }]) };
}
function loadBloom(date){
  return { date, from: date,
    lines: bloomsOn(date)
      .sort((a,b) => (cultivar(a.cultivarId).name || "").localeCompare(cultivar(b.cultivarId).name || ""))
      .map(r => ({ cultivarId:r.cultivarId, stems: r.stems === 0 ? "" : String(r.stems ?? "") }))
      .concat([{ cultivarId:"", stems:"" }]) };      // room to add one you missed
}
function discardBloomDraft(){ draftBloom = null; armBloomDel = false; }
/* A day was one visit with the bucket, so it comes out as one thing: every cultivar
   recorded against it goes together. First bloom, the day count and the length of the
   season all read off these rows, so they close over the gap on their own. */
function deleteBloomDay(date){
  const n = bloomsOn(date).length;
  if(!n) return 0;                                   // nothing there, nothing to save
  DB.blooms = DB.blooms.filter(b => b.date !== date);
  markDirty();
  return n;
}
/* Same rule as an order: one empty line at the end, never a stack of them. */
function trimBloomLines(){
  const before = draftBloom.lines.length;
  draftBloom.lines = draftBloom.lines.filter(l => l.cultivarId);
  draftBloom.lines.push({ cultivarId:"", stems:"" });
  return draftBloom.lines.length !== before;
}
const bloomStems = l => l.stems === "" ? 0 : Math.max(0, Math.round(Number(l.stems) || 0));
function bloomTotals(){
  const filled = draftBloom.lines.filter(l => l.cultivarId);
  return { filled, stems: filled.reduce((s,l) => s + bloomStems(l), 0) };
}

/* The day you opened is replaced by exactly what is on screen, so removing a line
   removes the record. A day you did not open is merged into, so catching up on
   yesterday cannot wipe what yesterday already said. */
function commitBloom(){
  const d = draftBloom, { filled } = bloomTotals();
  if(!filled.length && !d.from) return toast("Nothing to record");
  if(!d.date) return toast("Needs a date");
  if(d.from) DB.blooms = DB.blooms.filter(b => b.date !== d.from);
  for(const l of filled){
    const found = DB.blooms.find(b => b.date === d.date && b.cultivarId === l.cultivarId);
    /* An empty box means you did not count, so it never writes over a number the day
       already has — which is what makes a carried-forward line safe to leave alone. */
    if(found){ if(l.stems !== "") found.stems = bloomStems(l); }
    else DB.blooms.push({ id: nextBloomId(), date: d.date, cultivarId: l.cultivarId,
                          stems: bloomStems(l), notes: null });
  }
  /* Saving a day with every line taken off it is a delete by another route, so it
     says so rather than reporting that nothing was recorded. */
  const emptied = !filled.length, day = emptied ? d.from : d.date;
  discardBloomDraft(); markDirty(); render();
  saveNow(`${fmtDate(day)} ${emptied ? "deleted" : "recorded"}`);
}

function renderBloom(app){
  const years = bloomYears();
  /* Default to the season you are actually in; fall back to the last one recorded
     so an out-of-season visit still shows something. */
  const now = String(new Date().getFullYear());
  const year = bloomYear && years.includes(bloomYear) ? bloomYear
             : years.includes(now) ? now : (years[0] || now);
  const t = seasonTotals(year);
  const days = bloomDays().filter(d => d.startsWith(year));

  const yearPick = years.length > 1
    ? `<select id="by" style="width:auto;min-width:104px;flex:none">${
        years.map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>`
    : `<span class="seasontag num">${year}</span>`;

  app.innerHTML = `
  ${screenHead("Bloom", null, yearPick)}

  <div class="mstats">
    ${metric("Stems", t.stems, t.stems ? `cut in ${year}` : "none cut yet")}
    ${metric("Cultivars", t.cultivars, "bloomed this season")}
    ${metric("First bloom", t.first ? fmtDay(t.first) : "—", t.first ? `of ${year}` : "not yet recorded")}
    ${metric("Days", t.days, "logged")}
  </div>

  ${days.length ? `
  <h3 class="section" style="margin-bottom:8px">The days</h3>
  <div class="card flush">${days.map(d => {
    const rows = bloomsOn(d);
    const stems = rows.reduce((s,r) => s + (r.stems || 0), 0);
    const names = rows.map(r => cultivar(r.cultivarId).name || "Unnamed cultivar")
      .sort((a,b) => a.localeCompare(b));
    return li({
      go: true,
      data: ` data-day="${d}"`,
      lead: fmtDate(d),
      meta: esc(names.join(", ")),
      trail: `<span class="num">${stems || "—"}</span><span class="sub">${stems ? "stems" : "seen"}</span>`,
    });
  }).join("")}</div>
  <p class="small muted section">A day with no stems against it is a cultivar you saw in bloom but did not cut.
    ${years.length > 1 ? `Earlier seasons are behind the year above; each cultivar's page carries all of them
      side by side.` : ""}</p>`
  : `<div class="card section"><h3>Nothing recorded yet</h3>
      <p class="small muted" style="margin:8px 0 0">During bloom season, record a day as you come in with
      the bucket: the cultivars you cut from and how many stems each gave. First bloom, the length of the
      season and cost per stem all fall out of that.</p></div>`}

  ${fab("addBloom", "Record a day of blooms")}`;

  if(draftBloom) app.insertAdjacentHTML("beforeend", bloomSheet());

  /* Today, already recorded, opens for editing — never a second entry against the same day. */
  $("#addBloom").onclick = () => {
    draftBloom = bloomsOn(today()).length ? loadBloom(today()) : blankBloom();
    armBloomDel = false; render();
  };
  const yr = $("#by"); if(yr) yr.onchange = e => { bloomYear = e.target.value; render(); };
  app.querySelectorAll("[data-day]").forEach(el => el.onclick = () => {
    draftBloom = loadBloom(el.dataset.day); armBloomDel = false; render();
  });
  if(draftBloom) wireBloomSheet(app);
}

function bloomSheet(){
  const d = draftBloom;
  const taken = new Set(d.lines.map(l => l.cultivarId).filter(Boolean));
  const all = DB.cultivars.slice().sort((a,b) => (a.name||"").localeCompare(b.name||""));
  const held = d.from ? bloomsOn(d.from).length : 0;   // what is on the day as stored, not as edited

  /* Asked the same way as a transaction: the question takes over the footer instead of
     stacking a second sheet over one that is already a sheet. Only a stored day can be
     deleted — a new one has nothing behind it, so Discard is the whole of it. */
  const foot = armBloomDel
    ? `<div class="confirming">
         <p class="small">Delete ${fmtDate(d.from)}? The <span class="num">${held}</span>
           cultivar${held === 1 ? "" : "s"} recorded that day ${held === 1 ? "goes" : "go"} with it and the
           season's totals close over the gap. There is no way back.</p>
         <div class="acts">
           <button class="btn" id="blCancelDel">Cancel</button>
           <button class="btn danger" id="blDelDay">Delete the Day</button>
         </div></div>`
    : `<span class="small muted" id="blSum"></span>
       <div class="acts">
         <button class="btn primary" id="blSave">Save</button>
       </div>`;

  return sheet("bl", {
    title: d.from ? "Edit a day" : "Record a day",
    sub: d.from ? fmtDate(d.from)
       : d.carriedFrom ? `Carried from ${fmtDate(d.carriedFrom)} — take off what has finished`
       : "Nothing is added until you save",
    stacked: armBloomDel,
    body: `
      <div class="fieldrow">
        ${field("Date", `<input type="date" required id="bl-date" value="${d.date}">`)}
      </div>
      <table class="lines"><thead><tr>
        <th style="width:60%">Cultivar</th><th style="width:28%">Stems</th><th style="width:12%"></th>
      </tr></thead>
      <tbody>${d.lines.map((l,i) => `<tr>
        <td><select data-bi="${i}"><option value="">—</option>${
          all.filter(c => c.id === l.cultivarId || !taken.has(c.id))
             .map(c => `<option value="${esc(c.id)}" ${c.id === l.cultivarId ? "selected" : ""}>${
               esc(c.name || "Unnamed cultivar")}</option>`).join("")}</select></td>
        <td><input type="number" inputmode="numeric" min="0" step="1" data-bs="${i}" value="${esc(l.stems)}" placeholder="0"></td>
        <td class="r">${l.cultivarId ? `<button class="rowx" data-bx="${i}" aria-label="Remove this line">&times;</button>` : ""}</td>
      </tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin:10px 0 0">A new line appears as you pick a cultivar.
        Leave the stems empty for something you saw in bloom but did not cut.</p>
      ${d.from ? `<button class="btn danger wide section" id="blDel">Delete This Day</button>` : ""}`,
    foot
  });
}
function paintBloom(){
  if(!draftBloom) return;
  const t = bloomTotals(), sum = $("#blSum"), save = $("#blSave");
  if(sum) sum.innerHTML = t.filled.length
    ? `<span class="num">${t.stems}</span> stem${t.stems === 1 ? "" : "s"} · <span class="num">${
        t.filled.length}</span> cultivar${t.filled.length === 1 ? "" : "s"} in bloom`
    : "";
  if(save) save.disabled = !t.filled.length && !draftBloom.from;
}

function wireBloomSheet(app){
  const d = draftBloom;
  const shut = () => { discardBloomDraft(); render(); };
  $("#blClose").onclick = shut;
  $("#blBack").onclick = e => { if(e.target.id === "blBack") shut(); };
  $("#bl-date").onchange = e => { d.date = e.target.value; };

  app.querySelectorAll("[data-bi]").forEach(el => el.onchange = () => {
    d.lines[el.dataset.bi].cultivarId = el.value;
    trimBloomLines(); render();                 // the list of what is left to pick changes
  });
  app.querySelectorAll("[data-bs]").forEach(el => {
    el.oninput = () => { d.lines[el.dataset.bs].stems = el.value; paintBloom(); };
  });
  app.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => {
    d.lines.splice(Number(b.dataset.bx), 1); trimBloomLines(); render();
  });

  /* Half the footer is gone while the question is up, so each button is asked for
     rather than assumed. */
  const on = (sel, fn) => { const el = $(sel); if(el) el.onclick = fn; };
  on("#blSave", commitBloom);
  on("#blDel", () => { armBloomDel = true; render(); });
  on("#blCancelDel", () => { armBloomDel = false; render(); });
  on("#blDelDay", () => {
    const day = d.from;
    deleteBloomDay(day);
    discardBloomDraft(); render();
    saveNow(`${fmtDate(day)} deleted`);
  });
  paintBloom();
}
/* ---------- ledger ---------- */
/* A ledger is read in a few habitual ways — all of it, what has just gone out, or one
   season at a time — so those are one tap each and the two date boxes are kept for the
   rest. The seasons are read off the transactions themselves, so the list is however
   many years the farm has actually been keeping books.

   An open-ended range: either end can be left empty. Dates are ISO strings, so a plain
   string comparison is a date comparison. A transaction with no date at all sits
   outside any range rather than drifting to one end of it. */
let ledRange = "all", ledFrom = "", ledTo = "";
/* At most the two most recent seasons that actually have anything in them. Every year
   the books have ever covered would be a rail that grows a button a year and pushes
   Custom off the end of it — and Custom is what reaches the older ones. */
const ledYears = () => [...new Set(DB.transactions.map(t => (t.date || "").slice(0,4))
  .filter(Boolean))].sort().reverse().slice(0, 2);
function ledBounds(){
  if(ledRange === "custom") return [ledFrom, ledTo];
  if(/^\d{4}$/.test(ledRange)) return [ledRange + "-01-01", ledRange + "-12-31"];
  return ["", ""];
}
const inBounds = (x, f, t) =>
  (!f && !t) ? true : !x.date ? false : (!f || x.date >= f) && (!t || x.date <= t);
/* Said the way you would say it out loud, and only saying what the lit chip does not
   already say — a year chip has the year on it, so repeating Jan 1 to Dec 31 back is
   noise. A range with one open end is not a pair of dates and is not shown as one. */
function ledWords(f, t){
  if(/^\d{4}$/.test(ledRange)) return `all of ${ledRange}`;
  return !f && !t ? "every transaction"
    : f && t ? `${fmtDate(f)} to ${fmtDate(t)}`
    : f ? `${fmtDate(f)} onwards`
    : `up to ${fmtDate(t)}`;
}
/* ---------- looking back at a transaction ---------- */
/* Read-only on purpose. A saved plant order is the record of what the plants cost,
   and those plants have positions and histories hanging off it; correcting one
   means deleting it and recording it again, which is deliberate rather than easy. */
let openTxn = null, armDelete = false, armPlant = false;
function closeTxnView(){ openTxn = null; armDelete = armPlant = false; editing = null; render(); }

/* An order is a batch, and a batch goes in the ground together: one weekend, one date,
   one click. That is the only moment here worth a button of its own — a box that has
   landed is not a stage, it is a root in your hands, which is where every root starts. */
const orderPlants = x => (x.allocations || [])
  .filter(a => a.target === "plant")
  .map(a => DB.plants.find(p => p.id === a.targetId))
  .filter(Boolean);

/* Roots already in the ground are left alone — this only ever moves things forward. */
function markOrder(x, date){
  let n = 0;
  for(const p of orderPlants(x)) if(NOT_YET_IN.includes(p.status)){
    p.status = PLANTED;
    p.plantedDate = date || null;
    n++;
  }
  armPlant = false;
  if(!n){ toast("Nothing left to mark planted"); return 0; }
  markDirty(); render();
  saveNow(`${n} root${n === 1 ? "" : "s"} marked planted`);
  return n;
}
function stageSummary(ps){
  const c = {};
  for(const p of ps) c[p.status] = (c[p.status] || 0) + 1;
  return STATUSES.filter(st => c[st])
    .map(st => `<span class="num">${c[st]}</span> ${st.toLowerCase()}`).join(" · ");
}

/* Kind is never stored. A plant order is simply an expense that bought plants,
   and that is legible from the allocations. */
function txnKindOf(x){
  if(x.direction === "income") return TXN_KINDS[2];
  return (x.allocations || []).some(a => a.target === "plant") ? TXN_KINDS[0] : TXN_KINDS[1];
}

/* The range lives behind a chip rather than on the screen: most visits want everything,
   and two date fields sitting open would cost a third of a phone screen to say so. */
/* What the range decides, and nothing else. Kept apart from the screen around it so a
   change of dates can repaint these without rebuilding the two date boxes — a native
   picker dies the moment the input under it is replaced, which is what made choosing a
   date open the picker, take today, and shut again. */
function ledSub(list, all){
  return (!!(ledBounds()[0] || ledBounds()[1]))
    ? `<span class="num">${list.length}</span> of <span class="num">${all.length}</span> transactions`
    : `<span class="num">${all.length}</span> transaction${all.length === 1 ? "" : "s"}`;
}
function ledTiles(list){
  const t = totals(list), spent = list.filter(x => x.direction !== "income").length;
  return `
    ${metric("Out", fmt(t.out), `${spent} transaction${spent === 1 ? "" : "s"}`)}
    ${metric("In", fmt(t.inc), t.inc ? "revenue recorded" : "nothing yet")}
    ${metric("Allocated", fmt(t.alloc), "attached to plants")}
    ${metric("Overhead", fmt(t.overhead), "unallocated")}`;
}
function ledNote(lf, lt){
  return (lf || lt)
    ? `${ledWords(lf, lt)} — the figures above follow the range.` : "";
}
function ledRows(list){
  return list.length ? list.map(x => {
    const b = txBalance(x);
    return li({
      go: true,
      data: ` data-tx="${x.id}"`,
      lead: esc(x.counterparty),
      meta: `${fmtDate(x.date)}${x.description ? " · " + esc(x.description) : ""}`,
      trail: `<span class="num">${signed(x)}</span>
        <span class="sub">${(x.allocations || []).length
          ? `${x.allocations.length} plant${x.allocations.length > 1 ? "s" : ""}${
              b.balanced ? "" : ` <span class="warn">off ${fmt(Math.abs(b.diff))}</span>`}`
          : esc(x.category || "—")}</span>`,
    });
  }).join("") : `<div class="emptyrow">Nothing in that range.</div>`;
}
const ledList = () => {
  const [lf, lt] = ledBounds();
  return DB.transactions.filter(x => inBounds(x, lf, lt)).slice()
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));
};
/* Redraw what the dates decide, leaving the dates themselves alone. */
function paintLedger(){
  const list = ledList(), [lf, lt] = ledBounds();
  const sub = $("#ledSub"), tiles = $("#ledTiles"), note = $("#ledNote"), rows = $("#ledRows");
  if(sub) sub.innerHTML = ledSub(list, DB.transactions);
  if(tiles) tiles.innerHTML = ledTiles(list);
  if(note) note.innerHTML = ledNote(lf, lt);
  if(rows){ rows.innerHTML = ledRows(list); wireLedRows(rows); }
}
function wireLedRows(root){
  root.querySelectorAll("[data-tx]").forEach(el => el.onclick = () => {
    openTxn = Number(el.dataset.tx); armDelete = armPlant = false; render();
  });
}

function renderLedger(app){
  const all = DB.transactions;
  const [lf, lt] = ledBounds();
  const list = ledList();
  const ranged = !!(lf || lt);

  app.innerHTML = `
  ${screenHead("Ledger", `<span id="ledSub">${ledSub(list, all)}</span>`)}

  <div class="mstats" id="ledTiles">${ledTiles(list)}</div>

  <div class="chips section">
    <button class="fchip ${ledRange === "all" ? "on" : ""}" data-lr="all">All</button>
    ${ledYears().map(y => `<button class="fchip ${ledRange === y ? "on" : ""}" data-lr="${y}">${y}</button>`).join("")}
    <button class="fchip ${ledRange === "custom" ? "on" : ""}" data-lr="custom">Custom</button>
  </div>
  ${ledRange === "custom" ? `<div class="card section">
    <div class="fieldrow pair" style="margin:0">
      ${field("From", `<input type="date" id="lfrom" value="${ledFrom}">`)}
      ${field("To", `<input type="date" id="lto" value="${ledTo}">`)}
    </div>
    <p class="small muted" style="margin:10px 0 0">Either end can be left empty — from a date
      onwards, or everything up to one.</p>
  </div>` : ""}
  <p class="small muted" style="margin:10px 0 0" id="ledNote">${ledNote(lf, lt)}</p>

  <div class="card flush section" id="ledRows">${ledRows(list)}</div>

  <p class="small muted section">Unallocated spending is overhead. Per-plant cost is derived from these
    allocations, never typed twice.</p>

  ${fab("addTxn", "Record a transaction")}`;

  /* Panels graft on with insertAdjacentHTML, which leaves what is already there
     untouched — so handlers attached earlier survive and the order stopped mattering. */
  const open = openTxn === null ? null : DB.transactions.find(x => x.id === openTxn);
  if(openTxn !== null && !open) openTxn = null;
  if(draftTxn) app.insertAdjacentHTML("beforeend", txnSheet());
  else if(open) app.insertAdjacentHTML("beforeend", txnView(open));

  app.querySelectorAll("[data-lr]").forEach(el => el.onclick = () => {
    ledRange = el.dataset.lr;
    /* Coming back to Custom with nothing in the boxes shows everything, which is what
       the empty boxes honestly mean — the chip is lit so it is clear why. */
    render();
  });
  /* Repaint rather than re-render: the picker sits on top of the very input a render
     would replace, and replacing it under the picker is what closed it. */
  const lfEl = $("#lfrom"); if(lfEl) lfEl.onchange = e => { ledFrom = e.target.value; paintLedger(); };
  const ltEl = $("#lto");   if(ltEl) ltEl.onchange = e => { ledTo   = e.target.value; paintLedger(); };
  $("#addTxn").onclick = () => { draftTxn = blankTxn("order"); render(); };
  wireLedRows(app);
  if(draftTxn) wireTxnSheet(app);
  else if(open) wireTxnView(app, open);
}

/* ---------- looking back at a transaction ---------- */
function txnView(x){
  const k = txnKindOf(x), b = txBalance(x), on = isEditing("t:" + x.id);
  const rows = (x.allocations || []).filter(a => a.target === "plant").map(a => {
    const p = DB.plants.find(q => q.id === a.targetId);
    return { id:a.targetId, amount:a.amount, alive:!!p,
             name: p ? (cultivar(p.cultivarId).name || "Unnamed cultivar") : "deleted plant" };
  });
  const n = rows.length, roots = `${n} plant${n === 1 ? "" : "s"}`;
  const ps = orderPlants(x);
  const canPlant = ps.filter(p => NOT_YET_IN.includes(p.status)).length;
  const orderActs = armPlant
    ? `<div class="fieldrow pair" style="margin:14px 0 6px">
         ${field("Planted on", `<input type="date" required id="tvPlantDate" value="${today()}">`)}
         <div><label>&nbsp;</label><button class="btn primary wide" id="tvPlantGo">Mark ${canPlant} Planted</button></div>
       </div>
       <button class="btn wide" id="tvPlantCancel">Cancel</button>`
    : canPlant
      ? `<button class="btn wide" id="tvPlant" style="margin:12px 0 2px">Mark ${canPlant} Planted</button>`
      : "";

  const foot = armDelete
    ? `<div class="confirming">
         <p class="small">Delete this ${k.label.toLowerCase()}?${n
           ? ` The ${roots} it paid for stay in your collection, but lose the cost recorded against them.`
           : " There is no way back."}</p>
         <div class="acts">
           <button class="btn" id="tvCancel">Cancel</button>
           <button class="btn danger" id="tvDelOne">Delete ${n ? "the Order Only" : "It"}</button>
           ${n ? `<button class="btn danger" id="tvDelBoth">Delete It and the ${titleCase(roots)}</button>` : ""}
         </div></div>`
    : `<span class="small muted">${n
         ? `${roots} · <span class="num">${fmt(b.allocated)}</span> allocated`
         : x.direction === "income"
           ? (x.units ? `<span class="num">${x.units}</span> ${unitWord(x.category, x.units)} ·
               <span class="num">${fmt(x.amount / x.units)}</span> each` : "")
           : "Overhead — not attached to any plant"}</span>
       <div class="acts">
         <button class="btn danger" id="tvDel">Delete</button>
         ${on ? `<button class="btn primary" id="tvSave">Save</button>`
              : `<button class="btn primary" id="tvEdit">Edit</button>`}
       </div>`;

  const facts = `<div class="kvlist">
    ${kv(k.dir === "income" ? "Customer" : "Vendor", x.counterparty)}
    ${kv("Date", x.date ? fmtDate(x.date) : null)}
    ${kv("Amount", signed(x))}
    ${x.units != null ? kv(unitsLabel(x.category), x.units) : ""}
    ${on ? "" : kv("Category", x.category)}
    ${on ? "" : kv("Description", x.description)}
  </div>
  ${on ? `<div class="fieldrow" style="margin-top:14px">
      ${field("Category", F.sel("t", x.id, "category", x.category,
        x.direction === "income" ? CAT_IN : CAT_OUT))}
    </div>
    <div class="fieldrow">
      ${field("Description", F.text("t", x.id, "description", x.description, "what it was for"))}
    </div>
    <p class="small muted" style="margin:-2px 0 4px">How it was filed is yours to change.
      Who, when and how much are the record of what happened, so they stay put.</p>` : ""}`;

  const paid = n ? `
    <div class="between" style="margin-top:24px"><h3 style="margin:0">What it paid for</h3>
      <span class="small muted">${stageSummary(ps)}</span></div>
    ${orderActs}
    <div class="card flush" style="margin-top:10px">${rows.map(r => li({
      go: r.alive,
      cls: r.alive ? "" : "static",
      data: r.alive ? ` data-goplant="${r.id}"` : "",
      lead: esc(r.name),
      meta: `plant <span class="num">${r.id}</span>`,
      trail: `<span class="num">${fmt(r.amount)}</span>`,
    })).join("")}</div>
    <p class="small muted" style="margin:10px 0 0">${b.balanced
      ? `Adds up to ${fmt(x.amount)} exactly.`
      : `<span class="warn">Off by ${fmt(Math.abs(b.diff))}</span> against the ${fmt(x.amount)} charge.`}</p>` : "";

  return sheet("tv", {
    title: k.label,
    sub: fmtDate(x.date),
    stacked: true,
    body: facts + paid,
    foot
  });
}

/* ---------- recording one ---------- */
function txnSheet(){
  const t = draftTxn, kind = TXN_KINDS.find(k => k.id === t.kind);
  const known = [...new Set(DB.cultivars.map(v => v.name))].sort();
  const cats = kind.dir === "income" ? CAT_IN : CAT_OUT;
  const party = kind.dir === "income" ? "Customer" : "Vendor";
  const partyBox = picker("party", `id="t-party"`, t.counterparty,
    PARTIES(kind.dir), `+ New ${party.toLowerCase()}…`);

  /* A root at a time, each one its own little card — five columns of a desktop table
     will not survive a phone, but the same three facts will. */
  const orderForm = `
    <div class="fieldrow">${field(party, partyBox)}</div>
    <div class="fieldrow pair">
      ${field("Date", `<input type="date" required id="t-date" value="${t.date}">`)}
      ${field("Shipping", `<input id="t-ship" inputmode="decimal" value="${esc(t.shipping)}" placeholder="0.00">`)}
    </div>
    <div class="fieldrow pair">
      ${field("Tax", `<input id="t-tax" inputmode="decimal" value="${esc(t.tax)}" placeholder="0.00">`)}
      <div></div>
    </div>
    <h3 style="margin:18px 0 8px">The roots</h3>
    ${t.lines.map((l,i) => `<div class="lineitem">
      ${picker("line" + i, `data-line="${i}"`, l.name, known, "+ New cultivar…")}
      <div class="qp">
        <div><label>Qty</label><input type="number" inputmode="numeric" min="1" step="1"
          data-i="${i}" data-f="qty" value="${esc(l.qty)}"></div>
        <div><label>Unit price</label><input inputmode="decimal"
          data-i="${i}" data-f="price" value="${esc(l.price)}" placeholder="0.00"></div>
      </div>
      <div class="between" style="margin-top:8px">
        <span class="small muted">Line <span class="num" id="lt_${i}">&mdash;</span></span>
        ${hasContent(l) ? `<button class="rowx" data-del="${i}" aria-label="Remove this line">&times;</button>` : `<span></span>`}
      </div>
    </div>`).join("")}
    <p class="small muted" style="margin:4px 0 0">A new line appears as you fill the last one.
      Shipping splits evenly per root; tax splits by what each root cost.</p>
    <div id="allocBox"></div>`;

  const simpleForm = `
    <div class="fieldrow">${field(party, partyBox)}</div>
    <div class="fieldrow pair">
      ${field("Date", `<input type="date" required id="t-date" value="${t.date}">`)}
      ${field("Amount", `<input id="t-amount" inputmode="decimal" value="${esc(t.amount)}" placeholder="0.00">`)}
    </div>
    <div class="fieldrow ${kind.dir === "income" ? "pair" : ""}">
      ${field("Category", `<select id="t-cat"><option value="">—</option>${
        cats.map(c => `<option ${t.category === c ? "selected" : ""}>${c}</option>`).join("")}</select>`)}
      ${kind.dir === "income" ? field(unitsLabel(t.category),

}

/* ---------- the transaction sheet ---------- */
/* One panel, three kinds of transaction. Nothing is written until Save, the same as
   a new plant or cultivar. A plant order is the only kind that creates records
   beyond the ledger entry itself. */
const TXN_KINDS = [
  { id:"order",   label:"Plant order", dir:"expense" },
  { id:"expense", label:"Expense",     dir:"expense" },
  { id:"income",  label:"Income",      dir:"income"  },
];
let draftTxn = null;
function blankTxn(kind = "order", carry = {}){
  return { kind, date: carry.date || today(),
    counterparty: carry.counterparty || "", description: "", amount: "", units: "",
    category: "", shipping: "", tax: "", lines: [{ name:"", qty:1, price:"" }] };
}
function discardTxnDraft(){ draftTxn = null; clearNew(); }

const hasContent = l => !!(String(l.name).trim() || String(l.price).trim());
/* Keep exactly one empty line at the end, so there is always somewhere to type
   and never a stack of identical blanks. Returns true if the shape changed. */
function trimLines(){
  const before = draftTxn.lines.length;
  draftTxn.lines = draftTxn.lines.filter(hasContent);
  draftTxn.lines.push({ name:"", qty:1, price:"" });
  return draftTxn.lines.length !== before;
}
function orderTotals(){
  const lineTotal = l => cents(l.price) * (Number(l.qty) || 0);
  const sub = draftTxn.lines.reduce((s,l) => s + lineTotal(l), 0);
  const ship = cents(draftTxn.shipping), tax = cents(draftTxn.tax);
  const filled = draftTxn.lines.filter(l => l.name.trim() && Number(l.qty) > 0);
  return { lineTotal, sub, ship, tax, total: sub + ship + tax, filled,
           roots: filled.reduce((s,l) => s + Number(l.qty), 0) };
}
function paintOrder(){
  if(!draftTxn || draftTxn.kind !== "order") return;
  const t = orderTotals();
  draftTxn.lines.forEach((l,i) => {
    const cell = document.getElementById("lt_" + i);
    if(cell) cell.textContent = t.lineTotal(l) ? fmt(t.lineTotal(l)/100) : "—";
  });
  const sum = $("#txSum"), box = $("#allocBox"), save = $("#txSave");
  if(sum) sum.innerHTML = `Subtotal <span class="num">${fmt(t.sub/100)}</span>` +
    (t.ship ? ` · shipping <span class="num">${fmt(t.ship/100)}</span>` : "") +
    (t.tax ? ` · tax <span class="num">${fmt(t.tax/100)}</span>` : "") +
    ` · <span class="num">${t.roots}</span> root${t.roots === 1 ? "" : "s"}` +
    ` · total <span class="num">${fmt(t.total/100)}</span>`;
  if(save) save.disabled = !t.filled.length;
  if(box) box.innerHTML = t.filled.length
    ? `<div style="margin-top:16px"><h3>Allocation preview</h3>
        <table><tbody>${previewAlloc(t.filled, t.ship, t.tax).map(r => `<tr style="cursor:default">
          <td>${esc(r.name)}</td><td class="r num">${fmt(r.amount/100)}</td></tr>`).join("")}</tbody></table>
        <p class="small muted" style="margin:10px 0 0">Sums to ${fmt(t.total/100)} exactly.</p></div>`
    : "";
}
function paintSimple(){
  if(!draftTxn || draftTxn.kind === "order") return;
  const amt = cents(draftTxn.amount), save = $("#txSave"), sum = $("#txSum");
  if(sum) sum.innerHTML = amt ? `${draftTxn.kind === "income" ? "In" : "Out"} <span class="num">${fmt(amt/100)}</span>` : "";

const paintTxn = () => { paintOrder(); paintSimple(); };

function wireTxnSheet(app){

  const shut = () => { discardTxnDraft(); render(); };
  $("#txClose").onclick = shut;
  $("#txDiscard").onclick = shut;

    });

    $("#t-tax").oninput = e => { t.tax = e.target.value; paintTxn(); };
    $("#txSave").onclick = () => { const o = orderTotals(); commitOrder(o.filled, o.ship, o.tax); };
  }else{
    $("#t-amount").oninput = e => { t.amount = e.target.value; paintTxn(); };
    $("#t-cat").onchange = e => {
      t.category = e.target.value;

    };
    const un = $("#t-units"); if(un) un.oninput = e => { t.units = e.target.value; };
    $("#t-desc").oninput = e => { t.description = e.target.value; };
    $("#txSave").onclick = () => {
      const amt = cents(t.amount);
      if(!amt || !t.counterparty.trim()) return toast("Needs a name and an amount");
      const u = t.kind === "income" && String(t.units).trim() !== ""
        ? Math.max(0, Math.round(Number(t.units) || 0)) : null;
      DB.transactions.push({ id: nextTxId(), date: t.date || null,
        direction: t.kind === "income" ? "income" : "expense",
        counterparty: t.counterparty.trim(), description: t.description.trim() || null,
        amount: amt/100, category: t.category || "Other", allocations: [],

    };
  }
  paintTxn();
}
/* A remainder of a few cents, handed out one at a time to the dearest roots first.
   Works in both directions, because proportional rounding can overshoot. */
function spreadRemainder(out, rem){
  if(!rem || !out.length) return;
  const order = out.map((_,i) => i).sort((a,b) => out[b].base - out[a].base || a - b);
  const step = rem > 0 ? 1 : -1;
  for(let i = 0; rem !== 0; i++){ out[order[i % order.length]].amount += step; rem -= step; }
}
/* Shipping is charged for moving roots, so it splits evenly per root.
   Tax is charged on value, so it splits in proportion to what each root cost.
   Either way the allocations add up to the charge exactly. */
function previewAlloc(filled, ship, tax = 0){
  const out = [];
  for(const l of filled){
    const unit = cents(l.price);
    for(let k = 0; k < Number(l.qty); k++) out.push({ name:l.name.trim(), base:unit, amount:unit });
  }
  if(!out.length) return out;
  const sub = out.reduce((s,r) => s + r.base, 0);

  if(ship > 0){
    const share = Math.floor(ship / out.length);
    out.forEach(r => r.amount += share);
    spreadRemainder(out, ship - share * out.length);
  }
  if(tax > 0){
    let given = 0;
    out.forEach(r => {
      const share = sub > 0 ? Math.round(tax * r.base / sub) : Math.floor(tax / out.length);
      r.amount += share; given += share;
    });
    spreadRemainder(out, tax - given);
  }
  return out;
}

function commitOrder(filled, ship, tax = 0){
  const vendor = (draftTxn.counterparty || "").trim();
  if(!vendor) return toast("Vendor is required");
  const rows = previewAlloc(filled, ship, tax);
  const total = rows.reduce((s,r)=>s+r.amount,0);
  if(total <= 0) return toast("Nothing to record");

  const allocations = [];
  let pid = nextPlantId();
  for(const r of rows){
    /* A cultivar whose name has been cleared holds null there, which the rest of the app
       reads as "v.name || ..." everywhere it is drawn. This was the one place that took
       it as a string, and an order recorded after emptying one name raised a TypeError
       and recorded nothing. An unnamed cultivar simply matches nothing. */
    const want = r.name.toLowerCase();
    let v = DB.cultivars.find(x => (x.name || "").toLowerCase() === want);
    if(!v){
      v = newCultivar(r.name);          // one definition of what a cultivar is
    }
    DB.plants.push({ id:pid, cultivarId:v.id, label:null, status:ACQUIRED, source:vendor,
      acquiredDate:draftTxn.date || null, plantedDate:null, eyeCount:null,
      x:null, y:null, soil:null, parentPlantId:null, diseaseIssues:null, notes:null });
    allocations.push({ target:"plant", targetId:pid, amount: r.amount/100 });
    pid++;
  }

  DB.transactions.push({
    id: nextTxId(), date: draftTxn.date || null, direction:"expense",
    counterparty: vendor,
    description: `${rows.length} root${rows.length > 1 ? "s" : ""}` +
      (ship || tax ? ` (${[ship ? `$${(ship/100).toFixed(2)} shipping` : "", tax ? `$${(tax/100).toFixed(2)} tax` : ""].filter(Boolean).join(", ")})` : ""),
    amount: total/100, category:"Plants", allocations
  });

  discardTxnDraft();
  markDirty(); saveNow();
  toast(`${rows.length} plant${rows.length > 1 ? "s" : ""} added`);
  location.hash = "#/collection";

/* ---------- property map ---------- */
const live = p => !["Lost","Sold","Divided"].includes(p.status);
function mapped(){ return DB.plants.filter(p => live(p) && p.x !== null && p.y !== null); }
/* The dot's colour is its stage: a plan is charcoal, a peony in the ground is rose. Only
   three statuses ever reach the map — Planned, Planted, Established — so that is the
   whole of the question. Crowded used to be the charcoal one; it is a ring now, so it
   can flag a plan and a planted peony alike rather than being drowned out by one. */
/* Charcoal for a plan, and two depths of rose for what is actually in the ground: the
   lighter for a crown newly planted, the deeper for one that has settled. Far enough
   apart to tell at a glance, near enough that they plainly say the same thing — a peony
   that is there. The plan/planted split is a different kind of difference and looks it:
   several times the distance, and not even the same hue. The settled rose sits between
   the planted one and the --rose-dark the Established pill already wears, which is that
   colour weighted for a filled dot rather than for text. */
const INK_PLAN = "#3A3A3C", ROSE_PLANTED = "#C25A6D", ROSE_SETTLED = "#8A3D4C";
const pinFill = p => p.status === PLANNED ? INK_PLAN

/* The colour a peony is about to become, for the thing being carried towards a square.
   One not in the ground yet lands as a plan whichever of the two it starts as: Acquired
   becomes Planned on the way down, and Planned stays Planned. So what is carried is
   drawn as what it will be, rather than as what everything else happens to be. */
/* What it will be once it is down — which for anything not in the ground yet is a
   plan, and otherwise is whatever it already is. */
const dropFill = p => NOT_YET_IN.includes(p.status) ? INK_PLAN : pinFill(p);
/* Only a plan moves, which is exactly the charcoal ones. A crown in the ground has
   roots where it is: where it sits is a fact about the farm rather than a thought you
   are still having, and the way it leaves the map is the divide — something that
   happened out there, not a change of mind about where to put it. */
const movable = p => p.status === PLANNED;
function unmapped(){ return DB.plants.filter(p => live(p) && (p.x === null || p.y === null)); }

/* The map is a grid of 3 ft cells and a cell holds at most one peony, which is
   what actually enforces spacing — snapped plants can never sit closer than 3 ft. */
const CELL = () => DB.property.cellFt || 3;
const cellX = p => Math.floor(p.x / CELL());
const cellY = p => Math.floor(p.y / CELL());
const cellCenter = (cx, cy) => ({ x:(cx + 0.5) * CELL(), y:(cy + 0.5) * CELL() });
function cellFree(cx, cy, exceptId){
  const P = DB.property;
  if(cx < 0 || cy < 0 || (cx+0.5)*CELL() > P.widthFt || (cy+0.5)*CELL() > P.depthFt) return false;
  return !DB.plants.some(p => p.id !== exceptId && p.x !== null && live(p) && cellX(p) === cx && cellY(p) === cy);
}
/* Snap to the cell under the point; if it's taken, spiral out to the closest free one. */
function snapFree(x, y, exceptId){
  const c = CELL(), bx = Math.floor(x/c), by = Math.floor(y/c);
  if(cellFree(bx, by, exceptId)) return cellCenter(bx, by);
  for(let r = 1; r <= 60; r++){
    let best = null, bestD = Infinity;
    for(let dx = -r; dx <= r; dx++) for(let dy = -r; dy <= r; dy++){
      if(Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      if(!cellFree(bx+dx, by+dy, exceptId)) continue;
      const q = cellCenter(bx+dx, by+dy), d = Math.hypot(q.x-x, q.y-y);
      if(d < bestD){ bestD = d; best = q; }
    }
    if(best) return best;
  }
  return null;
}

/* Pairs sitting closer than SPACING_FT center to center, anywhere on the property. */
function clashes(){
  const ps = mapped(), ids = new Set(), pairs = [];
  /* Nothing further apart than SPACING_FT can be crowded, so only the eight squares
     around a peony are worth measuring against. Same pairs, in the same order. */
  const key = (a,b) => a + ":" + b, buckets = new Map(), at = new Map();
  for(let i=0;i<ps.length;i++){
    const p = ps[i];
    at.set(p, i);
    const k = key(Math.floor(p.x/SPACING_FT), Math.floor(p.y/SPACING_FT));
    let a = buckets.get(k); if(!a) buckets.set(k, a = []); a.push(p);
  }
  const seen = new Set();
  for(let i=0;i<ps.length;i++){
    const p = ps[i], bx = Math.floor(p.x/SPACING_FT), by = Math.floor(p.y/SPACING_FT);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++)
      for(const q of (buckets.get(key(bx+dx, by+dy)) || [])){
        const j = at.get(q);
        if(j <= i) continue;                       // each pair once, in the old order
        const d = Math.hypot(p.x-q.x, p.y-q.y);
        if(d < SPACING_FT){ ids.add(p.id); ids.add(q.id); pairs.push({a:p, b:q, d}); }
      }
  }
  return {ids, pairs};
